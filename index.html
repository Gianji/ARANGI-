const kmTra = (a,b,c,e) => { const R = 6371, q = x => x * Math.PI / 180, h = Math.pow(Math.sin(q(c-a)/2),2) + Math.cos(q(a)) * Math.cos(q(c)) * Math.pow(Math.sin(q(e-b)/2),2); return 2 * R * Math.asin(Math.sqrt(h)); };
const snv = (v,si,no) => v === 'Si' ? si : v === 'No' ? no : null;
function dossierPct(im){
  const doc = im.documenti || {};
  const app = Object.keys(doc).filter(t => (doc[t] || {}).stato !== 'non-applicabile');
  if(!app.length) return null;
  const ok = app.filter(t => (doc[t] || {}).stato === 'presente').length;
  return ok / app.length;
}
window.dossierIm = function(im){
  const doc = im.documenti || {};
  const app = Object.keys(doc).filter(t => (doc[t] || {}).stato !== 'non-applicabile');
  const ok = app.filter(t => (doc[t] || {}).stato === 'presente').length;
  return { ok, tot:app.length, pct:app.length ? Math.round(ok / app.length * 100) : 0 };
};

    case 'multi': case 'multiNo': { const a = A(r[rk(f)]).filter(x => x !== 'Indifferente'); return a.length ? a : null; }
    case 'sn':    { const v = r[rk(f)]; return v === 'Meglio' ? 'Si' : (v === 'Si' || v === 'No') ? v : null; }
    case 'ord':   { if(f.rqv) return f.rqv(r); const v = r[rk(f)]; return f.opts && f.opts.indexOf(v) >= 0 ? v : null; }
    case 'num':   { const lo = parseNum(r[f.rqMin || f.k+'Min']); let hi = parseNum(r[f.rqMax || f.k+'Max']); if(hi === null && f.hiFb) hi = f.hiFb(r); return (lo === null && hi === null) ? null : { lo, hi }; }
    case 'tag': case 'tagNo': { const a = String(r[f.k] || '').split(',').map(lw).filter(Boolean); return a.length ? a : null; }
    case 'custom':return f.rqv(r);
  }
  return null;
}
function impEff(f,r){
  let v = r.requisiti && r.requisiti[f.k]; v = LEG[v] || v;
  if(IMP[v]) return v;
  if(f.leg){ const raw = r[f.k]; return (raw === 'Si' || raw === 'No') ? 'indispensabile' : 'media'; }
  return f.def;
}
function sc(f,rv,iv){
  switch(f.t){
    case 'multiNo': { const b = A(iv); if(!b.length) return null; return rv.some(x => b.some(y => lw(x) === lw(y))) ? 0 : 1; }
    case 'multi': { const b = A(iv); if(!b.length) return null; return rv.some(x => b.some(y => lw(x) === lw(y))) ? 1 : 0; }
    case 'sn':    { if(iv !== 'Si' && iv !== 'No') return null; return iv === rv ? 1 : 0; }
    case 'ord':   { const ii = f.opts.indexOf(iv); if(ii < 0) return null; const d = ii - f.opts.indexOf(rv); return d <= 0 ? 1 : Math.max(0, 1 - d / (f.tol || 2)); }
    case 'num':   { if(iv === null || iv === undefined) return null; let gap = 0, ref = 1;
                    if(rv.hi !== null && iv > rv.hi){ gap = iv - rv.hi; ref = rv.hi; }
                    else if(rv.lo !== null && iv < rv.lo){ gap = rv.lo - iv; ref = rv.lo; }
                    if(!gap) return 1;
                    return Math.max(0, 1 - (f.tolAbs ? gap / f.tolAbs : gap / ref / (f.tol || .1))); }
    case 'tagNo': { if(!iv) return null; return rv.some(t => iv.indexOf(t) >= 0) ? 0 : 1; }
    case 'tag':   { if(!iv) return null; return rv.filter(t => iv.indexOf(t) >= 0).length / rv.length; }
    case 'custom':return f.fn(rv,iv);
  }
  return null;
}
function imVal(f,im,d,r){
  if(f.imv) return f.imv(im,d,r);
  const key = ik(f);
  if(COND_KEYS.includes(key)){
    const c = condoData(im);
    if(c){
      const ds = c.datiStrutturali || {};
      if(key === 'annoCostruzione' && c.annoCostruzione) return c.annoCostruzione;
      if(ds[key] !== undefined && ds[key] !== null && ds[key] !== '') return ds[key];
    }
  }
  const v = d[key];
  if(f.t === 'num') return parseNum(v);
  return (v === '' || v === undefined) ? null : v;
}
function match(im,per){
  const r = per.richiesta || {}, d = im.dettagli || {}, righe = [];
  CAT.forEach(f => {
    if(f.t === 'dato' || f.ui === 'im') return;
    if(f.dep){
      const ctx = Object.assign({}, d, r);
      if(!f.dep(ctx)) return;
    }
    const rv = reqVal(f,r); if(rv === null || rv === undefined) return;
    const imp = impEff(f,r); if(imp === 'indifferente') return;
    righe.push({ f, imp, s:sc(f,rv,imVal(f,im,d,r)) });
  });
  REGOLE.forEach(g => { if(g.on(r)){ const imp = impEff(g,r); if(imp !== 'indifferente') righe.push({ f:g, imp, s:g.val(im,d,r) }); } });
  if(!righe.length) return { score:0, rank:0, conf:0, ko:[], verifica:[] };
  let tot = 0, noto = 0, tutto = 0, veto = false, cap = 100;
  const ko = [], ver = [];
  righe.forEach(x => {
    const w = x.f.w * IMP[x.imp].m;
    const nome = x.imp === 'indispensabile' ? `<b>${x.f.l}</b>` : x.f.l;
    tutto += w;
    if(x.s === null){ ver.push(nome); if(x.imp === 'indispensabile') cap = Math.min(cap, 80); return; }
    noto += w; tot += w * x.s;
    if(x.imp === 'indispensabile' && x.s < .5) veto = true;
    if(x.s < .7) ko.push(nome);
  });
  const conf = tutto ? noto / tutto : 0;
  let score = (veto || !noto) ? 0 : Math.min(cap, Math.round(tot / noto * 100));
  return { score, conf, rank:score * (.75 + .25 * conf), ko, verifica:ver };
}
window.calcolaMatch = match;
window.matchNote = m => {
  let h = '';
  if(m.ko && m.ko.length) h += `<small>manca: ${m.ko.join(', ')}</small>`;
  if(m.verifica && m.verifica.length) h += `<small style="color:var(--warn);">da verificare: ${m.verifica.join(', ')}</small>`;
  return h;
};
window.matchImmobile = im => DB.persone.filter(p => (p.ruoli || []).indexOf('ACQUIRENTE') >= 0)
  .map(p => { const m = match(im,p); m.persona = p; return m; }).filter(m => m.score > 0).sort((a,b) => b.rank - a.rank);
window.matchAcquirente = per => {
  const out = [];
  DB.immobili.forEach(i => {
    const attivo = i.stato === 'NT' || i.stato === 'INK', inCorso = haAppuntamentoInCorso(i.id);
    if(!attivo && !inCorso) return;
    const m = match(i,per);
    if(inCorso){ m.score = Math.max(30, m.score); m.rank = Math.max(30, m.rank); }
    if(m.score > 0){ m.immobile = i; out.push(m); }
  });
  return out.sort((a,b) => b.rank - a.rank);
};

const ST = 'background:var(--bg2);padding:8px 10px;border-radius:8px;';
const opt = (arr,sel,vuoto) => (vuoto !== undefined ? `<option value="">${vuoto}</option>` : '') + arr.map(o => `<option value="${esc(o)}"${o === sel ? ' selected' : ''}>${esc(o)}</option>`).join('');

function impSel(f,r){
  const salvato = LEG[r.requisiti && r.requisiti[f.k]] || (r.requisiti && r.requisiti[f.k]) || '';
  const auto = impEff(f, Object.assign({}, r, { requisiti:{} }));
  let o = `<option value="">Auto · ${IMP[auto].l}</option>`;
  Object.keys(IMP).forEach(k => o += `<option value="${k}"${k === salvato ? ' selected' : ''}>${IMP[k].l}</option>`);
  return `<select class="form-select" id="cx-rq-${f.k}-imp" style="${ST}margin-top:5px;font-size:12.5px;color:var(--tx2);">${o}</select>`;
}
function campo(f,ctx,src){
  const id = `cx-${ctx}-${f.k}`, rq = ctx === 'rq', val = src[rq ? rk(f) : ik(f)];
  let c = '';
  if(rq && f.campoRq) c = f.campoRq(val, src);
  else if(!rq && f.campoIm) c = f.campoIm(val, src);
  else if(f.t === 'multi' || f.t === 'multiNo') c = ms(id, f.opts || [], val);
  else if(f.t === 'sn') c = `<select class="form-select" id="${id}" style="${ST}">${opt(OPT_SN, val === 'Meglio' ? 'Si' : val, rq ? 'Indifferente' : '—')}</select>`;
  else if(f.t === 'ord') c = `<select class="form-select" id="${id}" style="${ST}">${opt(f.opts, val, rq ? 'Indifferente' : '—')}</select>`;
  else if(f.t === 'num' && rq) c = `<div class="box2"><div><input class="form-input" id="${id}-min" inputmode="numeric" placeholder="Min" value="${esc(src[f.rqMin || f.k+'Min'] || '')}" style="${ST}"></div><div><input class="form-input" id="${id}-max" inputmode="numeric" placeholder="Max" value="${esc(src[f.rqMax || f.k+'Max'] || '')}" style="${ST}"></div></div>`;
  else if(f.long) c = `<textarea class="form-textarea" id="${id}" style="${ST}">${esc(val || '')}</textarea>`;
  else c = `<input class="form-input" id="${id}" value="${esc(val || '')}" style="${ST}"${f.t === 'num' ? ' inputmode="numeric"' : ''}>`;
  const imp = (rq && f.t !== 'dato' && f.ui !== 'im' && f.ui !== 'none') ? impSel(f,src) : '';
  return `<div class="cx-campo" data-cx-key="${f.k}" data-cx-ctx="${ctx}"><label class="form-label">${f.l}</label>${c}${imp}</div>`;
}
function sezione(ctx,src){
  let h = '';
  GRUPPI.forEach(g => {
    const code = g[0];
    const l = CAT.filter(f => f.g === code && usa(f,ctx) && f.ui !== 'none');
    if(!l.length) return;
    const rows = [];
    let curPair = null, curRow = [];
    l.forEach(f => {
      if(f.pair){
        if(f.pair === curPair && curRow.length < 2) curRow.push(f);
        else { if(curRow.length) rows.push(curRow); curPair = f.pair; curRow = [f]; }
      } else {
        if(curRow.length){ rows.push(curRow); curRow = []; curPair = null; }
        rows.push([f]);
      }
    });
    if(curRow.length) rows.push(curRow);
    let body = rows.map(row => {
      if(row.length === 1) return campo(row[0], ctx, src);
      return `<div class="cx-row2">${row.map(f => campo(f, ctx, src)).join('')}</div>`;
    }).join('');
    if(ctx==='im' && code==='DI') body += htmlLocaliDossier(src);
    const hideCommercial=ctx==='im' && code==='CM' && !A(src.tipologia).includes('Locale Commerciale');
    h += `<details class="fold" data-cx-group="${code}"${hideCommercial?' hidden':''}><summary>${g[1]}</summary><div>${body}</div></details>`;
  });
  if(ctx === 'rq'){
    const leg = CAT.filter(f => f.ui === 'im' && f.t !== 'dato' && reqVal(f,src) !== null);
    const rg = REGOLE.filter(g => g.on(src));
    if(leg.length || rg.length)
      h += `<details class="fold"><summary>Importanza dei criteri gia compilati</summary><div>${leg.concat(rg).map(f => `<div class="cx-campo"><label class="form-label">${f.l}</label>${impSel(f,src)}</div>`).join('')}</div></details>`;
  }
  return h;
}
function dossierDepRefresh(ctx, src){
  const container=document.getElementById('modal-body');if(!container)return;
  const current={...src};
  if(ctx==='im'){
    const im=DB.immobili.find(x=>x.id===immobileAperto);
    current.villa=Boolean(im&&im.villa);
  }
  CAT.forEach(f=>{
    if(f.ui==='none'||!usa(f,ctx))return;
    const id=`cx-${ctx}-${f.k}`;
    let value;
    if(f.t==='multi'||f.t==='multiNo')value=msVal(id);
    else {const el=document.getElementById(id);if(el)value=el.value;}
    if(value!==undefined) current[ctx==='rq'?rk(f):ik(f)]=value;
  });
  container.querySelectorAll(`[data-cx-ctx="${ctx}"]`).forEach(el=>{
    const f=CAT.find(x=>x.k===el.dataset.cxKey);
    const visible=!f||!f.dep||Boolean(f.dep(current));
    el.classList.toggle('cx-hidden',!visible);
    // Niente tab stop per elementi dipendenti nascosti.
    el.querySelectorAll('input,select,button,textarea').forEach(input=>{
      if(!visible){if(!input.disabled){input.dataset.depDisabled='1';input.disabled=true;}}
      else if(input.dataset.depDisabled){input.disabled=false;delete input.dataset.depDisabled;}
    });
  });
  if(ctx==='im')container.querySelectorAll('[data-cx-group]').forEach(group=>{
    const code=group.dataset.cxGroup;
    if(code==='CM'&&!A(current.tipologia).includes('Locale Commerciale')){group.hidden=true;return;}
    const fields=Array.from(group.querySelectorAll('[data-cx-ctx="im"]'));
    group.hidden=Boolean(fields.length && !fields.some(x=>!x.classList.contains('cx-hidden')));
  });
}
function applicaDep(ctx,src){dossierDepRefresh(ctx,src);}
function bindDepChange(ctx,src){
  const container=document.getElementById('modal-body');
  if(!container||container._depBound)return;
  container._depBound=true;
  container.addEventListener('change',()=>dossierDepRefresh(ctx,src));
  container.addEventListener('input',()=>dossierDepRefresh(ctx,src));
  container.addEventListener('click',()=>{Promise.resolve().then(()=>dossierDepRefresh(ctx,src));});
}
function leggi(ctx){
  const dati = {}, imp = {}, gv = id => { const e = document.getElementById(id); return e ? e.value : undefined; };
  CAT.forEach(f => {
    if(f.ui === 'none') return;
    const id = `cx-${ctx}-${f.k}`;
    if(usa(f,ctx)){
      if(f.t === 'multi' || f.t === 'multiNo') dati[ctx === 'rq' ? rk(f) : ik(f)] = msVal(id);
      else if(f.t === 'num' && ctx === 'rq'){ dati[f.rqMin || f.k+'Min'] = (gv(id+'-min') || '').trim(); dati[f.rqMax || f.k+'Max'] = (gv(id+'-max') || '').trim(); }
      else dati[ctx === 'rq' ? rk(f) : ik(f)] = (gv(id) || '').trim();
    }
    const v = gv(id+'-imp'); if(v !== undefined) imp[f.k] = v;
  });
  REGOLE.forEach(g => { const v = gv(`cx-rq-${g.k}-imp`); if(v !== undefined) imp[g.k] = v; });
  return { dati, imp };
}
const ultimaRiga = () => { const l = document.querySelectorAll('#modal-body .btn-row'); return l[l.length-1]; };

/* Esponi per apriModificaDossier e apriModificaRichiesta */
window.sezioneDossier = sezione;
window.applicaDepDossier = applicaDep;
window.bindDepDossier = bindDepChange;
window.leggiDossier = leggi;

/* Inietta richiesta in apriModificaRichiesta (il dossier ha gia la sua funzione dedicata) */
const _amrOld = window.apriModificaRichiesta;
window.apriModificaRichiesta = function(pid){
  _amrOld(pid);
  const p = trovaPersona(pid), row = ultimaRiga();
  if(p && row){
    row.insertAdjacentHTML('beforebegin', sezione('rq', p.richiesta || {}));
    setTimeout(() => { applicaDep('rq', p.richiesta || {}); bindDepChange('rq', p.richiesta || {}); }, 60);
  }
};
const _srOld = window.salvaRichiesta;
window.salvaRichiesta = function(pid){
  const p = trovaPersona(pid), v = leggi('rq'), vecchio = (p && p.richiesta) || {};
  _srOld(pid);
  if(!p || !p.richiesta) return;
  Object.assign(p.richiesta, v.dati);
  const req = p.richiesta.requisiti = p.richiesta.requisiti || {};
  Object.keys(v.imp).forEach(k => { if(v.imp[k]) req[k] = v.imp[k]; else delete req[k]; });
  const lav = (p.richiesta.luogoLavoro || '').trim();
  if(!lav){ delete p.richiesta.lavoroLat; delete p.richiesta.lavoroLng; }
  else if(vecchio.luogoLavoro === lav && vecchio.lavoroLat){ p.richiesta.lavoroLat = vecchio.lavoroLat; p.richiesta.lavoroLng = vecchio.lavoroLng; }
  else geocodifica(lav).then(res => { if(res){ p.richiesta.lavoroLat = res.lat; p.richiesta.lavoroLng = res.lng; Storage.save(DB); } });
  Storage.save(DB);
};

})();
