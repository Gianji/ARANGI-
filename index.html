.agenda-giorno.oggi .ag-nome { color: var(--acc); }
.agenda-giorno.festivo .ag-nome { color: var(--fest); }
.agenda-giorno .ag-num { font-size: 12px; font-weight: 500; color: var(--tx); width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.agenda-giorno.festivo .ag-num { color: var(--fest); }
.agenda-giorno.oggi .ag-num { background: var(--acc); color: white; font-weight: 700; }
.agenda-giorno .ag-ev-label { font-size: 7px; font-weight: 700; }
.agenda-giorno .ag-ev-ora { font-size: 7px; color: var(--tx3); }
.agenda-giorno .ag-empty { color: var(--tx3); font-size: 9px; flex: 1; display: flex; align-items: center; }
#planning-contenuto { flex: 1 1 0; min-height: 0; overflow-y: auto; cursor: pointer; }
.planning-item { display: flex; gap: 8px; padding: 7px 9px; border: 1px solid var(--bd); border-radius: var(--rs); font-size: 12px; cursor: pointer; align-items: flex-start; border-left: 3px solid var(--blu); margin-bottom: 4px; }
.planning-item .pi-ora { font-size: 10.5px; font-weight: 700; color: var(--tx2); flex-shrink: 0; min-width: 34px; }
.planning-item .pi-testo { flex: 1; min-width: 0; word-break: break-word; line-height: 1.3; }
.planning-item .pi-tipo { font-size: 8px; font-weight: 700; padding: 1px 5px; border-radius: var(--rp); background: var(--blu); color: white; }
.planning-item.attivita { border-left-color: var(--nt); }
.planning-item.attivita .pi-tipo { background: var(--nt); }
.planning-item.libera { border-left-color: var(--acc); }
.planning-item.libera .pi-tipo { background: var(--acc); }
.planning-empty { text-align: center; padding: 14px 8px; color: var(--tx3); font-size: 12.5px; }
.app-item-card { background: var(--card); border-radius: var(--r); padding: 11px 13px; margin-bottom: 6px; border: 1px solid var(--bd); border-left: 3px solid var(--blu); cursor: pointer; }
.app-item-card .app-titolo { font-size: 13px; font-weight: 600; color: var(--tx); margin-bottom: 4px; line-height: 1.3; }
.app-item-card .app-data { font-size: 11.5px; color: var(--tx2); display: flex; align-items: center; gap: 4px; }
.app-item-card .app-data svg { width: 11px; height: 11px; }
.app-item-card .app-esito { font-size: 10.5px; margin-top: 6px; padding: 2px 8px; border-radius: var(--rp); display: inline-flex; align-items: center; gap: 3px; font-weight: 500; }
.app-item-card .app-esito.ok { background: #f0fdf4; color: var(--ok); }
.app-item-card .app-esito.ko { background: #fef2f2; color: var(--vnd); }
.app-item-card .app-esito.neutral { background: var(--bg2); color: var(--tx2); }
.tipo-app-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
.tipo-app-btn { background: var(--card); border: 1px solid var(--bd); border-radius: var(--r); padding: 11px; cursor: pointer; text-align: left; font-family: inherit; border-left: 4px solid var(--tx3); }
.tipo-app-btn .sigla { font-size: 12.5px; font-weight: 700; color: var(--tx); margin-bottom: 2px; display: flex; align-items: center; gap: 5px; }
.tipo-app-btn .sigla svg { width: 14px; height: 14px; }
.tipo-app-btn .desc { font-size: 10px; color: var(--tx3); line-height: 1.35; }
.att-gruppo { background: var(--card); border-radius: var(--r); margin-bottom: 6px; border: 1px solid var(--bd); overflow: hidden; }
.att-gruppo-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; }
.att-icona-ent { flex-shrink: 0; color: var(--blu); display: flex; align-items: center; opacity: 0.7; }
.att-icona-ent svg { width: 17px; height: 17px; }
.att-info { flex: 1; min-width: 0; }
.att-titolo { font-size: 12.5px; font-weight: 600; color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-meta { font-size: 10px; color: var(--tx3); margin-top: 2px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.att-count { background: var(--bg2); color: var(--blu); font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: var(--rp); }
.att-arrow svg { width: 14px; height: 14px; color: var(--tx3); transition: transform 0.2s; }
.att-gruppo.espanso .att-arrow { transform: rotate(90deg); }
.att-gruppo-body { display: none; border-top: 1px solid var(--bd); padding: 2px 0; }
.att-gruppo.espanso .att-gruppo-body { display: block; }
.att-item { display: flex; gap: 9px; padding: 9px 12px; cursor: pointer; align-items: flex-start; }
.att-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.att-dot.fatta { background: var(--ink); }
.att-dot.oggi { background: var(--acc); }
.att-dot.scaduta { background: var(--vnd); }
.att-dot.prossima { background: var(--nt); }
.att-body { flex: 1; min-width: 0; }
.att-data { font-size: 9.5px; font-weight: 700; color: var(--tx3); text-transform: uppercase; margin-bottom: 2px; }
.att-data.oggi { color: var(--acc); }
.att-data.scaduta { color: var(--vnd); }
.att-testo { font-size: 12.5px; color: var(--tx); line-height: 1.35; word-break: break-word; }
.match-line { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--bd); cursor: pointer; gap: 8px; }
.match-line .ml-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.match-line .ml-score.high { color: var(--ok); font-weight: 700; }
.match-line .ml-score.mid { color: var(--warn); font-weight: 700; }
.match-line .ml-score.low { color: var(--tx3); font-weight: 700; }
.checklist-compact { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 12.5px; cursor: pointer; gap: 8px; }
.checklist-compact .cl-left { display: flex; align-items: center; gap: 7px; color: var(--tx2); }
.checklist-compact .cl-left svg { width: 14px; height: 14px; }
.checklist-compact .cl-pct { font-weight: 700; font-size: 14px; }
.checklist-compact .cl-pct.ok { color: var(--ok); }
.checklist-compact .cl-pct.mid { color: var(--warn); }
.checklist-compact .cl-pct.low { color: var(--vnd); }
.checklist-full .cl-item { display: flex; align-items: center; gap: 7px; padding: 4px 0; font-size: 12.5px; }
.checklist-full .cl-item svg { width: 12px; height: 12px; }
.checklist-full .cl-item.ok { color: var(--ink); }
.checklist-full .cl-item.missing { color: var(--tx3); }
.doc-summary-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 12.5px; cursor: pointer; gap: 8px; }
.doc-summary-row .ds-left { display: flex; align-items: center; gap: 7px; color: var(--tx2); }
.doc-summary-row .ds-left svg { width: 14px; height: 14px; }
.doc-summary-row .ds-right.ok { color: var(--ok); font-weight: 700; }
.doc-summary-row .ds-right.warn { color: var(--warn); font-weight: 700; }
#view-agenda.active, #view-planning.active { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
#agenda-page-content, #planning-page-content { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.ag-view { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.ag-header { display: flex; align-items: center; gap: 6px; padding: 4px 12px; flex-shrink: 0; }
.ag-header .ag-nav-group { display: flex; align-items: center; flex: 1; justify-content: center; }
.ag-header .ag-nav-btn, .ag-header .ag-back-btn { background: transparent; border: none; width: 38px; height: 38px; border-radius: 50%; color: var(--blu); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.ag-header .ag-nav-btn svg { width: 20px; height: 20px; }
.ag-header .ag-back-btn svg { width: 18px; height: 18px; }
.ag-header .ag-month-lbl { font-size: 20px; font-weight: 800; color: var(--acc); padding: 0 10px; min-width: 80px; text-align: center; }
.ag-header .ag-spacer { width: 38px; }
.ag-weekstrip { display: flex; padding: 2px 8px 6px; flex-shrink: 0; margin: 0 6px; }
.ag-ws-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 3px 2px; cursor: pointer; border-radius: 10px; }
.ag-ws-name { font-size: 10px; font-weight: 700; color: var(--tx3); }
.ag-ws-num { font-size: 16px; font-weight: 500; color: var(--tx); width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.ag-ws-day.today .ag-ws-num { background: var(--acc); color: #fff; font-weight: 700; }
.ag-ws-day.today .ag-ws-name { color: var(--acc); }
.ag-ws-day.sel .ag-ws-num { background: var(--blu); color: #fff; font-weight: 700; }
.ag-ws-day.sel .ag-ws-name { color: var(--blu); }
.ag-ws-day.festivo .ag-ws-name { color: var(--fest); }
.ag-ws-day.festivo .ag-ws-num { color: var(--fest); }
.ag-ws-day.festivo.today .ag-ws-num, .ag-ws-day.festivo.sel .ag-ws-num { color: #fff; }
.ag-sep { height: 1px; background: var(--bd2); margin: 0 14px; flex-shrink: 0; }
.ag-content { flex: 1 1 0; min-height: 0; overflow-y: auto; position: relative; padding-bottom: 80px; }
.ag-bottombar { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 18px); z-index: 45; pointer-events: none; display: flex; justify-content: flex-start; padding-left: 18px; }
.ag-pill { pointer-events: auto; padding: 10px 20px; border-radius: 999px; background: var(--card); border: 1px solid var(--bd2); font-family: inherit; font-size: 13.5px; font-weight: 700; color: var(--blu); cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
.ag-mm-month { margin-bottom: 22px; }
.ag-mm-name { font-size: 20px; font-weight: 800; color: var(--blu); padding: 8px 8px 6px; }
.ag-mm-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 10px; font-weight: 700; color: var(--tx3); text-align: center; padding: 2px 0 5px; border-bottom: 1px solid var(--bd); }
.ag-mm-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.ag-mm-cell { height: 70px; padding: 3px 2px; border-bottom: 1px solid var(--bd); display: flex; flex-direction: column; gap: 2px; cursor: pointer; overflow: hidden; }
.ag-mm-num { font-size: 12.5px; font-weight: 500; color: var(--tx); width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; }
.ag-mm-cell.today .ag-mm-num { background: var(--acc); color: #fff; font-weight: 700; }
.ag-mm-cell.selected .ag-mm-num { box-shadow: 0 0 0 2px var(--blu); }
.ag-mm-cell.festivo .ag-mm-num { color: var(--fest); }
.ag-mm-cell.festivo.today .ag-mm-num { color: #fff; }
.ag-mm-events { display: flex; flex-direction: column; gap: 2px; overflow: hidden; max-height: 40px; }
.ag-mm-ev { display: flex; gap: 3px; padding: 1px 3px; border-radius: 3px; overflow: hidden; }
.ag-mm-ev-title { font-size: 8.5px; font-weight: 600; color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-year-month { margin-bottom: 18px; }
.ag-year-name { font-size: 15px; font-weight: 800; color: var(--blu); margin-bottom: 4px; padding-left: 4px; }
.ag-year-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.ag-year-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; border-radius: 50%; }
.ag-year-cell.other { opacity: 0.22; }
.ag-year-cell.today .ag-year-num { background: var(--acc); color: #fff; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.ag-year-cell.selected .ag-year-num { box-shadow: 0 0 0 2px var(--blu); }
.ag-year-cell.festivo .ag-year-num { color: var(--fest); }
.ag-year-cell.festivo.today .ag-year-num { color: #fff; }
.ag-year-dot { width: 4px; height: 4px; border-radius: 50%; }
.ag-timeline { display: flex; position: relative; padding-bottom: 30px; background-image: repeating-linear-gradient(to bottom, var(--bd2) 0px, var(--bd2) 1px, transparent 1px, transparent var(--ora-h)); background-repeat: repeat-y; background-size: 100% var(--ora-h); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
.ag-days.touching-longpress { touch-action: none; }
.ag-hours-col { width: 48px; flex-shrink: 0; background: var(--bg); z-index: 2; }
.ag-hour-label { height: var(--ora-h); display: flex; align-items: flex-start; justify-content: flex-end; padding: 3px 8px 0 0; font-size: 10px; font-weight: 500; color: var(--tx3); background: var(--bg); }
.ag-days { flex: 1; display: flex; position: relative; z-index: 1; }
.ag-day-col { flex: 1; position: relative; min-width: 0; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.ag-hour-line { height: var(--ora-h); }
.ag-event { position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 3px 5px; overflow: hidden; cursor: pointer; z-index: 3; background: var(--card); border: 1px solid var(--bd); border-left: 3px solid var(--blu); }
.ag-event-title { font-size: 9.5px; font-weight: 700; color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-event-time { font-size: 8.5px; color: var(--tx2); }
.ag-now-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--acc); z-index: 6; }
.ag-now-dot { position: absolute; left: 44px; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 2px var(--bg); }
.ag-longpress-preview { position: fixed; z-index: 8500; background: rgba(217,96,26,0.95); color: white; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; pointer-events: none; box-shadow: 0 4px 16px rgba(217,96,26,0.35); transform: translate(-50%, -130%); white-space: nowrap; }
.ag-lp-slot { position: absolute; left: 2px; right: 2px; background: rgba(217,96,26,0.18); border-left: 3px solid var(--acc); border-radius: 6px; z-index: 5; pointer-events: none; }
input.form-input, textarea.form-textarea, select.form-select { font-size: 16px; }

/* === Dropdown / Multi-select === */
.filter-dropdown-overlay { position: fixed; inset: 0; background: rgba(20,20,30,0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 9001; display: none; align-items: center; justify-content: center; padding: 20px; }
.filter-dropdown-overlay.open { display: flex; }
.filter-dropdown { background: var(--card); border-radius: 14px; padding: 8px; max-width: 360px; width: 100%; max-height: 78dvh; overflow-y: auto; box-shadow: 0 16px 48px rgba(0,0,0,0.18); }
.filter-dropdown h3 { font-size: 11px; font-weight: 700; color: var(--tx3); text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 12px 6px; }
.filter-dropdown .opt { padding: 12px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; touch-action: manipulation; }
.filter-dropdown .opt.selected { background: var(--blu-soft); color: var(--blu); font-weight: 600; }
.filter-dropdown .opt:active { background: var(--bg2); }
.ms-btn { width: 100%; background: var(--bg2); border: none; padding: 11px 12px; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 500; color: var(--tx); text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; min-height: 42px; }
.ms-btn svg { color: var(--tx3); flex-shrink: 0; }
.ms-btn > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-btn > span.ph { color: var(--tx3); font-weight: 400; }
.ms-opt { padding: 12px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; touch-action: manipulation; }
.ms-opt.on { background: var(--blu-soft); color: var(--blu); font-weight: 600; }
.ms-opt:active { background: var(--bg2); }
.ms-opt svg { color: var(--blu); }
.mq-row { display: flex; gap: 8px; }
.mq-row > div { flex: 1; min-width: 0; }
.mq-row input { width: 100%; background: var(--bg2); padding: 11px 12px; border: none; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 500; color: var(--tx); outline: none; }

@media (min-width: 768px) {
  body { background: #ececec; }
  .app { max-width: var(--maxw); margin: 0 auto; background: var(--bg); border-left: 1px solid var(--bd); border-right: 1px solid var(--bd); }
  .tabbar { max-width: var(--maxw); left: 50%; transform: translateX(-50%); }
  .fab { right: calc(50% - (var(--maxw)/2) + 18px); }
  .fab-menu { right: calc(50% - (var(--maxw)/2) + 18px); }
  .modal-overlay { align-items: center; padding: 20px; }
  .modal-sheet { border-radius: 16px; max-height: 88dvh; }
  input.form-input, textarea.form-textarea, select.form-select { font-size: 14px; }
}
:root[data-theme="dark"] {
  --blu: #8ab0d4; --blu-soft: #1a2533;
  --acc: #ec6f2a; --acc-soft: #2a1a10;
  --bg: #0f0f11; --bg2: #1a1a1d; --card: #17171a;
  --tx: #e8e8ea; --tx2: #9a9aa0; --tx3: #6a6a72;
  --bd: #232327; --bd2: #2e2e33;
  --fest: #f87171; --coll: #a78bfa;
}
:root[data-theme="dark"] .tabbar { background: rgba(15,15,17,0.9); }
:root[data-theme="dark"] .modal-sheet { background: var(--bg); }
:root[data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.88) contrast(0.92) saturate(0.7); }
</style>

<body>

<div class="app">
  <header class="app-header">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
      <h1><span>ARAN</span>JO</h1>
      <div id="header-prossimo-app" onclick="apriProssimoAppuntamento()">
        <div class="lbl">Prossimo</div>
        <div id="header-prossimo-app-txt"></div>
      </div>
    </div>
  </header>

  <main class="app-content" id="app-content">
    <section id="view-immobili" class="view active">
      <div class="search-sticky"><input type="search" class="search-bar" id="search-immobili" placeholder="Cerca..."></div>
      <div class="chips" id="chips-immobili">
        <button class="chip active" data-filtro="tutti">Tutti</button>
        <button class="chip" data-filtro="IMM">IMM</button>
        <button class="chip" data-filtro="PA">PA</button>
        <button class="chip" data-filtro="NT">NT</button>
        <button class="chip" data-filtro="INK">INK</button>
        <button class="chip" data-filtro="VND">VND</button>
        <button class="chip" data-filtro="GEST" id="chip-gest"></button>
        <button class="chip" data-filtro="COND" id="chip-cond"></button>
        <button class="chip" data-filtro="ZONE" id="chip-zone"></button>
      </div>
      <div id="filtro-attivo"></div>
      <div id="lista-immobili"></div>
    </section>

    <section id="view-persone" class="view">
      <div class="chips" id="persone-tabs" style="padding-bottom:8px;">
        <button class="chip acc active" data-ptab="acquirente" id="chip-ptab-acq"></button>
        <button class="chip acc" data-ptab="prop" id="chip-ptab-prop"></button>
        <button class="chip acc" data-ptab="locatore" id="chip-ptab-loc"></button>
        <button class="chip acc" data-ptab="conduttore" id="chip-ptab-cond"></button>
        <button class="chip acc" data-ptab="professionista" id="chip-ptab-prof"></button>
      </div>
      <div class="search-sticky"><input type="search" class="search-bar" id="search-persone" placeholder="Cerca..."></div>
      <div id="filtro-persone-attivo" style="margin-bottom:6px;"></div>
      <div id="lista-persone"></div>
    </section>

    <section id="view-attivita" class="view">
      <div class="att-col">
        <div class="att-subtabs" id="att-subtabs">
          <div class="att-subtab scadute" data-att="scadute" onclick="setAttTab('scadute')"><div class="num" id="att-num-scadute">0</div><div class="lbl">Scadute</div></div>
          <div class="att-subtab oggi active" data-att="oggi" onclick="setAttTab('oggi')"><div class="num" id="att-num-oggi">0</div><div class="lbl">Oggi</div></div>
          <div class="att-subtab prossime" data-att="prossime" onclick="setAttTab('prossime')"><div class="num" id="att-num-prossime">0</div><div class="lbl">Prossime</div></div>
        </div>
        <div id="lista-attivita" class="att-scroll"></div>
      </div>
      <div class="att-col">
        <div class="agenda-sett">
          <h3 onclick="apriAgendaPage()"><span style="cursor:pointer;">Agenda ›</span>
            <div class="nav-sett" onclick="event.stopPropagation()">
              <button onclick="cambiaSettimana(-1)">‹</button>
              <button onclick="cambiaSettimana(0)">•</button>
              <button onclick="cambiaSettimana(1)">›</button>
            </div>
          </h3>
          <div class="agenda-grid" id="agenda-grid"></div>
        </div>
      </div>
      <div class="att-col">
        <div class="planning-sett">
          <h3 onclick="apriPlanningPage()"><span id="planning-titolo">Oggi</span>

/* ============ FESTIVI ============ */
function pasqua(anno) {
  var a = anno % 19, b = Math.floor(anno / 100), c = anno % 100;
  var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  var h = (19*a + b - d - g + 15) % 30;
  var i = Math.floor(c / 4), k = c % 4;
  var l = (32 + 2*e + 2*i - h - k) % 7;
  var m = Math.floor((a + 11*h + 22*l) / 451);
  var mese = Math.floor((h + l - 7*m + 114) / 31);
  var giorno = ((h + l - 7*m + 114) % 31) + 1;
  return new Date(anno, mese - 1, giorno);
}
var _festCache = {};
function festiviAnno(anno) {
  if (_festCache[anno]) return _festCache[anno];
  var p = pasqua(anno);
  var pl = new Date(p); pl.setDate(pl.getDate() + 1);
  var f = {};
  f[anno + '-01-01'] = 'Capodanno';
  f[anno + '-01-06'] = 'Epifania';
  f[ymd(p)] = 'Pasqua';
  f[ymd(pl)] = 'Lunedì dell\'Angelo';
  f[anno + '-04-25'] = 'Liberazione';
  f[anno + '-05-01'] = 'Festa del Lavoro';
  f[anno + '-06-02'] = 'Festa della Repubblica';
  f[anno + '-08-15'] = 'Ferragosto';
  f[anno + '-11-01'] = 'Ognissanti';
  f[anno + '-12-08'] = 'Immacolata';
  f[anno + '-12-25'] = 'Natale';
  f[anno + '-12-26'] = 'Santo Stefano';
  _festCache[anno] = f;
  return f;
}
function isFestivo(y) {
  var anno = parseInt(y.split('-')[0], 10);
  if (isNaN(anno)) return null;
  return festiviAnno(anno)[y] || null;
}

/* ============ STORAGE ============ */
var Storage2 = {
  db: null,
  open: function() {
    var self = this;
    if (this.db) return Promise.resolve(this.db);
    return new Promise(function(res, rej) {
      var req = indexedDB.open('aranjo_db', 1);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'k' });
        if (!db.objectStoreNames.contains('foto')) db.createObjectStore('foto', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('documenti')) db.createObjectStore('documenti', { keyPath: 'id' });
      };
      req.onsuccess = function() { self.db = req.result; res(self.db); };
      req.onerror = function() { rej(req.error); };
    });
  },
  get: function(k) { return this.open().then(function(db) { return new Promise(function(res, rej) { var r = db.transaction('kv','readonly').objectStore('kv').get(k); r.onsuccess = function() { res(r.result ? r.result.v : null); }; r.onerror = function() { rej(r.error); }; }); }); },
  set: function(k, v) { return this.open().then(function(db) { return new Promise(function(res, rej) { var tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put({ k: k, v: v, updatedAt: Date.now() }); tx.oncomplete = function() { res(); }; tx.onerror = function() { rej(tx.error); }; }); }); },
  persist: function() { try { if (!navigator.storage || !navigator.storage.persist) return Promise.resolve(false); return navigator.storage.persisted().then(function(a) { if (a) return true; return navigator.storage.persist(); }); } catch(e) { return Promise.resolve(false); } }
};

var Storage = {
  default: function() { return { versione: DB_VERSION, nextSeq: 1, cittaPrincipale: CITTA_DEFAULT, immobili: [], persone: [], attivita: [], appuntamenti: [], pianificazioni: [], condomini: {}, coordinateCondomini: {}, chiamate: [], magazzino: [], rapportini: [] }; },
  migra: function(p) {
    var def = this.default();
    var db = {
      versione: DB_VERSION, nextSeq: p.nextSeq || 1, cittaPrincipale: p.cittaPrincipale || def.cittaPrincipale,
      immobili: Array.isArray(p.immobili) ? p.immobili : [],
      persone: Array.isArray(p.persone) ? p.persone : [],
      attivita: Array.isArray(p.attivita) ? p.attivita : [],

      pianificazioni: Array.isArray(p.pianificazioni) ? p.pianificazioni : [],
      condomini: p.condomini || {}, coordinateCondomini: p.coordinateCondomini || {},
      chiamate: Array.isArray(p.chiamate) ? p.chiamate : [],
      magazzino: Array.isArray(p.magazzino) ? p.magazzino : [],
      rapportini: Array.isArray(p.rapportini) ? p.rapportini : []
    };
    for (var k in db.condomini) {
      if (!Array.isArray(db.condomini[k].foto)) db.condomini[k].foto = [];
      if (!Array.isArray(db.condomini[k].zone)) db.condomini[k].zone = [];
    }
    var ARRAY_FIELDS_RICHIESTA = ['tipologia','piano','zona','classeEnergetica','caratteristiche','scopo','statoConservativo','mq','locali','bagni','pianoTipo','riscaldamentoTipo','infissi','vista','zonaCaratt','cucina'];
    db.persone.forEach(function(per) {
      if (per.richiesta) {
        var r = per.richiesta;
        ARRAY_FIELDS_RICHIESTA.forEach(function(k) {
          if (r[k] && !Array.isArray(r[k])) r[k] = [r[k]];
          if (!r[k]) r[k] = [];
        });
        if (r.statoImmobile && !r.statoConservativo) r.statoConservativo = r.statoImmobile;
        delete r.statoImmobile;
        if (!r.requisiti) r.requisiti = {};
        if (typeof r.mqMin === 'undefined') r.mqMin = '';
        if (typeof r.mqMax === 'undefined') r.mqMax = '';
      }
    });
    var ARRAY_FIELDS_IMM = ['tipologia','piano','classeEnergetica','caratteristiche','riscaldamentoTipo','infissi','vista','zonaCaratt','cucina'];
    db.immobili.forEach(function(im) {
      if (im.dettagli) {
        var d = im.dettagli;
        ARRAY_FIELDS_IMM.forEach(function(k) {
          if (d[k] && !Array.isArray(d[k])) d[k] = [d[k]];
          if (!d[k]) d[k] = [];
        });
        if (d.camere && !d.locali) d.locali = d.camere;
        if (typeof d.mqCalpestabili === 'undefined') d.mqCalpestabili = d.mq || d.mqMin || '';
        if (typeof d.mqCommerciali === 'undefined') d.mqCommerciali = d.mq || d.mqMax || d.mqMin || '';
      }
      if (!im.zone) im.zone = [];
      if (!Array.isArray(im.proprietari)) im.proprietari = [];
      im.proprietari.forEach(function(pr) { if (!pr.tipo) pr.tipo = 'Proprietà'; });
      if (!im.gestitoDa) im.gestitoDa = 'me';
      if (typeof im.collegaNome === 'undefined') im.collegaNome = '';
    });
    return db;
  },
  save: function(d) { Storage2.set('db_v4', d).catch(function(e) { console.error(e); }); return true; },
  loadAsync: function() {
    var self = this;
    return Storage2.get('db_v4').then(function(d) {
      if (!d) {
        var raw = null;
        try { raw = localStorage.getItem(DB_KEY); } catch(e) {}
        if (raw) { try { d = JSON.parse(raw); return Storage2.set('db_v4', d).then(function() { return self.migra(d); }); } catch(e) {} }
      }
      return d ? self.migra(d) : self.default();
    });
  }
};

var photoCache = {};
function getPhotoURL(id) { if (photoCache[id]) return Promise.resolve(photoCache[id]); return PhotoDB.get(id).then(function(r) { if (!r || !r.blob) return null; var u = URL.createObjectURL(r.blob); photoCache[id] = u; return u; }).catch(function() { return null; }); }
function processImg(f) {
  return new Promise(function(res, rej) {
    var rd = new FileReader();
    rd.onload = function(e) {
      var im = new Image();
      im.onload = function() {
        var MAX = 2000, w = im.naturalWidth, h = im.naturalHeight;
        if (w > MAX || h > MAX) { if (w >= h) { h = Math.round(h * MAX / w); w = MAX; } else { w = Math.round(w * MAX / h); h = MAX; } }
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(im, 0, 0, w, h);
        c.toBlob(function(b) { if (b) res(b); else rej(new Error('Errore')); }, 'image/jpeg', 0.85);
      };
      im.onerror = function() { rej(new Error('Immagine non valida')); };
      im.src = e.target.result;
    };
    rd.onerror = function() { rej(new Error('Errore')); };
    rd.readAsDataURL(f);
  });
}
function apriPickerFoto(t, id, cam) {
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  if (cam) inp.capture = 'environment'; else inp.multiple = true;
  inp.style.display = 'none'; document.body.appendChild(inp);
  inp.addEventListener('change', function(e) {
    var fs = Array.from(e.target.files || []);
    try { document.body.removeChild(inp); } catch(_) {}
    if (!fs.length) return;
    var target = null;
    if (t === 'immobile') target = DB.immobili.find(function(x){return x.id===id;});
    else if (t === 'condominio') { if (!DB.condomini) DB.condomini = {}; if (!DB.condomini[id]) DB.condomini[id] = { zone: [], foto: [] }; if (!Array.isArray(DB.condomini[id].foto)) DB.condomini[id].foto = []; target = DB.condomini[id]; }
    if (!target) return;
    if (!Array.isArray(target.foto)) target.foto = [];
    var p = Promise.resolve();
    fs.forEach(function(f) {
      p = p.then(function() {
        return processImg(f).then(function(b) {
          var pid = 'ph_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
          return PhotoDB.save(pid, b, { nome: f.name || '', mime: 'image/jpeg', size: b.size }).then(function() { target.foto.push(pid); });
        });
      });
    });
    p.then(function() { Storage.save(DB); if (t === 'immobile') apriScheda(id); else apriModificaCondominio(id); });
  });
  inp.click();
}
function caricaFoto(container, ids) {
  var c = document.getElementById(container); if (!c) return;
  if (!ids || !ids.length) { c.innerHTML = '<p style="font-size:12px;color:var(--tx3);padding:4px 0;margin:0;">—</p>'; return; }
  var html = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px;">';
  ids.forEach(function(pid) { html += '<div data-pid="' + pid + '" onclick="apriFotoViewer(\'' + pid + '\')" style="aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bg2);cursor:pointer;"></div>'; });
  html += '</div>'; c.innerHTML = html;
  ids.forEach(function(pid) {
    getPhotoURL(pid).then(function(u) { if (!u) return; var el = c.querySelector('[data-pid="' + pid + '"]'); if (el) el.innerHTML = '<img src="' + u + '" style="width:100%;height:100%;object-fit:cover;display:block;">'; });
  });
}
function apriFotoViewer(pid) { getPhotoURL(pid).then(function(u) { if (!u) return; apriModal('', '<div style="text-align:center;background:#000;border-radius:8px;overflow:hidden;margin-bottom:10px;"><img src="' + u + '" style="max-width:100%;max-height:65vh;display:block;margin:0 auto;object-fit:contain;"></div>'); }); }

window._modalStack = 0;
window._aranjoCloseFromUI = false;

function apriModal(titolo, html) {
  document.getElementById('modal-title').innerHTML = titolo;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-body').scrollTop = 0;
  document.getElementById('modal').classList.add('open');
  try {
    if (!history.state || !history.state._modal) {
      history.pushState({ _modal: true }, '');
      window._modalStack++;
    }
  } catch(e) {}
}
function chiudiModal(fromBack) {
  var wasOpen = document.getElementById('modal').classList.contains('open');
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modal-body').innerHTML = '';
  if (wasOpen && !fromBack && window._modalStack > 0) {
    window._modalStack--;
    window._aranjoCloseFromUI = true;
    try { history.back(); } catch(e) {}
  }
}

/* === DELEGAZIONE GLOBALE === */
(function attachDDDelegate() {
  function bind() {
    var dd = document.getElementById('filter-dd');
    if (!dd || dd._delegated) return;
    dd._delegated = true;
    dd.addEventListener('click', function(e) {
      var opt = e.target.closest('.opt');
      if (opt && opt.dataset.value !== undefined) {
        e.stopPropagation();
        var v = opt.dataset.value;
        var cb = window._filterDDBack;
        chiudiFilterDD();
        if (cb) { try { cb(v === '' ? null : v); } catch(err) { console.error(err); } }
        return;
      }
      var msOpt = e.target.closest('.ms-opt');
      if (msOpt) {
        e.stopPropagation();
        var mid = msOpt.dataset.mid;
        var mval = msOpt.dataset.mval;
        var s = window._msSel[mid];
        if (!s) return;
        var ii = s.val.indexOf(mval);
        if (ii >= 0) s.val.splice(ii, 1); else s.val.push(mval);
        var isOn = s.val.indexOf(mval) >= 0;
        msOpt.classList.toggle('on', isOn);
        var svg = msOpt.querySelector('svg');
        if (isOn && !svg) msOpt.insertAdjacentHTML('beforeend', ico('check', 12));
        else if (!isOn && svg && svg.parentNode) svg.parentNode.removeChild(svg);
        return;
      }
      var rs = e.target.closest('.ms-reset-btn');
      if (rs) {
        e.stopPropagation();
        var rid = rs.dataset.mid;
        if (window._msSel[rid]) { window._msSel[rid].val = []; apriMs(rid); }
        return;
      }
      var ok = e.target.closest('.ms-ok-btn');
      if (ok) {
        e.stopPropagation();
        chiudiMs(ok.dataset.mid);
        return;
      }
    }, false);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
})();

}

  if (!_npR.length) { alert('Seleziona almeno un ruolo'); return; }
  var tel = g('np-telefono').trim();
  var em = g('np-email').trim();
  var dup = DB.persone.find(function(p) { return (tel && p.telefono === tel) || (em && (p.email||'').toLowerCase() === em.toLowerCase()); });
  if (dup) { if (!confirm('Già presente: ' + nomeCompleto(dup) + '\nOK = unisci ruoli')) return; _npR.forEach(function(r){ if ((dup.ruoli||[]).indexOf(r) < 0) dup.ruoli.push(r); }); Storage.save(DB); chiudiModal(); renderPersone(); setTimeout(function(){apriSchedaPersona(dup.id);},100); return; }
  var ad = new Date().toISOString();
  var p = { id: uid(), nome: nom, cognome: cog, ruoli: _npR.slice(), telefono: tel, email: em, attivita: [], foto: [], createdAt: ad, updatedAt: ad };
  if (_npR.indexOf('PROFESSIONISTA') >= 0) p.tipoProf = g('np-tipoProf') || 'altro';
  if (_npR.indexOf('ACQUIRENTE') >= 0) { p.statoRR = g('np-statoRR') || 'attiva'; p.richiesta = richiestaVuota(); }
  DB.persone.push(p);
  Storage.save(DB); chiudiModal();
  if (_npR.indexOf('ACQUIRENTE') >= 0) pTab = 'acquirente';
  else if (_npR.indexOf('PROFESSIONISTA') >= 0) pTab = 'professionista';
  else if (_npR.indexOf('LOCATORE') >= 0) pTab = 'locatore';
  else if (_npR.indexOf('CONDUTTORE') >= 0) pTab = 'conduttore';
  else pTab = 'prop';
  document.querySelectorAll('#persone-tabs .chip').forEach(function(c) { c.classList.toggle('active', c.dataset.ptab === pTab); });
  renderPersone();
  setTimeout(function(){ apriSchedaPersona(p.id); }, 120);
}

/* ============ SCHEDA PERSONA ============ */
function apriSchedaPersona(id) {
  var p = trovaPersona(id); if (!p) return;
  personaAperta = id;
  var tel = p.telefono || p.telefono2;
  var h = '<div class="scheda-top">';
  h += '<div class="top-badges">';
  (p.ruoli||[]).forEach(function(r) { h += '<span class="badge badge-' + (r === 'PROP' ? 'PROP' : r) + '">' + (RUOLI_LABEL[r]||r).toUpperCase() + '</span>'; });
  h += '</div>';
  h += '<div class="top-title">' + esc(nomeCogn(p).toUpperCase() || 'Persona') + '</div>';
  if (tel) h += '<div class="top-sub">' + ico('telefono',12) + ' ' + esc(tel) + '</div>';
  var immP = DB.immobili.filter(function(i){ return (i.proprietari||[]).some(function(pr){ return pr.personaId === p.id; }); });
  if (immP.length) h += '<div class="top-sub">' + ico('casa',12) + ' ' + immP.length + ' immobili</div>';
  h += '<div class="top-actions">';
  if (tel) { h += '<button class="btn btn-secondary btn-icon" onclick="chiama(\'' + esc(tel) + '\')">' + ico('telefono',15) + '</button><button class="btn btn-secondary btn-icon" onclick="wa(\'' + esc(tel) + '\')">' + ico('whatsapp',15) + '</button>'; }
  if (p.email) h += '<button class="btn btn-secondary btn-icon" onclick="scriviEmail(\'' + esc(p.email) + '\')">' + ico('email',15) + '</button>';
  h += '<button class="btn btn-secondary btn-icon" onclick="apriModificaPersona()">' + ico('modifica',15) + '</button>';
  h += '<button class="btn btn-secondary btn-icon" onclick="cambiaRuoliPersona()">' + ico('aggiorna',15) + '</button>';
  h += '</div></div>';

  h += renderBoxAttivita(p);

  if ((p.ruoli||[]).indexOf('ACQUIRENTE') >= 0) {
    var rq = p.richiesta || richiestaVuota();
    var rows = [];
    if ((rq.scopo||[]).length) rows.push(['Scopo', rq.scopo.join(', ')]);
    if (rq.budget) rows.push(['Budget', rq.budget + ' €']);
    if ((rq.tipologia||[]).length) rows.push(['Tipologie', rq.tipologia.join(', ')]);
    if ((rq.zona||[]).length) rows.push(['Zone', rq.zona.join(', ')]);
    if (rq.mqMin || rq.mqMax) rows.push(['Mq commerciali', (rq.mqMin || '?') + ' – ' + (rq.mqMax || '?')]);
    if ((rq.locali||[]).length) rows.push(['Locali', rq.locali.join(', ')]);
    if (rq.mutuo) rows.push(['Mutuo', rq.mutuo]);
    if (rq.cnCv) rows.push(['CN/CV', rq.cnCv]);
    var body = rows.length ? rows.map(function(x){ return '<div class="info-row"><span class="label">' + x[0] + '</span><span class="value">' + esc(x[1]) + '</span></div>'; }).join('') : '<div style="font-size:12.5px;color:var(--tx3);padding:4px 0;">Da compilare</div>';
    h += collapsible('p_req', ico('target',13) + ' Richiesta', body + '<button class="btn btn-primary" style="margin-top:8px;" onclick="apriModificaRichiesta(\'' + p.id + '\')">' + ico('modifica',14) + ' Modifica</button>', rows.length ? rows.length + ' criteri' : null);

    try {
      var mm = matchAcquirente(p).filter(function(m){ return m.score >= 30; });
      if (mm.length) {
        var mb = '';
        mm.slice(0, 10).forEach(function(m) {
          var cls = m.score >= 70 ? 'high' : m.score >= 40 ? 'mid' : 'low';
          mb += '<div class="match-line" onclick="chiudiModal();setTimeout(function(){apriScheda(\'' + m.immobile.id + '\')},100)"><div class="ml-name">' + esc(m.immobile.indirizzo || titoloImmobile(m.immobile)) + '</div><div class="ml-score ' + cls + '">' + m.score + '%</div></div>';
        });
        h += collapsible('p_match', ico('casa',13) + ' Compatibili', mb, mm.length);
      }
    } catch(e) { console.error(e); }
  }

  var bodyI = '';
  if (immP.length) {
    immP.forEach(function(im) {
      var pr = (im.proprietari||[]).find(function(x){return x.personaId===p.id;});
      var q = pr && pr.quota ? ' · ' + pr.quota + '%' : '';
      var tp = pr && pr.tipo && pr.tipo !== 'Proprietà' ? ' · ' + pr.tipo : '';
      bodyI += '<div class="immobile-line" style="margin-bottom:5px;" onclick="chiudiModal();setTimeout(function(){apriScheda(\'' + im.id + '\')},100)"><span class="txt">' + ico('casa',12) + ' ' + esc(im.indirizzo||'') + esc(q + tp) + '</span><span class="badge badge-' + im.stato + '">' + im.stato + '</span></div>';
    });
  } else bodyI = '<div style="font-size:12.5px;color:var(--tx3);padding:4px 0;">Nessuno collegato</div>';
  bodyI += '<button class="btn btn-primary" style="margin-top:8px;" onclick="apriLinkImmobili(\'' + p.id + '\')">' + ico('piu',14) + ' Aggiungi immobile</button>';
  h += collapsible('p_imm', ico('casa',13) + ' Immobili', bodyI, immP.length || null);

  if (p.cf || p.note || p.email || p.telefono2) {
    var bodyD = '';
    if (p.cf) bodyD += '<div class="info-row"><span class="label">CF</span><span class="value">' + esc(p.cf) + '</span></div>';
    if (p.telefono2) bodyD += '<div class="info-row"><span class="label">Tel 2</span><span class="value">' + esc(p.telefono2) + '</span></div>';
    if (p.email) bodyD += '<div class="info-row"><span class="label">Email</span><span class="value">' + esc(p.email) + '</span></div>';
    if (p.note) bodyD += '<div class="info-row"><span class="label">Note</span><span class="value">' + esc(p.note) + '</span></div>';
    h += collapsible('p_dati', ico('utente',13) + ' Dati', bodyD);
  }

  h += '<button class="btn btn-danger" style="margin-top:6px;" onclick="eliminaPersona()">' + ico('cestino',15) + ' Elimina</button>';
  apriModal(nomeCogn(p).toUpperCase() || 'Persona', h);
}

function renderBoxAttivita(ent, isImmobile) {
  var att = (ent.attivita || []).slice();
  var oggi = new Date(); oggi.setHours(0,0,0,0);
  var daf = att.filter(function(a){ return a.tipo==='da_fare' && !a.completata; }).sort(cmpAtt);
  var fatte = att.filter(function(a){ return a.tipo==='fatta' || a.completata; }).sort(cmpAttDesc);
  var h = '<div class="att-box"><h2>' + ico('clipboard',12) + ' Attività</h2>';
  if (!daf.length && !fatte.length) h += '<div style="font-size:12.5px;color:var(--tx3);">Nessuna</div>';
  else {
    daf.forEach(function(a) {
      var sc = new Date(a.dataPrevista) < oggi;
      h += '<div class="att-line" onclick="' + (isImmobile ? 'apriAzioniAttivita(\'' + a.id + '\')' : 'apriAzioniAttivitaPersona(\'' + a.id + '\')') + '"><div class="al-lbl" style="color:' + (sc ? 'var(--vnd)' : 'var(--acc)') + ';">' + (sc ? 'SCADUTA' : 'DA FARE') + '</div><div class="al-txt">' + esc(a.testo) + '</div><div class="al-date">' + fmtD(dataAtt(a)) + '</div></div>';
    });
    var ult3 = fatte.slice(0, 3);
    ult3.forEach(function(a) {
      h += '<div class="att-line" onclick="' + (isImmobile ? 'apriAzioniAttivita(\'' + a.id + '\')' : 'apriAzioniAttivitaPersona(\'' + a.id + '\')') + '"><div class="al-lbl" style="color:var(--ink);">FATTA</div><div class="al-txt">' + esc(a.testo.slice(0, 80)) + (a.testo.length > 80 ? '…' : '') + '</div><div class="al-date">' + fmtD(dataAtt(a)) + '</div></div>';
    });
    if (fatte.length > 3) h += '<div class="att-more" onclick="' + (isImmobile ? 'apriAzioniAttivita(\'\')' : 'apriAzioniAttivitaPersona(\'\')') + '">+ ' + (fatte.length - 3) + ' altre…</div>';
  }
  h += '<div style="display:flex;gap:6px;margin-top:8px;"><button class="btn btn-primary" style="flex:1;margin:0;" onclick="' + (isImmobile ? 'apriNuovaAttivita()' : 'apriNuovaAttivitaPersona()') + '">' + ico('piu',14) + '</button><button class="btn btn-secondary" style="flex:1;margin:0;" onclick="' + (isImmobile ? 'apriNuovoAppuntamentoImmobile(\'' + ent.id + '\')' : 'apriNuovoAppuntamentoPersona(\'' + ent.id + '\')') + '">' + ico('calendario',14) + '</button></div>';
  h += '</div>';
  return h;
}

function salvaModificaPersona() {

  p.cognome = g('mp-cognome').trim().toUpperCase();
  p.nome = g('mp-nome').trim().toUpperCase();
  p.telefono = g('mp-telefono').trim();
  p.telefono2 = g('mp-telefono2').trim();

function eliminaPersona() {
  var p = trovaPersona(personaAperta); if (!p) return;

}

/* ============ CAMBIA RUOLI ============ */
function cambiaRuoliPersona() {
  var p = trovaPersona(personaAperta); if (!p) return;
  var h = '<div style="font-size:12.5px;color:var(--tx2);margin-bottom:10px;">Seleziona i ruoli.</div>';

  [['ACQUIRENTE','Acquirente'],['PROP','Venditore'],['LOCATORE','Locatore'],['CONDUTTORE','Conduttore'],['PROFESSIONISTA','Professionista']].forEach(function(r) {

  });
  h += '</div>';
  h += '<div class="btn-row" style="margin-top:14px;"><button class="btn btn-secondary" onclick="apriSchedaPersona(\'' + p.id + '\')">Annulla</button><button class="btn btn-primary" onclick="salvaCambiaRuoli()">Salva</button></div>';

}
function salvaCambiaRuoli() {
  var p = trovaPersona(personaAperta); if (!p) return;
  var nuovi = [];
  document.querySelectorAll('#cr-ruoli .zone-chip.active').forEach(function(b) { nuovi.push(b.dataset.ruolo); });
  if (!nuovi.length) { alert('Seleziona almeno un ruolo'); return; }
  var avevaAcq = (p.ruoli||[]).indexOf('ACQUIRENTE') >= 0;

}

/* ============ LINK IMMOBILI ============ */

    });

}
function unlinkImmobile(pid, iid) {
  var im = DB.immobili.find(function(x){return x.id===iid;});
  if (!im) return;
  im.proprietari = (im.proprietari||[]).filter(function(pr){ return pr.personaId !== pid; });
  im.updatedAt = new Date().toISOString();
  Storage.save(DB); apriLinkImmobili(pid);
}
function apriPickerImmobileLink(pid) {
  var linkedIds = {};
  DB.immobili.forEach(function(i){ (i.proprietari||[]).forEach(function(pr){ if (pr.personaId === pid) linkedIds[i.id] = 1; }); });
  var h = '<input type="search" class="search-bar" id="lk-search" placeholder="Cerca..." style="margin-bottom:10px;"><div id="lk-ris"></div><div class="btn-row"><button class="btn btn-secondary" onclick="apriLinkImmobili(\'' + pid + '\')">Indietro</button></div>';
  apriModal('Cerca immobile', h);
  setTimeout(function() {
    var inp = document.getElementById('lk-search');
    if (inp) inp.addEventListener('input', function() { renderPickLink(pid, inp.value, linkedIds); });
    renderPickLink(pid, '', linkedIds);
  }, 80);
}
function renderPickLink(pid, q, linkedIds) {
  var c = document.getElementById('lk-ris'); if (!c) return;
  var qq = (q || '').toLowerCase().trim();
  var l = DB.immobili.filter(function(im) {
    if (linkedIds[im.id]) return false;
    if (!qq) return true;
    var props = propsImmobile(im).map(function(x){return nomeCogn(x.persona);}).join(' ');
    return ((im.indirizzo||'') + ' ' + (im.cognomeNome||'') + ' ' + props).toLowerCase().indexOf(qq) >= 0;
  }).slice(0, 60);
  if (!l.length) { c.innerHTML = '<div class="empty">Nessun risultato</div>'; return; }
  var h = '<div class="form-group" style="padding:0;">';
  l.forEach(function(im) {
    h += '<div style="padding:10px 14px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;justify-content:space-between;align-items:center;" onclick="linkImmobile(\'' + pid + '\',\'' + im.id + '\')"><div style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(titoloImmobile(im)) + '</div><span class="badge badge-' + im.stato + '">' + im.stato + '</span></div>';
  });
  h += '</div>'; c.innerHTML = h;
}
function linkImmobile(pid, iid) {
  var im = DB.immobili.find(function(x){return x.id===iid;}); if (!im) return;
  if (!im.proprietari) im.proprietari = [];
  im.proprietari.push({ personaId: pid, quota: '', principale: im.proprietari.length === 0, note: '', tipo: 'Proprietà' });
  im.updatedAt = new Date().toISOString();
  Storage.save(DB); apriLinkImmobili(pid);
}
function apriNuovoImmobilePerPersona(pid) {
  var p = trovaPersona(pid); if (!p) return;
  var ad = new Date().toISOString();
  var im = { id: uid(), stato: 'IMM', indirizzo: '', z: 1, villa: false, citofono: '', cognomeNome: nomeCogn(p).toUpperCase(), telefono: p.telefono||'', proprietari: [{ personaId: pid, quota: '', principale: true, note: '', tipo: 'Proprietà' }], condominio: '', sottotipo: '', note: '', zone: [], dettagli: {}, catasto: {}, procura: { presente: false }, ipoteca: { presente: false }, storicoPrezzo: [], documenti: {}, attivita: [], foto: [], gestitoDa: 'me', collegaNome: '', createdAt: ad, updatedAt: ad };
  DB.immobili.push(im);
  Storage.save(DB);
  apriModificaImmobile(im.id);
}
function apriModificaImmobile(iid) {

function salvaNuovoImmobileRapido() {
  var im = DB.immobili.find(function(x){return x.id===immobileAperto;}); if (!im) return;

/* ============ MATCHING (riscritto) ============ */
function parseNum(s) { if (s === undefined || s === null || s === '') return null; var n = parseFloat(String(s).replace(/[^\d.,-]/g,'').replace(/\./g,'').replace(',','.')); return isNaN(n) ? null : n; }
function critReq(r, k) { return (r.requisiti && r.requisiti[k]) || 'preferito'; }
function calcolaMatch(im, per) {
  var r = per.richiesta || {};
  var d = im.dettagli || {};
  function isArr(v) { return Array.isArray(v) ? v.filter(Boolean) : (v ? [v] : []); }
  function ov(a, b) {
    if (!a.length) return null;
    if (!b.length) return null;
    for (var i = 0; i < a.length; i++)
      for (var j = 0; j < b.length; j++)
        if (String(a[i]).toLowerCase().trim() === String(b[j]).toLowerCase().trim()) return true;
    return false;
  }
  function reqOf(k) { return (r.requisiti && r.requisiti[k]) || 'preferito'; }
  var checks = [];
  function add(label, ok, key, weight) {
    if (ok === null || ok === undefined) return;
    var tipo = reqOf(key);
    if (tipo === 'indifferente') return;
    checks.push({ label: label, ok: !!ok, obb: tipo === 'obbligatorio', w: weight || 1 });
  }
  // Budget
  if (r.budget) {
    var b = parseNum(r.budget);
    var p = parseNum(im.prezzo) || parseNum(im.storicoPrezzo && im.storicoPrezzo.length ? im.storicoPrezzo[im.storicoPrezzo.length-1].prezzo : '');
    add('budget', (b === null || p === null) ? true : p <= b, 'budget', 15);
  }
  // Tipologia
  if (r.tipologia && r.tipologia.length) add('tipologia', ov(r.tipologia, isArr(d.tipologia)), 'tipologia', 12);
  // Zona
  if (r.zona && r.zona.length) add('zona', ov(r.zona, isArr(zoneEff(im))), 'zona', 12);
  // Mq commerciali
  if (r.mqMin || r.mqMax) {
    var mn = parseNum(r.mqMin), mx = parseNum(r.mqMax);
    var v = parseNum(d.mqCommerciali) || parseNum(d.mq) || parseNum(d.mqMin);
    if (v !== null) {
      var okMq = true;
      if (mn !== null && v < mn) okMq = false;
      if (mx !== null && v > mx) okMq = false;
      add('mq', okMq, 'mq', 10);
    }
  }
  // Locali
  if (r.locali && r.locali.length) add('locali', ov(r.locali, isArr(d.locali || d.camere)), 'locali', 6);
  // Bagni
  if (r.bagni && r.bagni.length) add('bagni', ov(r.bagni, isArr(d.bagni)), 'bagni', 4);
  // Stato conservativo
  if (r.statoConservativo && r.statoConservativo.length) add('stato', ov(r.statoConservativo, isArr(d.statoConservativo)), 'statoConservativo', 8);
  // Piano
  if (r.piano && r.piano.length) add('piano', ov(r.piano, isArr(d.piano)), 'piano', 3);
  if (r.pianoTipo && r.pianoTipo.length) add('pianoNum', ov(r.pianoTipo, isArr(d.pianoNum)), 'pianoTipo', 3);
  // Classe energetica
  if (r.classeEnergetica && r.classeEnergetica.length) {
    var imCE = String(isArr(d.classeEnergetica)[0] || '').toUpperCase();
    if (imCE) {
      var okCE = r.classeEnergetica.some(function(f) {
        if (f.indexOf('Alta') >= 0) return ['A4','A3','A2','A1','A'].indexOf(imCE) >= 0;
        if (f.indexOf('Media') >= 0) return ['A','B','C'].indexOf(imCE) >= 0;
        if (f.indexOf('Bassa') >= 0) return ['D','E','F','G'].indexOf(imCE) >= 0;
        return true;
      });
      add('classeEnergetica', okCE, 'classeEnergetica', 5);
    }
  }
  // Riscaldamento / infissi / vista / zonaCaratt / cucina
  if (r.riscaldamento && r.riscaldamento !== 'Indifferente' && d.riscaldamento) {
    add('riscaldamento', String(d.riscaldamento).toLowerCase() === String(r.riscaldamento).toLowerCase(), 'riscaldamento', 2);
  }
  if (r.riscaldamentoTipo && r.riscaldamentoTipo.length) add('riscaldamentoTipo', ov(r.riscaldamentoTipo, isArr(d.riscaldamentoTipo)), 'riscaldamentoTipo', 2);
  if (r.infissi && r.infissi.length) add('infissi', ov(r.infissi, isArr(d.infissi)), 'infissi', 2);
  if (r.vista && r.vista.length) add('vista', ov(r.vista, isArr(d.vista)), 'vista', 2);
  if (r.zonaCaratt && r.zonaCaratt.length) add('zonaCaratt', ov(r.zonaCaratt, isArr(d.zonaCaratt)), 'zonaCaratt', 2);
  if (r.cucina && r.cucina.length) add('cucina', ov(r.cucina, isArr(d.cucina)), 'cucina', 2);
  // Dotazioni
  ['ascensore','balcone','terrazzo','giardino','box','postoAuto','cantina'].forEach(function(k) {
    var req = r[k];
    if (!req || req === 'Indifferente') return;
    var imSi = d[k] === 'Sì';
    var ok;
    if (req === 'Meglio') ok = true;
    else if (req === 'Sì') ok = imSi;
    else if (req === 'No') ok = !imSi;
    else ok = true;
    var w = (k === 'box' || k === 'ascensore') ? 4 : 2;
    add(k, ok, k, w);
  });
  if (r.boxTipo && (r.box === 'Sì' || r.box === 'Meglio') && d.boxTipo) {
    add('boxTipo', String(d.boxTipo).toLowerCase() === String(r.boxTipo).toLowerCase(), 'boxTipo', 2);
  }
  // Score
  if (!checks.length) return { score: 0 };
  var obbAll = checks.filter(function(c){ return c.obb; });
  var prefAll = checks.filter(function(c){ return !c.obb; });
  var obbOk = obbAll.filter(function(c){ return c.ok; }).length;
  var prefOk = prefAll.filter(function(c){ return c.ok; }).length;
  var score;
  if (obbAll.length > 0) {
    var ratio = obbOk / obbAll.length;
    if (ratio < 1) {
      score = Math.round(ratio * 50 * 0.8 + (prefAll.length ? (prefOk / prefAll.length) * 10 : 0));
    } else {
      var pr = prefAll.length > 0 ? prefOk / prefAll.length : 1;
      score = Math.round(60 + pr * 40);
    }
  } else {
    var pr2 = prefAll.length > 0 ? prefOk / prefAll.length : 0.5;
    score = Math.round(pr2 * 100);
  }
  return { score: Math.min(100, Math.max(0, score)) };
}
function matchImmobile(im) {
  var acq = DB.persone.filter(function(p){ return (p.ruoli||[]).indexOf('ACQUIRENTE') >= 0; });
  var r = [];
  acq.forEach(function(p) { var m = calcolaMatch(im, p); if (m.score > 0) { m.persona = p; r.push(m); } });
  return r.sort(function(a, b){ return b.score - a.score; });
}
function matchAcquirente(per) {
  var l = DB.immobili.filter(function(i){ return i.stato === 'NT' || i.stato === 'INK'; });
  var r = [];
  l.forEach(function(i) { var m = calcolaMatch(i, per); if (m.score > 0) { m.immobile = i; r.push(m); } });
  return r.sort(function(a, b){ return b.score - a.score; });
}

/* === LONG-PRESS AGENDA — stile Apple, corretto === */
var lpCurrentYmd = null, lpCurrentOra = null;
function attachGestures() {
  var el = document.getElementById('agenda-page-content');
  if (!el || el._gesturesAtt) return;
  el._gesturesAtt = true;
  var startDist = 0, pinchSwitch = false;
  var tSX = 0, tSY = 0, tST = 0;
  var swipeFired = false, twoF = false;
  var lpTimer = null, lpStart = null, lpFired = false;
  var lpPreview = null, lpSlot = null;

  function dist(t1, t2) { return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY); }
  function cancelLP() {
    if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
    if (lpPreview) { try { lpPreview.remove(); } catch(e) {} lpPreview = null; }
    if (lpSlot) { try { lpSlot.remove(); } catch(e) {} lpSlot = null; }
    lpCurrentYmd = null; lpCurrentOra = null;
    var tl = el.querySelector('.ag-days');
    if (tl) tl.classList.remove('touching-longpress');
  }
  function getDayColAt(x, y) {
    var node = document.elementFromPoint(x, y);
    while (node && node !== document.body) {
      if (node.classList && node.classList.contains('ag-day-col')) return node;
      node = node.parentNode;
    }
    return null;
  }
  function updateLp(clientX, clientY) {
    var col = getDayColAt(clientX, clientY);
    if (!col) return null;
    var rect = col.getBoundingClientRect();
    var yIn = clientY - rect.top;
    var minTot = Math.round((yIn / ORA_H) * 60 / 5) * 5;
    if (minTot < 0) minTot = 0;
    if (minTot > 23 * 60 + 55) minTot = 23 * 60 + 55;
    var or = { h: Math.floor(minTot / 60), m: minTot % 60, ymd: col.dataset.ymd };
    if (!lpPreview) {
      lpPreview = document.createElement('div');
      lpPreview.className = 'ag-longpress-preview';
      document.body.appendChild(lpPreview);
    }
    var endM = or.m + 60;
    var endH = or.h + Math.floor(endM / 60);
    endM = endM % 60;
    if (endH > 23) { endH = 23; endM = 59; }
    lpPreview.textContent = pad2(or.h) + ':' + pad2(or.m) + ' – ' + pad2(endH) + ':' + pad2(endM);
    lpPreview.style.left = clientX + 'px';
    lpPreview.style.top = Math.max(60, clientY - 46) + 'px';
    if (lpSlot && lpSlot.parentNode !== col) { try { lpSlot.remove(); } catch(e) {} lpSlot = null; }
    if (!lpSlot) {
      lpSlot = document.createElement('div');
      lpSlot.className = 'ag-lp-slot';
      col.appendChild(lpSlot);
    }
    lpSlot.style.top = (or.h * ORA_H + or.m * (ORA_H / 60)) + 'px';
    lpSlot.style.height = ORA_H + 'px';
    lpCurrentYmd = or.ymd; lpCurrentOra = or;
    return or;
  }

function apriPickDoc(imId, t) {

/* ============ SYNC ATTIVITÀ IMMOBILE → PERSONE ============ */
function syncAttToPersone(iid, attId, action) {
  var im = DB.immobili.find(function(x){return x.id===iid;}); if (!im) return;
  var props = propsImmobile(im);
  props.forEach(function(pr) {
    var p = pr.persona;
    if (!p) return;
    if (!Array.isArray(p.attivita)) p.attivita = [];
    if (action === 'delete') {
      p.attivita = p.attivita.filter(function(a){ return a.id !== attId; });
    } else {
      var source = (im.attivita||[]).find(function(a){ return a.id === attId; });
      if (!source) return;
      var copy = JSON.parse(JSON.stringify(source));
      var idx = -1;
      for (var i = 0; i < p.attivita.length; i++) { if (p.attivita[i].id === attId) { idx = i; break; } }
      if (idx >= 0) p.attivita[idx] = copy; else p.attivita.push(copy);
    }
    p.updatedAt = new Date().toISOString();
  });
}

/* ============ ROUND ============ */
var _roundW = null, _roundAttivo = false, _roundRag = 500;
var _roundDati = { persone:[], immobili:[], condomini:[] };
function haversine(a, b, c, d) { var R = 6371000; var f1 = a*Math.PI/180, f2 = c*Math.PI/180; var df = (c-a)*Math.PI/180, dl = (d-b)*Math.PI/180; var x = Math.sin(df/2)*Math.sin(df/2) + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)*Math.sin(dl/2); return 2*R*Math.asin(Math.sqrt(x)); }
function roundMeToggle() { if (_roundAttivo) roundMeFerma(); else roundMeAvvia(); }
function roundMeAvvia() {
  if (!navigator.geolocation) { alert('GPS non disponibile'); return; }
  if (_roundW) { try { navigator.geolocation.clearWatch(_roundW); } catch(e) {} _roundW = null; }
  _roundAttivo = true;
  var b = document.getElementById('btn-roundme-start'); if (b) { b.textContent = '◼ Ferma'; b.style.background = 'var(--vnd)'; }
  _roundW = navigator.geolocation.watchPosition(function(p){ roundMeAggiorna(p.coords.latitude, p.coords.longitude); }, function(e){ roundMeFerma(); alert('GPS: ' + e.message); }, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
}
function roundMeFerma() { if (_roundW) { try { navigator.geolocation.clearWatch(_roundW); } catch(e) {} _roundW = null; } _roundAttivo = false; var b = document.getElementById('btn-roundme-start'); if (b) { b.textContent = '▶ GPS'; b.style.background = ''; } }
function roundMeAggiorna(lat, lng) {
  var R = _roundRag;
  var pers = DB.persone.filter(function(p){ return p.lat && p.lng; }).map(function(p){ return Object.assign({}, p, { dist: haversine(lat, lng, p.lat, p.lng) }); }).filter(function(p){ return p.dist <= R; }).sort(function(a, b){ return a.dist - b.dist; });
  var imms = DB.immobili.filter(function(i){ return i.lat && i.lng; }).map(function(i){ return Object.assign({}, i, { dist: haversine(lat, lng, i.lat, i.lng) }); }).filter(function(i){ return i.dist <= R; });
  var mc = {}, orf = [];
  imms.forEach(function(i){ var c = condoDi(i); if (c && !i.villa) { if (!mc[c]) mc[c] = []; mc[c].push(i); } else orf.push(i); });
  var cond = Object.keys(mc).map(function(k){ var a = mc[k]; var mn = Math.min.apply(null, a.map(function(x){ return x.dist; })); return { nome:k, immobili:a, dist:mn }; }).sort(function(a,b){ return a.dist - b.dist; });
  orf.sort(function(a,b){ return a.dist - b.dist; });
  _roundDati = { persone:pers, immobili:orf, condomini:cond, lat:lat, lng:lng };
  roundMeRender();
}
function roundMeRender() {
  var c = document.getElementById('roundme-contenuto'); if (!c) return;
  var p = _roundDati;

  DB.immobili.forEach(function(im){ var props = propsImmobile(im).map(function(x){ return nomeCogn(x.persona); }); var f = [im.indirizzo, im.cognomeNome, im.telefono, im.citofono, im.condominio].concat(props); if (f.some(function(x){ return (x||'').toLowerCase().indexOf(qq) >= 0; })) res.i.push(im); });
  raccogliAtt().forEach(function(a){ if ((a.testo||'').toLowerCase().indexOf(qq) >= 0) res.a.push(a); });
  for (var co in (DB.condomini||{})) if (co.toLowerCase().indexOf(qq) >= 0) res.c.push(co);
  var h = '';
  if (res.p.length) { h += '<div style="font-size:10.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;margin:6px 0 4px;">Persone</div>'; res.p.slice(0,8).forEach(function(p){ h += '<div class="immobile-line" style="margin-bottom:5px;" onclick="chiudiModal();setTimeout(function(){apriSchedaPersona(\'' + p.id + '\')},100)"><span class="txt">' + esc(nomeCogn(p)) + '</span></div>'; }); }
  if (res.i.length) { h += '<div style="font-size:10.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;margin:12px 0 4px;">Immobili</div>'; res.i.slice(0,8).forEach(function(im){ h += '<div class="immobile-line" style="margin-bottom:5px;" onclick="chiudiModal();setTimeout(function(){apriScheda(\'' + im.id + '\')},100)"><span class="txt">' + esc(titoloImmobile(im)) + '</span></div>'; }); }
  if (res.a.length) { h += '<div style="font-size:10.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;margin:12px 0 4px;">Attività</div>'; res.a.slice(0,8).forEach(function(a){ h += '<div class="immobile-line" style="margin-bottom:5px;" onclick="chiudiModal();setTimeout(function(){apriAzioniAttGlob(\'' + a.id + '\',\'' + a.entTipo + '\',\'' + a.entId + '\')},100)"><span class="txt">' + esc(a.testo.slice(0,50)) + '</span></div>'; }); }
  if (res.c.length) { h += '<div style="font-size:10.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;margin:12px 0 4px;">Condomini</div>'; res.c.slice(0,8).forEach(function(co){ h += '<div class="immobile-line" style="margin-bottom:5px;" onclick="chiudiModal();setTimeout(function(){apriModificaCondominio(\'' + esc(co).replace(/'/g,'') + '\')},100)"><span class="txt">' + esc(co) + '</span></div>'; }); }
  if (!res.p.length && !res.i.length && !res.a.length && !res.c.length) h = '<div class="empty" style="padding:20px 8px;font-size:12px;">Nessun risultato</div>';
  c.innerHTML = h;
}

/* ============ IMPOSTAZIONI / BACKUP ============ */
function apriImpostazioniCitta() {
  var h = '<div class="form-group"><div class="form-row"><label class="form-label">Città</label><input class="form-input" id="imp-c" value="' + esc(citta()) + '"></div></div>';
  h += '<button class="btn btn-secondary" onclick="document.getElementById(\'imp-c\').value=\'' + CITTA_DEFAULT + '\'">Ripristina Cremona</button>';
  h += '<div class="btn-row"><button class="btn btn-secondary" onclick="chiudiModal()">Annulla</button><button class="btn btn-primary" onclick="salvaCitta()">Salva</button></div>';
  apriModal('Città', h);
}
function salvaCitta() { var v = ((document.getElementById('imp-c')||{}).value||'').trim().toUpperCase(); if (!v) { alert('Inserisci'); return; } DB.cittaPrincipale = v; Storage.save(DB); _coordsCitta = null; if (confirm('Svuota cache geocodifica?')) { geocodeCache = {}; salvaGeocodeCache(); } chiudiModal(); aggiornaInfoSistema(); if (map) aggiornaMappa(); }
function blobToB64(b) { return new Promise(function(r, j) { var rd = new FileReader(); rd.onload = function(){ var s = rd.result; r(s.split(',')[1] || s); }; rd.onerror = function(){ j(rd.error); }; rd.readAsDataURL(b); }); }
function b64ToBlob(b, m) { var bin = atob(b); var a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: m || 'application/octet-stream' }); }
function esportaBackup() {
  var bk = { versione:DB_VERSION, exportedAt:new Date().toISOString(), db:JSON.parse(JSON.stringify(DB)), foto:[], documenti:[] };
  PhotoDB.keys().then(function(pk){ var ch = Promise.resolve(); pk.forEach(function(k){ ch = ch.then(function(){ return PhotoDB.get(k).then(function(r){ if (!r || !r.blob) return; return blobToB64(r.blob).then(function(b){ bk.foto.push({ id:k, data:b, meta:r.meta||{} }); }); }); }); }); return ch.then(function(){ return PhotoDB.docKeys(); }); }).then(function(dk){ var ch2 = Promise.resolve(); dk.forEach(function(k){ ch2 = ch2.then(function(){ return PhotoDB.getDoc(k).then(function(r){ if (!r || !r.blob) return; return blobToB64(r.blob).then(function(b){ bk.documenti.push({ id:k, data:b, meta:r.meta||{} }); }); }); }); }); return ch2; }).then(function(){ var d = JSON.stringify(bk); var b = new Blob([d], { type:'application/json' }); var u = URL.createObjectURL(b); var o = new Date(); var n = 'aranjo_backup_' + o.getFullYear() + '-' + pad2(o.getMonth()+1) + '-' + pad2(o.getDate()) + '.json'; var a = document.createElement('a'); a.href = u; a.download = n; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u); }).catch(function(e){ alert('Errore: ' + e.message); });
}
function importaBackup(e) {
  var f = e.target.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function(ev) {
    try {
      var p = JSON.parse(ev.target.result);
      if (!p || typeof p !== 'object') throw new Error('Formato');
      if (!confirm('Sovrascrivere i dati?')) return;
      var isNew = p.db && p.versione;
      var dd = isNew ? p.db : p;
      DB = Storage.migra(dd);
      if (!DB.coordinateCondomini) DB.coordinateCondomini = {};
      if (!DB.condomini) DB.condomini = {};
      if (!DB.pianificazioni) DB.pianificazioni = [];
      if (!Array.isArray(DB.attivita)) DB.attivita = [];
      if (!Array.isArray(DB.chiamate)) DB.chiamate = [];
      if (!Array.isArray(DB.magazzino)) DB.magazzino = [];
      if (!Array.isArray(DB.rapportini)) DB.rapportini = [];
      var ch = Promise.resolve();
      if (isNew && Array.isArray(p.foto)) p.foto.forEach(function(f2){ ch = ch.then(function(){ try { var b = b64ToBlob(f2.data, (f2.meta && f2.meta.mime) || 'image/jpeg'); return PhotoDB.save(f2.id, b, f2.meta||{}); } catch(e) {} }); });
      if (isNew && Array.isArray(p.documenti)) p.documenti.forEach(function(f2){ ch = ch.then(function(){ try { var b = b64ToBlob(f2.data, (f2.meta && f2.meta.mime) || 'application/octet-stream'); return PhotoDB.saveDoc(f2.id, b, f2.meta||{}); } catch(e) {} }); });
      ch.then(function(){ Storage.save(DB); renderListaImmobili(); aggiornaInfoSistema(); if (map) aggiornaMappa(); renderPersone(); renderAttivita(); aggiornaBadgeAttivita(); aggiornaAgendaSettimanale(); renderPlanning(); aggiornaHeaderApp(); renderChiamateOggi(); renderMagazzino(); renderRapportini(); alert('OK'); });
    } catch (err) { alert('Errore: ' + err.message); }
  };
  rd.readAsText(f); e.target.value = '';
}
function cancellaTutto() {
  if (!confirm('Cancellare TUTTI i dati?')) return;
  if (!confirm('Sei sicuro?')) return;
  PhotoDB.keys().then(function(k){ var c = Promise.resolve(); k.forEach(function(id){ c = c.then(function(){ return PhotoDB.del(id).catch(function(){}); }); }); return c; }).then(function(){ return PhotoDB.docKeys(); }).then(function(k){ var c = Promise.resolve(); k.forEach(function(id){ c = c.then(function(){ return PhotoDB.delDoc(id).catch(function(){}); }); }); return c; }).then(function(){ for (var k in photoCache) { try { URL.revokeObjectURL(photoCache[k]); } catch(e) {} delete photoCache[k]; } DB = Storage.default(); Storage.save(DB); renderListaImmobili(); aggiornaInfoSistema(); if (map) aggiornaMappa(); renderPersone(); renderAttivita(); aggiornaBadgeAttivita(); aggiornaAgendaSettimanale(); renderPlanning(); aggiornaHeaderApp(); renderChiamateOggi(); renderMagazzino(); renderRapportini(); alert('Cancellato'); });
}
function richiediPermessoNotifiche(sa) {
  if (!('Notification' in window)) { if (sa) alert('Non supportate'); return Promise.resolve(false); }
  if (Notification.permission === 'granted') { if (sa) alert('Già attive'); return Promise.resolve(true); }
  if (Notification.permission === 'denied') { if (sa) alert('Bloccate'); return Promise.resolve(false); }
  return Notification.requestPermission().then(function(p){ if (sa) alert(p === 'granted' ? 'OK' : 'Negato'); return p === 'granted'; });
}
function schedulaNotifiche() {
  var ad = Date.now(); var fin = ad + 24*60*60*1000;
  (DB.appuntamenti||[]).forEach(function(a){ if (a.stato === 'annullato' || a.stato === 'eseguito') return; var t = new Date(a.dataInizio).getTime(); if (t < ad || t > fin) return; var r = Math.max(1000, t - ad - 15*60*1000); setTimeout(function(){ notifica('Appuntamento 15 min', a.titolo); }, r); });
  raccogliAtt().forEach(function(a){ if (a.tipo !== 'da_fare' || a.completata) return; var t = new Date(a.dataPrevista).getTime(); if (t < ad || t > fin) return; var r = Math.max(1000, t - ad); setTimeout(function(){ notifica('Attività', a.testo); }, r); });
}
function notifica(t, b) { try { if (Notification.permission === 'granted') new Notification(t, { body:b, icon:'./android-chrome-192x192.png' }); } catch(e) {} }

/* ============ BACK GESTURE ============ */
window.addEventListener('popstate', function(e) {
  if (window._aranjoCloseFromUI) { window._aranjoCloseFromUI = false; return; }
  var mo = document.getElementById('modal').classList.contains('open');
  if (mo) {
    if (window._modalStack > 0) window._modalStack--;
    chiudiModal(true);
    if (window._modalStack > 0) { try { history.pushState({ _modal:true }, ''); } catch(err) {} }
    return;
  }
  var ac = document.getElementById('app-content');
  if (ac.classList.contains('agenda-mode')) { tornaAttivita(); return; }
  var at = document.querySelector('.tabbar button.active');
  if (at && at.dataset.tab !== 'immobili') switchTab('immobili');
});

/* ============ BOOT ============ */
function avviaBoot() {
  Storage2.open().then(function() {
    Storage2.persist();
    Storage.loadAsync().then(function(data) {
      DB = data;
      if (!DB.coordinateCondomini) DB.coordinateCondomini = {};
      if (!DB.pianificazioni) DB.pianificazioni = [];
      if (!Array.isArray(DB.attivita)) DB.attivita = [];
      if (!Array.isArray(DB.chiamate)) DB.chiamate = [];
      if (!Array.isArray(DB.magazzino)) DB.magazzino = [];
      if (!Array.isArray(DB.rapportini)) DB.rapportini = [];
      try {
        applicaIcone();
        updateTemaBtn();
        aggiornaChips();
        renderListaImmobili();
        aggiornaInfoSistema();
        renderPersone();
        renderAttivita();
        aggiornaBadgeAttivita();
        aggiornaAgendaSettimanale();
        renderPlanning();
        aggiornaHeaderApp();
        renderChiamateOggi();
        renderMagazzino();
        renderRapportini();
      } catch(e) { console.error(e); }
      try { history.replaceState({ _base:true }, ''); } catch(e) {}
      window._modalStack = 0;
      window._aranjoCloseFromUI = false;
      richiediPermessoNotifiche(false);
      schedulaNotifiche();
      setInterval(function(){ schedulaNotifiche(); aggiornaBadgeAttivita(); }, 60*60*1000);
      window.addEventListener('pagehide', function(){ try { Storage.save(DB); } catch(e) {} });
    }).catch(function(e){ alert('Errore: ' + e.message); });
  }).catch(function(e){ alert('IndexedDB: ' + e.message); });
}
avviaBoot();
