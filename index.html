<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ARANJÒ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f6f7f9">
<link rel="icon" type="image/png" sizes="32x32" href="./android-chrome-192x192.png">
<title>ARANJÒ</title>
<script>
try{
  var _t = localStorage.getItem('aranjo_theme') || 'auto';
  var _r = (_t==='dark')?'dark':(_t==='light')?'light':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme', _r);
}catch(e){}
</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --blu:#1b3556; --blu-soft:#eef2f8;
  --acc:#e0601f; --acc-soft:#fdf3ec;
  --bg:#f6f7f9; --bg2:#eceef2; --card:#fff;
  --tx:#14171c; --tx2:#667085; --tx3:#98a2b3;
  --bd:#eceef1; --bd2:#dfe2e8;
  --r:16px; --rs:12px; --rp:999px;
  --tab-h:58px; --maxw:640px;
  --imm:#94a3b8; --pa:#e5a04a; --nt:#2563eb; --ink:#047857; --vnd:#b91c1c;
  --rr:#7c3aed; --prof:#0e7490;
  --ok:#047857; --ko:#b91c1c; --warn:#c2740c;
  --fest:#dc2626; --coll:#7c3aed;
  --ora-h:44px;
}
:root[data-theme="dark"]{
  --blu:#8ab0d4; --blu-soft:#1a2533;
  --acc:#ec6f2a; --acc-soft:#2a1a10;
  --bg:#0f0f11; --bg2:#1a1a1d; --card:#17171a;
  --tx:#e8e8ea; --tx2:#9a9aa0; --tx3:#6a6a72;
  --bd:#232327; --bd2:#2e2e33;
  --imm:#94a3b8; --pa:#e5a04a; --nt:#7aa7ff; --ink:#34d399; --vnd:#f87171;
  --rr:#b79cff; --prof:#38bdf8;
  --fest:#f87171; --coll:#a78bfa;
}
html{height:100%;overflow:hidden}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,.item-card,.item-card-compact,.chip,.opt,.ms-opt,.att-item,.immobile-line,.quick-btn{touch-action:manipulation}
/* Migliorie pratiche per l'uso da iPhone: controlli leggibili, focus visibile e meno tocchi accidentali. */
button,input,select,textarea{font-family:inherit}
input,select,textarea{max-width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:380px){.app-header{padding-left:14px;padding-right:14px}.app-content{padding-left:10px;padding-right:10px}.btn{padding:12px 12px}.item-card{padding:12px}}
.aranjo-error-toast{position:fixed;z-index:10000;left:12px;right:12px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px);padding:12px 14px;border-radius:12px;background:var(--ko);color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 24px #0003}
.aranjo-error-toast button{margin-left:8px;border:0;background:transparent;color:#fff;font-size:18px;font-weight:700;float:right}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.app-header{padding:14px 20px 10px;padding-top:calc(14px + env(safe-area-inset-top));flex-shrink:0;background:var(--bg);padding-bottom:8px}
.app-header h1{font-size:26px;font-weight:300;letter-spacing:-.01em;color:var(--blu);line-height:1}
.app-header h1 span{color:var(--acc)}
.brand-sub{font-size:11px;letter-spacing:.01em;color:var(--tx3);margin-top:3px}
#header-prossimo-app{flex-shrink:0;text-align:right;max-width:45%;cursor:pointer;display:none}
#header-prossimo-app .lbl{font-size:8px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
#header-prossimo-app-txt{font-size:10.5px;font-weight:700;color:var(--blu);line-height:1.25;margin-top:1px;overflow:hidden}
.app-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 14px calc(80px + env(safe-area-inset-bottom));min-height:0}
.app-content.attivita-active{padding:2px 14px calc(60px + env(safe-area-inset-bottom))}
.att-history-list{display:flex;flex-direction:column;gap:7px}
.att-history-row{padding:10px;border:1px solid var(--bd);border-radius:10px;display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.att-history-row:active{opacity:.72}
.att-history-row .ahr-main{flex:1;min-width:0}
.att-history-row .ahr-date{font-size:10px;color:var(--tx3);margin-bottom:3px}
.att-history-row .ahr-text{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.att-history-row .ahr-state{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}

.app-content.agenda-mode{display:flex !important;flex-direction:column;padding:0 0 calc(var(--tab-h) + env(safe-area-inset-bottom)) 0 !important;overflow:hidden !important}

.view{display:none}
.view.active{display:block}
.card,.item-card,.collapsible,.att-box,.scheda-top,.att-gruppo,.agenda-sett,.planning-sett,.form-group,.att-subtab{border-radius:var(--r)}
.card{background:var(--card);padding:14px 16px;margin-bottom:8px;border:1px solid var(--bd)}
.card h2{font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card h2 .dot{display:none}
.empty{text-align:center;padding:56px 14px;color:var(--tx3);font-size:13px;font-weight:500}
.empty svg{width:28px;height:28px;opacity:.35;margin-bottom:8px;display:block;margin-left:auto;margin-right:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px 16px;border:1px solid transparent;border-radius:14px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:6px;background:transparent;color:inherit;transition:opacity .12s,transform .12s}
.btn:active{opacity:.7;transform:scale(.985)}
.btn-primary{background:var(--acc);color:#fff}
.btn-secondary{background:var(--card);color:var(--blu);border-color:var(--bd2)}
.btn-danger{background:var(--card);color:var(--vnd);border-color:var(--bd2)}
.btn svg{width:15px;height:15px;flex:none}
.btn-icon{width:42px;height:42px;padding:0;flex:0 0 auto;border-radius:50%;margin-bottom:0}
.btn-icon svg{width:19px;height:19px}
.btn-row{display:flex;gap:6px;margin-top:10px}
.btn-row .btn{margin-bottom:0;flex:1}
.quick-row{display:flex;gap:8px;margin-bottom:10px}
.quick-btn{flex:1;padding:11px;border:none;border-radius:12px;background:var(--bg2);color:var(--tx2);font:600 14px inherit;font-family:inherit;cursor:pointer;transition:background .15s,color .15s}
.quick-btn.on{background:var(--blu);color:var(--bg)}
.add-btn{background:transparent;border:1px dashed var(--bd2);border-radius:var(--rs);padding:9px 11px;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--blu);cursor:pointer;width:100%;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:5px}
.add-btn svg{width:13px;height:13px}

.chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{border:none;background:var(--bg2);color:var(--tx2);padding:7px 14px;border-radius:var(--rp);font-family:inherit;font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;gap:4px;transition:background .15s,color .15s}
.chip.active{background:var(--blu);color:var(--bg)}
.chip.acc.active{background:var(--acc);color:#fff}
.chip svg{width:11px;height:11px}
.zone-chips{display:flex;flex-wrap:wrap;gap:5px}
.zone-chip{background:var(--bg2);border:1px solid transparent;padding:6px 11px;border-radius:var(--rp);font-family:inherit;font-size:12px;font-weight:500;color:var(--tx2);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.zone-chip.active{background:var(--blu);color:#fff}
.zone-chip.acc.active{background:var(--acc)}

.search-sticky{position:sticky;top:-2px;z-index:20;background:var(--bg);padding:6px 0 8px}
.search-bar{width:100%;background:var(--bg2);border:1px solid transparent;border-radius:14px;padding:11px 16px;font-family:inherit;font-size:14px;font-weight:500;color:var(--tx);outline:none;transition:background .15s,border-color .15s}
.search-bar:focus{background:var(--card);border-color:var(--bd2)}
.search-bar::placeholder{color:var(--tx3);font-weight:400;font-size:13px}

.item-card{background:var(--card);padding:14px 16px;margin-bottom:6px;border:1px solid var(--bd);cursor:pointer;transition:transform .12s,background .12s}
.item-card:active{transform:scale(.985);background:var(--bg2)}
.item-row{display:flex;align-items:flex-start;gap:7px;margin-bottom:3px;flex-wrap:wrap}
.item-title{font-size:14px;font-weight:600;color:var(--tx);flex:1;word-break:break-word;line-height:1.32;letter-spacing:-.01em}
.item-sub{font-size:12px;color:var(--tx2);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.item-sub svg{flex-shrink:0;width:11px;height:11px;opacity:.55}
.item-meta{font-size:11px;color:var(--tx3);margin-top:6px;padding-top:6px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:6px}
.icc-list{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:0 0 8px 6px}
.item-card-compact{background:var(--card);border-radius:8px;padding:7px 9px;border:1px solid var(--bd);cursor:pointer;min-height:36px;display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden;transition:transform .12s,background .12s}
.item-card-compact:active{transform:scale(.985);background:var(--bg2)}
.icc-cito{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:3px;overflow:hidden;font-weight:600}
.icc-owner{font-size:10.5px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.badge{display:inline-block;padding:2px 7px;border-radius:var(--rp);font-size:9px;font-weight:700;color:#fff;letter-spacing:.04em;flex-shrink:0;text-transform:uppercase;background:var(--tx3)}
@supports (background:color-mix(in srgb,red 10%,transparent)){
  .badge[class*="badge-"]{background:color-mix(in srgb,var(--bc,var(--tx3)) 13%,transparent);color:var(--bc,var(--tx3));font-weight:700;padding:3px 9px}
}
.badge-IMM{--bc:var(--imm)} .badge-PA{--bc:var(--pa)} .badge-NT{--bc:var(--nt)} .badge-INK{--bc:var(--ink)} .badge-VND{--bc:var(--vnd)}
.badge-PROP{--bc:var(--blu)} .badge-ACQUIRENTE{--bc:var(--rr)} .badge-PROFESSIONISTA{--bc:var(--prof)} .badge-LOCATORE{--bc:#7c3aed} .badge-CONDUTTORE{--bc:#0e7490}
.badge-RR-attiva{--bc:var(--rr)} .badge-RR-in-attesa{--bc:var(--pa)} .badge-RR-proposta{--bc:var(--ink)} .badge-RR-ha-comprato{--bc:var(--vnd)} .badge-RR-non-attiva{--bc:var(--tx3)} .badge-RR-rogitato{--bc:#162a47}
.badge-collega{--bc:var(--coll)}
.badge-VAL{--bc:var(--ink)}
.badge-daval{--bc:var(--warn)}

.tabbar{position:fixed;bottom:0;left:0;right:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom));background:rgba(255,255,255,.82);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-top:1px solid var(--bd);display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom);padding-top:4px;z-index:100}
:root[data-theme="dark"] .tabbar{background:rgba(15,15,17,.9)}
.tabbar button{background:none;border:none;display:flex;align-items:center;justify-content:center;flex:1;height:100%;color:var(--tx3);font-family:inherit;cursor:pointer;position:relative;padding:0}
.tabbar button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:color .15s}
.tabbar button.active{color:var(--blu)}
.tabbar button.active svg{stroke-width:2}
.tabbar button.active::after{content:'';position:absolute;bottom:7px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
.tabbar .badge-tab{position:absolute;top:4px;right:30%;background:var(--acc);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:var(--rp);min-width:15px;text-align:center;display:none}
.tabbar .badge-tab.show{display:block}
.fab{position:fixed;right:18px;bottom:calc(var(--tab-h) + 20px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--acc);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(224,96,31,.3);cursor:pointer;z-index:50}
.fab:active{transform:scale(.94)}
.fab svg{width:24px;height:24px}
.fab-menu{position:fixed;right:18px;bottom:calc(var(--tab-h) + 84px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:8px;align-items:flex-end;z-index:51}
.fab-menu.open{display:flex}
.fab-menu button{background:var(--card);border:1px solid var(--bd2);width:46px;height:46px;border-radius:50%;color:var(--blu);box-shadow:0 6px 18px rgba(20,23,28,.1);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab-menu button svg{width:20px;height:20px}

.modal-overlay{position:fixed;inset:0;background:rgba(15,20,30,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:9000;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
@keyframes slideUp{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
.modal-sheet{background:var(--bg);width:100%;max-width:var(--maxw);max-height:92dvh;border-radius:24px 24px 0 0;box-shadow:0 -12px 40px rgba(20,23,28,.14);display:flex;flex-direction:column;animation:slideUp .25s cubic-bezier(.16,1,.3,1);overflow:hidden}
:root[data-theme="dark"] .modal-sheet{background:var(--bg)}
.modal-header{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;position:relative;border-bottom:none}
.modal-header::before{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);width:28px;height:4px;border-radius:2px;background:var(--bd2)}
.modal-header h2{font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--blu);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}
.modal-close{background:transparent;border:none;width:30px;height:30px;border-radius:50%;color:var(--tx2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:4px}
.modal-close svg{width:15px;height:15px}
.modal-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}

.form-group{background:var(--card);padding:0 14px;margin-bottom:8px;border:1px solid var(--bd)}
.form-row{padding:11px 0;border-bottom:1px solid var(--bd)}
.form-row:last-child{border-bottom:none}
.form-label{font-size:11.5px;font-weight:500;color:var(--tx3);margin-bottom:4px;display:block}
.form-input,.form-select,.form-textarea{width:100%;border:none;background:transparent;font-family:inherit;font-size:16px;font-weight:500;color:var(--tx);outline:none;padding:0}
.form-input::placeholder{color:var(--tx3);font-weight:400}
.form-textarea{resize:vertical;min-height:50px;line-height:1.5}
.form-select{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='11' height='11' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 2px center;padding-right:20px}
.box2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box2 > div{min-width:0}
.box2 input,.box2 select{width:100%;background:var(--bg2);padding:11px 12px;border:none;border-radius:10px;font-family:inherit;font-size:16px;font-weight:500;color:var(--tx);outline:none}

.scheda-top{background:var(--card);padding:18px;margin-bottom:8px;border:1px solid var(--bd);border-radius:20px}
.scheda-top .top-title{font-size:19px;font-weight:600;color:var(--tx);line-height:1.3;letter-spacing:-.02em;word-break:break-word}
.scheda-top .top-sub{font-size:12.5px;color:var(--tx2);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.scheda-top .top-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;align-items:center}
.scheda-top .top-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.scheda-top .top-actions .btn{margin-bottom:0;flex:1}
.scheda-top .top-actions .btn-icon{flex:0 0 42px;background:var(--bg2);border-color:transparent;color:var(--blu)}

.info-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;gap:10px}
.info-row + .info-row{border-top:1px solid var(--bd)}
.info-row .label{color:var(--tx3);flex-shrink:0}
.info-row .value{color:var(--tx);font-weight:500;text-align:right;word-break:break-word}
.immobile-line{background:transparent;border:1px solid var(--bd);border-radius:var(--rs);padding:9px 11px;font-size:13px;color:var(--tx);display:flex;justify-content:space-between;align-items:center;gap:7px;cursor:pointer;transition:background .12s}
.immobile-line:active{background:var(--bg2)}
.immobile-line .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.immobile-line svg{width:13px;height:13px}

.collapsible{background:var(--card);margin-bottom:6px;border:1px solid var(--bd);overflow:hidden}
.collapsible-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer}
.collapsible-header .ch-label{font-size:13.5px;font-weight:600;color:var(--tx);display:flex;align-items:center;gap:7px}
.collapsible-header .ch-meta{font-size:11px;color:var(--tx3);font-weight:500}
.collapsible-header .chev{transition:transform .2s;color:var(--tx3);display:flex}
.collapsible-header .chev svg{width:14px;height:14px}
.collapsible.open .collapsible-header .chev{transform:rotate(90deg)}
.collapsible-body{display:none;padding:0 14px 12px}
.collapsible.open .collapsible-body{display:block}
details.fold{padding:0;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px}
details.fold>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:13.5px;font-weight:600;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'';width:7px;height:7px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);transform:rotate(45deg);transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(-135deg)}
details.fold>div{padding:0 16px 10px}
.opt-note{font-weight:400;color:var(--tx3);font-size:12px;margin-left:8px}

.att-box{background:var(--card);padding:14px 16px;margin-bottom:8px;border:1px solid var(--bd)}
.att-box h2{font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.att-line{display:flex;gap:8px;padding:7px 0;font-size:12.5px;align-items:flex-start;cursor:pointer}
.att-line + .att-line{border-top:1px solid var(--bd)}
.att-line .al-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;min-width:72px;padding-top:2px}
.att-line .al-txt{flex:1;min-width:0;word-break:break-word;color:var(--tx)}
.att-line .al-date{font-size:10px;color:var(--tx3);flex-shrink:0;padding-top:2px}
.att-more{font-size:11.5px;color:var(--tx3);padding-top:8px;margin-top:6px;border-top:1px solid var(--bd);text-align:center;cursor:pointer;font-weight:500}
.att-col{flex:1 1 0;min-height:0;max-height:calc((100% - 12px)/3);display:flex;flex-direction:column;overflow:hidden}
.att-scroll{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.att-subtabs{display:flex;gap:6px;flex-shrink:0;margin-bottom:6px}
.att-subtab{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:8px 4px;text-align:center;cursor:pointer;font-family:inherit}
.att-subtab .num{font-size:18px;font-weight:700;line-height:1;color:var(--tx2)}

#planning-contenuto{flex:1 1 0;min-height:0;overflow-y:auto;cursor:pointer}

.planning-item .pi-ora{font-size:10.5px;font-weight:700;color:var(--tx2);flex-shrink:0;min-width:34px}

.planning-item .pi-tipo{font-size:8px;font-weight:700;padding:1px 5px;border-radius:var(--rp);background:var(--blu);color:#fff}
.planning-item.attivita{border-left-color:var(--nt)}
.planning-item.attivita .pi-tipo{background:var(--nt)}
.planning-item.libera{border-left-color:var(--acc)}

.planning-empty{text-align:center;padding:14px 8px;color:var(--tx3);font-size:12.5px}
#view-attivita.active{display:flex;flex-direction:column;gap:6px;height:100%;min-height:0;overflow:hidden}
#view-agenda.active,#view-planning.active{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#agenda-page-content,#planning-page-content{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ag-view{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ag-header{display:flex;align-items:center;gap:6px;padding:4px 12px;flex-shrink:0}

.ag-header .ag-back-btn svg{width:18px;height:18px}
.ag-header .ag-month-lbl{font-size:20px;font-weight:800;color:var(--acc);padding:0 10px;min-width:80px;text-align:center}
.ag-header .ag-spacer{width:38px}
.ag-weekstrip{display:flex;padding:2px 8px 6px;flex-shrink:0;margin:0 6px}
.ag-ws-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 2px;cursor:pointer;border-radius:10px}
.ag-ws-name{font-size:10px;font-weight:700;color:var(--tx3)}
.ag-ws-num{font-size:16px;font-weight:500;color:var(--tx);width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%}

.ag-ws-day.today .ag-ws-name{color:var(--acc)}
.ag-ws-day.sel .ag-ws-num{background:var(--blu);color:#fff;font-weight:700}
.ag-ws-day.sel .ag-ws-name{color:var(--blu)}
.ag-ws-day.festivo .ag-ws-name,.ag-ws-day.festivo .ag-ws-num{color:var(--fest)}
.ag-ws-day.festivo.today .ag-ws-num,.ag-ws-day.festivo.sel .ag-ws-num{color:#fff}
.ag-sep{height:1px;background:var(--bd2);margin:0 14px;flex-shrink:0}
.ag-content{flex:1 1 0;min-height:0;overflow-y:auto;position:relative;padding-bottom:80px}
.ag-bottombar{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 18px);z-index:45;pointer-events:none;display:flex;justify-content:flex-start;padding-left:18px}
.ag-pill{pointer-events:auto;padding:10px 20px;border-radius:999px;background:var(--card);border:1px solid var(--bd2);font-family:inherit;font-size:13.5px;font-weight:700;color:var(--blu);cursor:pointer;box-shadow:0 8px 22px rgba(20,23,28,.12)}
.ag-timeline{display:flex;position:relative;padding-bottom:30px;background-image:repeating-linear-gradient(to bottom,var(--bd2) 0px,var(--bd2) 1px,transparent 1px,transparent var(--ora-h));background-repeat:repeat-y;background-size:100% var(--ora-h);user-select:none;-webkit-user-select:none;touch-action:pan-y}
.ag-hours-col{width:48px;flex-shrink:0;background:var(--bg);z-index:2}

.ag-hour-line{height:var(--ora-h)}
.ag-event{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 5px;overflow:hidden;cursor:pointer;z-index:3;background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--blu);box-shadow:0 1px 3px rgba(20,23,28,.06)}
.ag-event-title{font-size:9.5px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ag-now-line{position:absolute;left:0;right:0;height:2px;background:var(--acc);z-index:6}

.ag-longpress-preview{position:fixed;z-index:8500;background:rgba(224,96,31,.95);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;pointer-events:none;box-shadow:0 4px 16px rgba(224,96,31,.35);transform:translate(-50%,-130%);white-space:nowrap}
.ag-lp-slot{position:absolute;left:2px;right:2px;background:rgba(224,96,31,.18);border-left:3px solid var(--acc);border-radius:6px;z-index:5;pointer-events:none}
.ag-year-month{margin-bottom:18px}
.ag-year-name{font-size:15px;font-weight:800;color:var(--blu);margin-bottom:4px;padding-left:4px}
.ag-year-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.ag-year-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border-radius:50%}
.ag-year-cell.other{opacity:.22}
.ag-year-cell.today .ag-year-num{background:var(--acc);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.ag-year-cell.selected .ag-year-num{box-shadow:0 0 0 2px var(--blu)}
.ag-year-cell.festivo .ag-year-num{color:var(--fest)}
.ag-year-cell.festivo.today .ag-year-num{color:#fff}
.ag-year-dot{width:4px;height:4px;border-radius:50%}
.ag-mm-month{margin-bottom:22px}
.ag-mm-name{font-size:20px;font-weight:800;color:var(--blu);padding:8px 8px 6px}
.ag-mm-weekdays{display:grid;grid-template-columns:repeat(7,1fr);font-size:10px;font-weight:700;color:var(--tx3);text-align:center;padding:2px 0 5px;border-bottom:1px solid var(--bd)}
.ag-mm-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.ag-mm-cell{height:70px;padding:3px 2px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:2px;cursor:pointer;overflow:hidden}
.ag-mm-num{font-size:12.5px;font-weight:500;color:var(--tx);width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.ag-mm-cell.today .ag-mm-num{background:var(--acc);color:#fff;font-weight:700}
.ag-mm-cell.selected .ag-mm-num{box-shadow:0 0 0 2px var(--blu)}
.ag-mm-cell.festivo .ag-mm-num{color:var(--fest)}
.ag-mm-cell.festivo.today .ag-mm-num{color:#fff}
.ag-mm-events{display:flex;flex-direction:column;gap:2px;overflow:hidden;max-height:40px}
.ag-mm-ev{display:flex;gap:3px;padding:1px 3px;border-radius:3px;overflow:hidden}
.ag-mm-ev-title{font-size:8.5px;font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#map-container{position:relative;width:100%;height:calc(100dvh - var(--tab-h) - env(safe-area-inset-bottom));overflow:hidden;background:#e5e7eb}
#map{width:100%;height:100%}
.map-overlay-top{position:absolute;top:12px;left:12px;right:12px;z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.map-overlay-top > *{pointer-events:auto}
.map-status{background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-radius:var(--rs);border:1px solid var(--bd);padding:8px 12px;font-size:12px;color:var(--tx2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.map-status .count{font-weight:700;color:var(--blu)}
.map-status button{background:var(--blu);border:none;border-radius:var(--rp);padding:6px 12px;font-family:inherit;font-size:11px;font-weight:500;color:#fff;cursor:pointer}
.map-overlay-bottom{position:absolute;bottom:80px;right:12px;z-index:500;display:flex;flex-direction:column;gap:8px}
.map-btn{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--bd2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--blu)}
.map-btn svg{width:17px;height:17px}
.pin-wrap{position:relative;width:32px;height:40px}
.pin-body{position:absolute;bottom:0;left:50%;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:translateX(-50%) rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
.pin-body .pin-label{transform:rotate(45deg);font-size:10px;font-weight:700;color:#fff}
.pin-dot{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700}
.aranjo-popup{padding:10px 12px}
.aranjo-popup .pop-titolo{font-size:13px;font-weight:700;color:var(--blu);margin-bottom:3px}
.aranjo-popup .pop-sub{font-size:11.5px;color:var(--tx2);margin-bottom:6px}
.aranjo-popup .pop-badge{display:inline-block;padding:2px 7px;border-radius:var(--rp);font-size:9px;font-weight:700;color:#fff;text-transform:uppercase}
.aranjo-popup .pop-btn{background:var(--acc);color:#fff;border:none;border-radius:var(--rs);padding:8px 11px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;width:100%;margin-top:4px}
.aranjo-popup .pop-btn.btn-nav{background:var(--blu)}
:root[data-theme="dark"] #map:not(.map-satellite) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.88) contrast(.92) saturate(.7)}
:root[data-theme="dark"] #map.map-satellite .leaflet-tile-pane{filter:none}

.filter-dropdown-overlay{position:fixed;inset:0;background:rgba(20,20,30,.55);z-index:9001;display:none;align-items:center;justify-content:center;padding:20px}
.filter-dropdown-overlay.open{display:flex}
.filter-dropdown{background:var(--card);border-radius:20px;padding:10px;max-width:360px;width:100%;max-height:78dvh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.18)}
.filter-dropdown h3{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px 6px}
.filter-dropdown .opt,.ms-opt{padding:12px 14px;border-radius:12px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;touch-action:manipulation}
.filter-dropdown .opt.selected,.ms-opt.on{background:var(--blu-soft);color:var(--blu);font-weight:600}
.filter-dropdown .opt:active,.ms-opt:active{background:var(--bg2)}
.filter-dropdown .btn-row{position:sticky;bottom:-10px;background:var(--card);padding:10px 0 2px;margin-top:0}
.ms-btn{width:100%;background:var(--bg2);border:none;padding:11px 12px;border-radius:10px;font-family:inherit;font-size:16px;font-weight:500;color:var(--tx);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;min-height:42px}
.ms-btn svg{color:var(--tx3);flex-shrink:0}
.ms-btn > span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-btn > span.ph{color:var(--tx3);font-weight:400}
.mq-row{display:flex;gap:8px}
.mq-row > div{flex:1;min-width:0}
.mq-row input{width:100%;background:var(--bg2);padding:11px 12px;border:none;border-radius:10px;font-family:inherit;font-size:16px;font-weight:500;color:var(--tx);outline:none}

.match-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;border-bottom:1px solid var(--bd);cursor:pointer;gap:8px}
.match-line .ml-name{flex:1;min-width:0;font-weight:500;white-space:normal!important}
.match-line .ml-name small{display:block;font-size:11px;color:var(--tx3);margin-top:2px;font-weight:400}
.match-line .ml-score.high{color:var(--ok);font-weight:700}
.match-line .ml-score.mid{color:var(--warn);font-weight:700}
.match-line .ml-score.low{color:var(--tx3);font-weight:700}

.app-item-card{background:var(--card);border-radius:var(--r);padding:11px 13px;margin-bottom:6px;border:1px solid var(--bd);border-left:3px solid var(--blu);cursor:pointer}
.app-item-card .app-titolo{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:4px;line-height:1.3}
.app-item-card .app-data{font-size:11.5px;color:var(--tx2);display:flex;align-items:center;gap:4px}
.app-item-card .app-data svg{width:11px;height:11px}
.app-item-card .app-esito{font-size:10.5px;margin-top:6px;padding:2px 8px;border-radius:var(--rp);display:inline-flex;align-items:center;gap:3px;font-weight:500}
.app-item-card .app-esito.ok{background:#f0fdf4;color:var(--ok)}
.app-item-card .app-esito.ko{background:#fef2f2;color:var(--vnd)}
.app-item-card .app-esito.neutral{background:var(--bg2);color:var(--tx2)}
.tipo-app-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.tipo-app-btn{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:11px;cursor:pointer;text-align:left;font-family:inherit;border-left:4px solid var(--tx3)}
.tipo-app-btn .sigla{font-size:12.5px;font-weight:700;color:var(--tx);margin-bottom:2px;display:flex;align-items:center;gap:5px}
.tipo-app-btn .sigla svg{width:14px;height:14px}
.tipo-app-btn .desc{font-size:10px;color:var(--tx3);line-height:1.35}

.doc-summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:12.5px;cursor:pointer;gap:8px}
.doc-summary-row .ds-left{display:flex;align-items:center;gap:7px;color:var(--tx2)}
.doc-summary-row .ds-left svg{width:14px;height:14px}
.doc-summary-row .ds-right.ok{color:var(--ok);font-weight:700}
.doc-summary-row .ds-right.warn{color:var(--warn);font-weight:700}

@media (min-width:768px){
  body{background:#ececec}
  .app{max-width:var(--maxw);margin:0 auto;background:var(--bg);border-left:1px solid var(--bd);border-right:1px solid var(--bd)}
  .tabbar{max-width:var(--maxw);left:50%;transform:translateX(-50%)}
  .fab{right:calc(50% - (var(--maxw)/2) + 18px)}
  .fab-menu{right:calc(50% - (var(--maxw)/2) + 18px)}
  .modal-overlay{align-items:center;padding:20px}
  .modal-sheet{border-radius:24px;max-height:88dvh}
  .form-input,.form-select,.form-textarea{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

}

</style>

<style>

.im-rr-linked{display:block;width:100%;padding:11px 3px;border-bottom:1px solid var(--bd)}

<style>

<style>
/* ARANJÒ 2.15.0 — cronologia delle proposte */
.proposal-history{border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:9px 0;background:var(--card)}
.proposal-head{padding:10px 12px;background:var(--bg2);font-size:12px;font-weight:700;color:var(--tx);overflow-wrap:anywhere}
.proposal-history-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:5px;padding:10px 12px;width:100%;font-family:inherit;text-align:left;border:0;border-top:1px solid var(--bd);background:transparent;color:var(--tx);font-size:12px;cursor:pointer}
.proposal-history-row>small{flex-basis:100%;font-size:11px;color:var(--tx2);white-space:normal;overflow-wrap:anywhere}
</style><style>
.practice-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 8px;font-size:13px}.practice-head .btn,.practice-section-head .btn{width:auto;min-height:33px;padding:7px 12px;font-size:11px;margin:0}
.practice-card{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:13px;margin-bottom:8px;padding:12px;text-align:left;color:var(--tx);font-family:inherit;display:block;box-sizing:border-box}
.practice-card strong{display:block;font-size:13px;margin:7px 0 5px;overflow-wrap:anywhere}.practice-card small{display:block;font-size:11px;color:var(--tx2)}.practice-meta{display:flex;align-items:center;gap:9px;font-size:10px;color:var(--tx3)}
.practice-detail-top{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:12px}.practice-link{display:flex;flex-direction:column;align-items:flex-start;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px;text-align:left;min-width:0;overflow-wrap:anywhere}.practice-link strong{font-size:13px}.practice-link span{color:var(--tx2);font-size:11px;margin-top:3px}
.practice-section{border:1px solid var(--bd);border-radius:12px;padding:11px;margin-bottom:10px;min-width:0}.practice-section-head{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-bottom:9px;font-size:13px}
.practice-activity,.practice-document{display:flex;flex-direction:column;width:100%;min-width:0;box-sizing:border-box;background:transparent;border:0;border-top:1px solid var(--bd);padding:10px 2px;text-align:left;color:var(--tx);font-family:inherit}.practice-activity span{font-size:11px;color:var(--tx3)}.practice-activity strong{font-size:12px;margin-top:5px;font-weight:600;overflow-wrap:anywhere}.practice-document{flex-direction:row;justify-content:space-between;align-items:center}.practice-document small{display:block;color:var(--tx2);font-size:10px;margin-top:3px}
.ar-suggestion-box{position:fixed;z-index:100000;max-height:210px;overflow-y:auto;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;box-shadow:0 6px 22px #0004;padding:5px;box-sizing:border-box}
.ar-suggestion{display:flex;align-items:center;gap:9px;width:100%;border:0;border-radius:7px;background:transparent;color:inherit;text-align:left;padding:10px;font-family:inherit;font-size:12px}.ar-suggestion:focus,.ar-suggestion:hover{background:var(--bg2)}.ar-suggestion small{color:var(--tx3);margin-left:auto;flex:none}
</style><style>
/* 2.15.0 — Pratiche, RR e suggerimenti contestuali */
.practice-count{color:var(--tx3);font-weight:600;font-size:12px}
.practice-archive{margin:14px 0;padding:10px 12px;border:1px solid var(--bd);border-radius:12px}
.practice-archive summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--tx2);padding:4px}
.practice-archive .practice-card{margin-top:9px}
.practice-life{display:flex;flex-direction:column;gap:5px;padding:11px;background:var(--bg2);border-radius:12px;margin:0 0 12px;font-size:12px}
.practice-life small{color:var(--tx2)}
.practice-life-action{display:flex;justify-content:flex-end;margin-top:4px}
.practice-life-action .btn{width:auto!important;min-width:0!important;padding:9px 12px;margin:0;font-size:11px}
.rr-state-card{padding:12px!important;margin-bottom:12px!important}
.rr-state-display{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.rr-state-display strong{display:block;font-size:13px;margin-top:4px;overflow-wrap:anywhere}
.rr-state-display .btn{width:auto!important;min-width:0!important;flex-shrink:0;padding:8px 12px;margin:0}
#rr-standby-row[hidden]{display:none!important}
.ar-suggestion-box{min-width:180px!important;z-index:12000!important;overscroll-behavior:contain}

.ar-suggestion small{overflow-wrap:anywhere;text-align:right}
</style></head>
<body>

<div class="app">
  <header class="app-header">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
      <div>
        <h1><span>ARAN</span>JÒ</h1>
        <div class="brand-sub">Assistente Tecnorete</div>
      </div>
      <div id="header-prossimo-app" onclick="apriProssimoAppuntamento()">
        <div class="lbl">Prossimo</div>
        <div id="header-prossimo-app-txt"></div>
      </div>
    </div>
  </header>

  <main class="app-content" id="app-content">
    <section id="view-immobili" class="view active">
      <div class="search-sticky"><input type="search" class="search-bar" id="search-immobili" placeholder="Cerca immobili..."></div>
      <div class="chips filter-toolbar" id="chips-immobili">
        <button type="button" class="chip active" data-filtro="tutti" title="Azzera filtri">Tutti</button>
        <button type="button" class="chip filter-trigger" id="btn-filtri-immobili" onclick="apriFiltriImmobili()" aria-label="Apri filtri immobili" title="Filtri"><span id="filtri-immobili-icon"></span><span class="filter-count" id="filtri-immobili-count" hidden></span></button>
      </div>
      <div id="filtro-attivo"></div>
      <div id="lista-immobili"></div>
    </section>

    <section id="view-persone" class="view">
      <div class="search-sticky"><input type="search" class="search-bar" id="search-persone" placeholder="Cerca persone..." aria-label="Cerca persone"></div>
      <div class="chips filter-toolbar" id="chips-persone">
        <button type="button" class="chip" id="persone-tutti" onclick="azzeraTuttiFiltriPersone()" title="Azzera filtri">Tutti</button>
        <button class="chip filter-trigger" id="persone-ruolo-btn" type="button" onclick="apriFiltroRuoloPersone()" aria-label="Filtra persone" title="Filtri"><span id="persone-ruolo-icon"></span><span id="persone-ruolo-count" class="filter-count" hidden></span></button>
      </div>
      <div id="filtro-persone-attivo" aria-live="polite"></div>
      <div id="lista-persone"></div>
    </section>

    <section id="view-attivita" class="view">
      <div class="att-col">
        <div class="att-subtabs" id="att-subtabs">
          <div class="att-subtab scadute" data-att="scadute" onclick="setAttTab('scadute')"><div class="num" id="att-num-scadute">0</div><div class="lbl">Scadute</div></div>
          <div class="att-subtab oggi active" data-att="oggi" onclick="setAttTab('oggi')"><div class="num" id="att-num-oggi">0</div><div class="lbl">Oggi</div></div>
          <div class="att-subtab prossime" data-att="prossime" onclick="setAttTab('prossime')"><div class="num" id="att-num-prossime">0</div><div class="lbl">Prossime</div></div>
        </div>
        <div id="lista-attivita" class="att-scroll"></div>
      </div>
      <div class="att-col">
        <div class="agenda-sett">
          <h3 onclick="apriAgendaPage()"><span style="cursor:pointer;">Agenda ›</span>
            <div class="nav-sett" onclick="event.stopPropagation()">
              <button onclick="cambiaSettimana(-1)">‹</button>
              <button onclick="cambiaSettimana(0)">•</button>
              <button onclick="cambiaSettimana(1)">›</button>
            </div>
          </h3>
          <div class="agenda-grid" id="agenda-grid"></div>
        </div>
      </div>
      <div class="att-col">
        <div class="planning-sett">
          <h3 onclick="apriPlanningPage()"><span id="planning-titolo">Oggi</span>
            <div class="nav-sett" onclick="event.stopPropagation()">
              <button onclick="cambiaGiornoPlanning(-1)">‹</button>
              <button onclick="cambiaGiornoPlanning(0)">•</button>
              <button onclick="cambiaGiornoPlanning(1)">›</button>
            </div>
          </h3>
          <div id="planning-contenuto"></div>
        </div>
      </div>
    </section>

    <section id="view-agenda" class="view"><div id="agenda-page-content"></div></section>
    <section id="view-planning" class="view"><div id="planning-page-content"></div></section>

    <section id="view-chiamate" class="view">
      <div class="search-sticky" style="display:flex;gap:6px;align-items:center;">
        <button class="btn btn-secondary btn-icon" onclick="tornaAttivita()" id="btn-back-chiamate"></button>
        <div style="flex:1;font-size:14px;font-weight:700;color:var(--blu);">Chiamate oggi</div>
        <button class="btn btn-primary btn-icon" onclick="apriNuovaChiamata(null)" id="btn-new-chiamata"></button>
      </div>
      <div id="chiamate-lista"></div>
    </section>

    <section id="view-mappa" class="view" style="padding:0;margin:0;">
      <div id="map-container">
        <div id="map"></div>
        <div class="map-overlay-top">
          <div class="map-status">
            <div><span class="count" id="map-count">0</span> <span style="color:var(--tx3);">/ <span id="map-tot">0</span></span></div>
            <button onclick="geocodificaTutti()" id="btn-geocode-all">Geocodifica</button>
          </div>
        </div>
        <div class="map-overlay-bottom">
          <button class="map-btn" onclick="centraMappaSuCittaPrincipale()" id="map-btn-casa"></button>
          <button class="map-btn" onclick="fitBoundsImmobili()" id="map-btn-target"></button>
          <div class="chips filter-toolbar map-filter-toolbar" id="map-chips" style="background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-radius:var(--rs);border:1px solid var(--bd);padding:6px 8px;margin-bottom:0;">
            <button type="button" class="chip filter-trigger" id="map-filter-trigger" onclick="apriFiltriMappa()" aria-label="Filtra immobili sulla mappa" title="Filtri mappa"><span id="map-filter-icon"></span><span class="filter-count" id="map-filter-count" hidden></span></button>
          </div>

        </div>
      </div>
    </section>

    <section id="view-ricerca" class="view">
      <div class="search-sticky"><input type="search" class="search-bar" id="gs-i" placeholder="Cerca persone, immobili, attività, condomìni..." oninput="eseguiRicerca(this.value)" autocomplete="off"></div>
      <div id="pratiche-dashboard"></div>
      <div id="gs-r"><div class="empty">Cerca in tutto ARANJÒ</div></div>
    </section>

    <section id="view-zone" class="view"><h2 style="margin-bottom:12px">Zone di competenza</h2><div id="zone-lista"></div></section>
    <section id="view-rubrica" class="view"><div class="search-sticky"><input type="search" class="search-bar" id="rubrica-q" placeholder="Cerca nella rubrica..." oninput="renderRubrica()"></div><div id="rubrica-lista"></div></section>
    <section id="view-magazzino" class="view">
      <div class="search-sticky" style="display:flex;gap:6px;">
        <input type="search" class="search-bar" id="search-magazzino" placeholder="Cerca articolo..." style="flex:1;">
        <button class="btn btn-primary btn-icon" onclick="apriNuovoArticolo()" id="btn-add-articolo"></button>
      </div>
      <button class="btn btn-secondary" onclick="scanBarcode()" id="btn-scan-barcode" style="margin-bottom:10px;"></button>
      <div id="magazzino-lista"></div>
    </section>

    <section id="view-rapportini" class="view">

      <div id="rapportini-lista"></div>
    </section>

    <section id="view-altro" class="view">
      <div class="card">
        <h2>Strumenti</h2>
        <div style="display:flex;gap:6px;">
          
          <button class="btn btn-secondary" style="flex:1;" onclick="mostraView('view-rapportini')"><span id="ico-rapp"></span></button>
          <button class="btn btn-secondary" style="flex:1;" onclick="apriRubrica()"><span id="ico-chiam"></span></button>
        </div>
      </div>

      <button type="button" class="btn btn-secondary" style="width:100%;margin-bottom:12px" onclick="mostraView('view-zone');renderZoneCompetenza()">Zone di competenza</button>
      <div class="card">
        <h2>Aspetto</h2>
        <div style="display:flex;gap:6px;">
          <button type="button" id="th-light" class="chip" onclick="setTema('light')" style="flex:1;justify-content:center;padding:10px;"></button>
          <button type="button" id="th-auto" class="chip active" onclick="setTema('auto')" style="flex:1;justify-content:center;padding:10px;"></button>
          <button type="button" id="th-dark" class="chip" onclick="setTema('dark')" style="flex:1;justify-content:center;padding:10px;"></button>
        </div>
      </div>
      <div class="card">
        <h2>Azioni</h2>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-secondary" style="flex:1;" onclick="richiediPermessoNotifiche(true)" id="btn-notif"></button>
          <button class="btn btn-secondary" style="flex:1;" onclick="apriImpostazioniCitta()" id="btn-citta"></button>
        </div>
        <div class="backup-actions">
          <button type="button" class="btn btn-secondary btn-icon backup-icon-btn" onclick="document.getElementById('file-import').click()" id="btn-import" aria-label="Importa backup" title="Importa backup"></button>
          <button type="button" class="btn btn-secondary btn-icon backup-icon-btn" onclick="esportaBackup()" id="btn-export" aria-label="Esporta backup" title="Esporta backup"></button>
        </div>
        <input type="file" id="file-import" accept=".json" style="display:none" onchange="importaBackup(event)">
      </div>
      <div class="card">
        <h2>Sistema</h2>
        <div class="info-row"><span class="label">Versione sito</span><span class="value" id="sistema-versione">2.15.0</span></div>
        <div class="info-row"><span class="label">Dati</span><span class="value" id="storage-info">0 B</span></div>
        <div class="info-row"><span class="label">Città</span><span class="value" id="sistema-citta"></span></div>
        <div class="info-row"><span class="label">Persistenza</span><span class="value" id="sistema-persist" style="color:var(--vnd);">No</span></div>
        <button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="eseguiDiagnosticaAranjo()">Controlla funzionamento</button>
        <div id="sistema-diagnostica" style="display:none;margin-top:8px;font-size:12px;"></div>
      </div>
      <button class="btn btn-danger" onclick="cancellaTutto()" id="btn-reset"></button>
    </section>
  </main>

  <button class="fab" id="fab" onclick="onFabClick()" aria-label="Nuovo" title="Nuovo"></button>
  <div id="fab-menu" class="fab-menu"></div>

  <nav class="tabbar" id="tabbar">

    });
    db.persone.forEach(per => {

        A.forEach(k => { if(per.richiesta[k] && !Array.isArray(per.richiesta[k])) per.richiesta[k]=[per.richiesta[k]]; if(!per.richiesta[k]) per.richiesta[k]=[]; });

      if(!db.condomini[k].datiStrutturali) db.condomini[k].datiStrutturali = {};
    });
    return db;
  },
  _queue:Promise.resolve(),
  _erroreMostrato:false,
  _mostraErroreSalvataggio(e){
    console.error('ARANJÒ: salvataggio non riuscito', e);
    if(this._erroreMostrato) return;
    this._erroreMostrato = true;
    try{
      let el = document.getElementById('aranjo-save-error');
      if(!el){
        el = document.createElement('div'); el.id='aranjo-save-error'; el.className='aranjo-error-toast';
        el.setAttribute('role','alert');
        el.innerHTML = '<span>ATTENZIONE: dati non salvati. Esporta un backup e verifica lo spazio disponibile.</span><button type="button" aria-label="Chiudi">×</button>';
        el.querySelector('button').addEventListener('click',()=>{el.remove(); this._erroreMostrato=false;});
        document.body.appendChild(el);
      }
    }catch(err){ try{ alert('ARANJÒ: errore di salvataggio. I dati potrebbero non essere stati salvati.'); }catch(_){} }
  },
  save(d){
    let snapshot;
    try{ snapshot = JSON.parse(JSON.stringify(d)); }
    catch(e){ this._mostraErroreSalvataggio(e); return Promise.resolve(false); }
    const write = this._queue.catch(()=>false).then(()=>Storage2.set('db_v4',snapshot));
    this._queue = write.then(()=>true).catch(e=>{ this._mostraErroreSalvataggio(e); return false; });
    return this._queue;
  },
  loadAsync(){
    return Storage2.get('db_v4').then(d => {
      if(!d){
        let raw = null;
        try{ raw = localStorage.getItem(DB_KEY); }catch(e){}
        if(raw){ try{ d = JSON.parse(raw); return Storage2.set('db_v4',d).then(() => this.migra(d)); }catch(e){} }
      }
      return d ? this.migra(d) : this.default();
    });
  }
};

const photoCache = {};
function getPhotoURL(id){
  if(photoCache[id]) return Promise.resolve(photoCache[id]);
  return PhotoDB.get(id).then(r => { if(!r||!r.blob) return null; const u = URL.createObjectURL(r.blob); photoCache[id]=u; return u; }).catch(() => null);

function processImg(f){
  return new Promise((res,rej) => {
    const rd = new FileReader();
    rd.onload = e => {
      const im = new Image();
      im.onload = () => {
        const MAX = 2000; let w = im.naturalWidth, h = im.naturalHeight;
        if(w>MAX||h>MAX){ if(w>=h){ h = Math.round(h*MAX/w); w = MAX; } else { w = Math.round(w*MAX/h); h = MAX; } }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        c.toBlob(b => b ? res(b) : rej(new Error('Errore')), 'image/jpeg', .85);
      };
      im.onerror = () => rej(new Error('Immagine non valida'));
      im.src = e.target.result;
    };
    rd.onerror = () => rej(new Error('Errore'));
    rd.readAsDataURL(f);
  });
}

function salvaSchedaPrecedente(){

  if(document.getElementById('pk-s')) return;

  window._schedePrecedenti.push({

function apriModal(titolo, html){

}
function chiudiTutteModal(fromBack){
  window._schedePrecedenti=[];

  mo.classList.remove('open');

    window._modalStack--;

function chiudiModal(fromBack){
  if(window._pickerSavedParent && document.getElementById('pk-s')){

(function(){
  const dd = document.getElementById('filter-dd');
  if(!dd) return;
  dd.addEventListener('click', e => {
    const opt = e.target.closest('.opt');
    if(opt && opt.dataset.value !== undefined){
      e.stopPropagation();
      const v = opt.dataset.value, cb = window._filterDDBack;
      chiudiFilterDD();
      if(cb){ try{ cb(v === '' ? null : v); }catch(err){ console.error(err); } }
      return;
    }
    const msOpt = e.target.closest('.ms-opt');
    if(msOpt){
      e.stopPropagation();
      const mid = msOpt.dataset.mid, mval = msOpt.dataset.mval;
      const s = window._msSel[mid]; if(!s) return;
      const i = s.val.indexOf(mval);
      if(i >= 0) s.val.splice(i,1); else s.val.push(mval);
      const isOn = s.val.indexOf(mval) >= 0;
      msOpt.classList.toggle('on', isOn);
      const svg = msOpt.querySelector('svg');
      if(isOn && !svg) msOpt.insertAdjacentHTML('beforeend', ico('check',12));
      else if(!isOn && svg) svg.remove();
      return;
    }
    if(e.target.closest('.ms-reset-btn')){
      e.stopPropagation();
      const rid = e.target.closest('.ms-reset-btn').dataset.mid;
      if(window._msSel[rid]){ window._msSel[rid].val = []; apriMs(rid); }
      return;
    }
    if(e.target.closest('.ms-ok-btn')){
      e.stopPropagation();
      chiudiMs(e.target.closest('.ms-ok-btn').dataset.mid);
    }
  }, false);
})();

function rrDataStato(p){
 if(!p) return 'attiva';
 // Compatibilità con le anagrafiche delle versioni precedenti.

 if(['rogitato','ha-comprato'].includes(old))return 'ha-acquistato';

 if(old==='standby' && p.standbyFino && p.standbyFino < new Date().toISOString().slice(0,10))return 'attiva';

 if(!pr||pr.stato==='chiusa')return false;
 const events=(DB.appuntamenti||[]).filter(a=>String(a.immobileId)===String(pr.immobileId)&&String(a.acquirenteId||a.personaId)===String(pr.acquirenteId) && a.stato==='eseguito').sort((a,b)=>String(a.updatedAt||a.dataInizio).localeCompare(String(b.updatedAt||b.dataInizio)));
 const ritiri=events.filter(a=>a.tipo==='RIT PROP'&&a.esito==='rit-ok');
 if(!ritiri.length)return false;
 const ultimo=ritiri[ritiri.length-1];
 const i=events.indexOf(ultimo);
 const seguenti=events.slice(i+1).filter(a=>!a.propostaId||String(a.propostaId)===String(ultimo.id));
 if(seguenti.some(a=>a.tipo==='ATTO'&&a.esito==='atto-ok'))return false;

 return true;

// Restituisce coordinate decimal-degree incollate da Google Maps o da un link non abbreviato.
// L'ordine è sempre LATITUDINE, LONGITUDINE (come la coppia mostrata da Google Maps).
function coordinateDaTesto(raw){
  let testo = String(raw || '').trim();
  if(!testo) return null;
  const ok = (a,b) => {
    const lat = Number(a), lng = Number(b);
    return Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? {lat,lng} : null;
  };
  // URL Google Maps: preferisci il pin (!3dLAT!4dLNG) al centro della vista (@LAT,LNG).
  const mPin = testo.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/i);
  if(mPin) return ok(mPin[1],mPin[2]);
  try{
    if(/^https?:\/\//i.test(testo)){
      const u = new URL(testo);
      for(const k of ['query','q','ll','center']){
        const v = u.searchParams.get(k);
        if(v){ const m = v.match(/^\s*\(?\s*(-?\d+(?:\.\d+)?)\s*[,;]\s*(-?\d+(?:\.\d+)?)\s*\)?\s*$/); if(m) return ok(m[1],m[2]); }
      }
      const vista = testo.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
      if(vista) return ok(vista[1],vista[2]);
      return null;
    }
  }catch(e){ return null; }
  const m = testo.match(/^\s*\(?\s*(-?\d+(?:\.\d+)?)\s*[,;]\s*(-?\d+(?:\.\d+)?)\s*\)?\s*$/);
  return m ? ok(m[1], m[2]) : null;
}
