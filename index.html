function planPerData(y){
  const apps = (DB.appuntamenti||[]).filter(a => ymd(new Date(a.dataInizio)) === y && a.stato !== 'annullato').sort((a,b) => a.dataInizio.localeCompare(b.dataInizio));
  const att = raccogliAtt().filter(a => a.tipo === 'da_fare' && !a.completata && ymd(new Date(a.dataPrevista)) === y).sort(cmpAtt);
  const lib = (DB.pianificazioni||[]).filter(p => p.data === y);
  return { apps, att, lib };
}
function renderPlanning(){
  const c = document.getElementById('planning-contenuto'); if(!c) return;
  const y = currentPlanYmd(); const d = daYmd(y);
  const oggi = ymd(new Date()) === y;
  const tl = document.getElementById('planning-titolo');
  if(tl) tl.textContent = (oggi ? 'Oggi · ' : '') + GIORNI_B[(d.getDay()+6)%7] + ' ' + d.getDate();
  const p = planPerData(y);
  const tot = p.apps.length + p.att.length + p.lib.length;
  let h = '';
  if(!tot) h = '<div class="planning-empty">Nessun evento</div>';
  else {
    p.apps.forEach(a => { const o = pad2(new Date(a.dataInizio).getHours())+':'+pad2(new Date(a.dataInizio).getMinutes()); const t = getTipoApp(a.tipo); h += `<div class="planning-item" style="border-left-color:${coloreTipo(t)};" onclick="event.stopPropagation();apriSchedaApp('${a.id}')"><span class="pi-ora">${o}</span><div class="pi-testo">${esc(a.titolo.slice(0,40))}</div></div>`; });
    p.att.forEach(a => { const o = a.dataPrevista ? (pad2(new Date(a.dataPrevista).getHours())+':'+pad2(new Date(a.dataPrevista).getMinutes())) : '--'; h += `<div class="planning-item attivita" onclick="event.stopPropagation();apriAzioniAttGlob('${a.id}','${a.entTipo}','${a.entId}')"><span class="pi-ora">${o}</span><div class="pi-testo">${esc(a.testo.slice(0,40))}</div><span class="pi-tipo">ATT</span></div>`; });
    p.lib.forEach(p2 => { h += `<div class="planning-item libera${p2.completata?' fatta':''}" onclick="event.stopPropagation();apriAzioniPian('${p2.id}')"><span class="pi-ora">${p2.ora||'--'}</span><div class="pi-testo">${esc(p2.testo.slice(0,40))}</div></div>`; });
  }
  c.innerHTML = h;
}
function apriAzioniPian(id){
  const p = (DB.pianificazioni||[]).find(x => x.id === id); if(!p) return;
  let h = `<div class="card" style="padding:12px;"><div style="font-size:14px;">${esc(p.testo)}</div></div>`;
  if(!p.completata) h += `<button class="btn btn-primary" onclick="complPian('${p.id}')">${ico('check',15)} Fatta</button>`;
  else h += `<button class="btn btn-secondary" onclick="riapriPian('${p.id}')">${ico('aggiorna',15)} Riapri</button>`;
  h += `<button class="btn btn-danger" onclick="elimPian('${p.id}')">${ico('cestino',15)} Elimina</button>`;
  h += '<div class="btn-row"><button class="btn btn-secondary" onclick="chiudiModal()">Chiudi</button></div>';
  apriModal('Ufficio', h);
}
function complPian(id){ const p = (DB.pianificazioni||[]).find(x => x.id === id); if(!p) return; p.completata = true; p.updatedAt = new Date().toISOString(); Storage.save(DB); chiudiModal(); renderPlanning(); renderAgendaPage(); if(planPageYmd) setTimeout(renderPlanningPage, 100); }
function riapriPian(id){ const p = (DB.pianificazioni||[]).find(x => x.id === id); if(!p) return; p.completata = false; p.updatedAt = new Date().toISOString(); Storage.save(DB); chiudiModal(); renderPlanning(); renderAgendaPage(); if(planPageYmd) setTimeout(renderPlanningPage, 100); }
function elimPian(id){ if(!confirm('Eliminare?')) return; DB.pianificazioni = DB.pianificazioni.filter(x => x.id !== id); Storage.save(DB); chiudiModal(); renderPlanning(); renderAgendaPage(); if(planPageYmd) setTimeout(renderPlanningPage, 100); }
function apriPlanningPage(y){ planPageYmd = y || currentPlanYmd(); mostraView('view-planning'); renderPlanningPage(); }
function cambiaGiornoPlanningPage(d){ if(d === 0) planPageYmd = ymd(new Date()); else { const c = daYmd(planPageYmd); c.setDate(c.getDate()+d); planPageYmd = ymd(c); } renderPlanningPage(); }
function renderPlanningPage(){
  const c = document.getElementById('planning-page-content'); if(!c) return;
  const y = planPageYmd || ymd(new Date()); const d = daYmd(y);
  const p = planPerData(y); const tot = p.apps.length + p.att.length + p.lib.length;
  const header = `<div class="ag-header"><button class="ag-back-btn" onclick="tornaAttivita()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button><div class="ag-nav-group"><button class="ag-nav-btn" onclick="cambiaGiornoPlanningPage(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button><div class="ag-month-lbl">${MESI_L[d.getMonth()]}</div><button class="ag-nav-btn" onclick="cambiaGiornoPlanningPage(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button></div><div class="ag-spacer"></div></div>`;
  const strip = `<div style="text-align:center;padding:8px;"><div style="font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;">${GIORNI_L[d.getDay()]}</div><div style="font-size:26px;font-weight:800;color:var(--tx);line-height:1.2;">${d.getDate()}</div></div><div class="ag-sep"></div>`;
  let body = '';
  if(!tot) body = '<div class="planning-empty" style="padding:28px 14px;">Nessun evento</div>';
  else {
    body += '<div style="padding:10px 12px;">';
    p.apps.forEach(a => body += renderItemApp(a));
    if(p.att.length){
      if(p.apps.length) body += '<div style="font-size:10.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;margin:12px 0 6px;">Da fare</div>';
      p.att.forEach(a => { const o = a.dataPrevista ? (pad2(new Date(a.dataPrevista).getHours())+':'+pad2(new Date(a.dataPrevista).getMinutes())) : '--:--'; body += `<div class="att-item" style="background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);margin-bottom:5px;padding:10px 12px;border-left:3px solid var(--nt);" onclick="apriAzioniAttGlob('${a.id}','${a.entTipo}','${a.entId}')"><span class="att-dot oggi"></span><div class="att-body"><div class="att-data oggi">${o}</div><div class="att-testo">${esc(a.testo)}</div></div></div>`; });
    }
    if(p.lib.length){
      body += '<div style="font-size:10.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;margin:12px 0 6px;">Ufficio</div>';
      p.lib.forEach(p2 => { body += `<div class="att-item" style="background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);margin-bottom:5px;padding:10px 12px;border-left:3px solid var(--acc);${p2.completata?'opacity:.55;':''}" onclick="apriAzioniPian('${p2.id}')"><div class="att-body"><div class="att-data" style="color:${p2.completata?'var(--ink)':'var(--acc)'};">${p2.ora||'--:--'}</div><div class="att-testo">${esc(p2.testo)}</div></div></div>`; });
    }
    body += '</div>';
  }
  c.innerHTML = `<div class="ag-view">${header}${strip}<div class="ag-content">${body}</div></div>`;
}
</script>

<script>
'use strict';
/* ==========================================================================
   IMMOBILI + CONDOMINI + PREZZI + DOCUMENTI + MAPPA + VALUTAZIONE
   ========================================================================== */
function apriScheda(id){
  const im = DB.immobili.find(x => x.id === id); if(!im) return;
  immobileAperto = id;
  const props = propsImmobile(im);
  const ppr = props.find(x => x.principale) || props[0] || null;
  const nomeP = ppr ? nomeCogn(ppr.persona) : (im.cognomeNome || '');
  const telP = ppr && ppr.persona.telefono ? ppr.persona.telefono : im.telefono;
  const co = condoDi(im);
  const dc = (co && DB.condomini && DB.condomini[co]) || {};
  const geoNav=(!im.villa && coordValide(coordCondominio(co)))?coordCondominio(co):im;
  const hc = coordValide(geoNav);
  const prezzoMercato = im.prezzi && parseNum(im.prezzi.mercato);
  let h = '<div class="scheda-top">';
  h += '<div class="top-badges">';
  h += `<span class="badge badge-${im.stato}">${im.stato}</span>`;
  if(im.valutata) h += `<span class="badge badge-VAL">VAL</span>`;
  else if(im.stato === 'NT') h += `<span class="badge badge-daval">DA VAL.</span>`;
  if(!im.villa) h += `<span style="font-size:11px;color:var(--tx3);font-weight:600;">z${im.z||1}</span>`;
  // Per il singolo la tipologia e' gia' implicita nella struttura.
  if(im.inTrattativa) h += '<span class="badge" style="background:var(--pa);">TRATTATIVA</span>';
  if(im.gestitoDa === 'collega') h += `<span class="badge badge-collega">${ico('briefcase',9)} ${esc(im.collegaNome||'Collega')}</span>`;
  h += '</div>';
  h += `<div class="top-title">${esc(im.indirizzo || 'Senza indirizzo')}</div>`;
  if(im.citofono) h += `<div class="top-sub">${ico('campanello',12)} ${esc(im.citofono)}${im.citofonoInfo && im.citofonoInfo.ruolo ? ' · '+esc(im.citofonoInfo.ruolo) : ''}</div>`;
  if(telP) h += `<div class="top-sub">${ico('telefono',12)} ${esc(telP)}</div>`;
  if(prezzoMercato !== null && prezzoMercato > 0) h += `<div class="top-sub" style="font-weight:700;color:var(--ink);">${ico('moneta',12)} Prezzo al mercato: ${prezzoMercato.toLocaleString('it-IT',{maximumFractionDigits:0})} €</div>`;
  if(nomeP) h += `<div class="top-sub">${ico('persona',12)} ${esc(nomeP)}</div>`;
  if(locazioneInCorso(im)) h += `<div class="top-sub" style="font-weight:700;color:var(--ink);">${ico('casa',12)} ${im.locazione.operazione==='vendita'?'IN VENDITA · LOCATO':'IMMOBILE LOCATO'}</div>`;
  (im.occupanti||[]).forEach(o=>{ const p=trovaPersona(o.personaId);if(p)h+=`<div class="top-sub">${ico('persona',12)} ${locazioneInCorso(im)?esc(o.tipo||'Inquilino'):'Contatto locazione'}: ${esc(nomeCogn(p))}</div>`; });
  if(im.valutata) h += `<div class="top-sub" style="color:var(--ink);font-weight:600;">${ico('check',12)} Valutato il ${im.dataValutazione?fmtD(im.dataValutazione):'—'}</div>`;
  if(!im.villa && co && dc.amministratore && dc.amministratore.nome) h += `<div class="top-sub">${iconaCondo(12)} ${esc(dc.amministratore.nome)}</div>`;
  h += '<div class="top-actions" style="flex-wrap:wrap;">';
  if(telP) h += `<button class="btn btn-secondary btn-icon" onclick="chiama('${esc(telP)}')">${ico('telefono',15)}</button><button class="btn btn-secondary btn-icon" onclick="wa('${esc(telP)}')">${ico('whatsapp',15)}</button>`;
  if(hc) h += `<button class="btn btn-secondary btn-icon" onclick="navMaps(${geoNav.lat},${geoNav.lng},'${esc(im.indirizzo).replace(/'/g,'')}')">${ico('nav',15)}</button>`;
  h += `<button class="btn btn-secondary btn-icon" title="Altre azioni" aria-label="Altre azioni" onclick="apriMenuAzioniImmobile('${id}')"><span style="font-size:20px;line-height:1">⋯</span></button>`;
  h += '</div>';
  h += '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">';
  if(['NT','INK','VND'].includes(im.stato) || haSchedaValutazioneCompilata(im)) h += `<button class="btn btn-secondary" style="flex:1;min-width:calc(50% - 3px);margin:0;padding:10px 6px;font-size:12px;" onclick="apriModificaDossier('${id}')">${ico('documento',14)} Dossier</button>`;
  if(haSchedaValutazioneDisponibile(im)) h += `<button class="btn btn-secondary" style="flex:1;min-width:calc(50% - 3px);margin:0;padding:10px 6px;font-size:12px;" onclick="apriSchedaValutazione('${id}')">${ico('righello',14)} Valutazione</button>`;
  h += `<button class="btn btn-secondary" style="flex:1;min-width:calc(50% - 3px);margin:0;padding:10px 6px;font-size:12px;" onclick="apriModifica()">${ico('modifica',14)} Anagrafica</button>`;

  h += `<button class="btn btn-secondary" style="flex:1;min-width:calc(50% - 3px);margin:0;padding:10px 6px;font-size:12px;" onclick="apriCambiaStato()">${ico('aggiorna',14)} Stato</button>`;

  h += '</div></div>';
  h += renderBoxAttivita(im, true);
  if(im.schedaValutazione && Object.keys(im.schedaValutazione).length > 0){
    const sv = im.schedaValutazione;
    let bodyV = '';
    if(im.dataValutazione) bodyV += `<div class="info-row"><span class="label">Data valutazione</span><span class="value">${fmtD(im.dataValutazione)}</span></div>`;
    if(sv.tipoImmobile) bodyV += `<div class="info-row"><span class="label">Tipo</span><span class="value">${esc(sv.tipoImmobile)}</span></div>`;
    if(sv.statoImmobile) bodyV += `<div class="info-row"><span class="label">Stato</span><span class="value">${esc(sv.statoImmobile)}</span></div>`;
    if(sv.richiestaValutazione) bodyV += `<div class="info-row"><span class="label">Richiesta valutazione</span><span class="value">${esc(sv.richiestaValutazione)} €</span></div>`;
    if(sv.mqComplessivi) bodyV += `<div class="info-row"><span class="label">Mq complessivi</span><span class="value">${esc(sv.mqComplessivi)}</span></div>`;
    if(sv.nCamere) bodyV += `<div class="info-row"><span class="label">Camere</span><span class="value">${esc(sv.nCamere)}</span></div>`;
    if(sv.serviziBagno) bodyV += `<div class="info-row"><span class="label">Bagni</span><span class="value">${esc(sv.serviziBagno)}</span></div>`;
    if(sv.lavoriUrgenti) bodyV += `<div class="info-row"><span class="label">Lavori urgenti</span><span class="value">${esc(sv.lavoriUrgenti)}</span></div>`;
    if(sv.note) bodyV += `<div class="info-row"><span class="label">Note</span><span class="value" style="white-space:pre-wrap;">${esc(sv.note)}</span></div>`;
    h += collapsible('im_valut', ico('righello',13) + ' Scheda valutazione', bodyV, im.valutata ? 'Valutato' : null);
  }
  const lo=im.locazione || {};
  if(haDatiLocazione(im)){
    const righeLoc=[];
    if(lo.operazione) righeLoc.push(['Operazione',etichettaOperazione(lo.operazione)]);
    if(lo.stato) righeLoc.push(['Occupazione',lo.stato]);
    if(lo.canoneConcordato)righeLoc.push(['Canone contrattuale',lo.canoneConcordato+' €/mese']);
    else if(lo.canoneRichiesto)righeLoc.push(['Canone richiesto',lo.canoneRichiesto+' €/mese']);
    if(lo.decorrenzaContratto)righeLoc.push(['Decorrenza',lo.decorrenzaContratto]);
    if(lo.scadenzaContratto)righeLoc.push(['Scadenza',lo.scadenzaContratto]);
    if(lo.contratto)righeLoc.push(['Contratto',lo.contratto]);
    if(lo.registrazione)righeLoc.push(['Registrazione',lo.registrazione]);
    const corpo=righeLoc.map(([k,v])=>`<div class="info-row"><span class="label">${esc(k)}</span><span class="value">${esc(v)}</span></div>`).join('')
      + `<div class="btn-row" style="margin-top:8px;"><button class="btn btn-secondary" onclick="apriLocazioneImmobile('${im.id}')">${ico('modifica',14)} Gestisci</button><button class="btn btn-secondary" onclick="apriArchivioLocazione('${im.id}')">${ico('documento',14)} Documenti</button></div>`;
    const badge=locazioneInCorso(im)?'Locato':null;
    h+=collapsible('im_loc',ico('casa',13)+' Operazione · locazione',corpo,badge);
  }
  if(['NT','INK','VND'].includes(im.stato)){
    const z = im.prezzi || {};
    const fields = im.stato === 'NT' ? [['richiesto','Prezzo richiesto'],['valutato','Prezzo valutato'],['omi','Prezzo OMI']]
      : im.stato === 'INK' ? [['richiesto','Prezzo richiesto'],['valutato','Prezzo valutato'],['mercato','Prezzo al mercato'],['omi','Prezzo OMI'],['ultimo','Ultimo prezzo']]
      : [['richiesto','Prezzo richiesto'],['valutato','Prezzo valutato'],['mercato','Prezzo al mercato'],['venduto','Prezzo venduto'],['omi','Prezzo OMI']];
    const rows = [];
    fields.forEach(([k,lbl]) => { if(z[k]) rows.push(`<div class="info-row"><span class="label">${lbl}</span><span class="value">${parseNum(z[k]).toLocaleString('it-IT')} €</span></div>`); });
    const pct = (a,b) => { a = parseNum(a); b = parseNum(b); if(a === null || b === null || !a) return null; const v = (a-b)/a*100; return (v>0?'+':'')+v.toFixed(1).replace('.',',')+'%'; };
    if(z.richiesto && z.valutato){ const p = pct(z.richiesto, z.valutato); if(p) rows.push(`<div class="info-row"><span class="label">Richiesto / valutato</span><span class="value">${p}</span></div>`); }
    if(z.richiesto && z.ultimo){ const p = pct(z.richiesto, z.ultimo); if(p) rows.push(`<div class="info-row"><span class="label">Trattativa (richiesto / ultimo)</span><span class="value">${p}</span></div>`); }
    if(z.richiesto && z.venduto){ const p = pct(z.richiesto, z.venduto); if(p) rows.push(`<div class="info-row"><span class="label">Richiesto / venduto</span><span class="value">${p}</span></div>`); }
    if(z.mercato && z.venduto){ const p = pct(z.mercato, z.venduto); if(p) rows.push(`<div class="info-row"><span class="label">Mercato / venduto</span><span class="value">${p}</span></div>`); }
    if(im.stato === 'INK' && z.provvValore){
      const base = parseNum(z.ultimo) || parseNum(z.richiesto);
      let t = z.provvTipo === '€' ? eur(z.provvValore) : z.provvValore + '%';
      if(z.provvTipo !== '€' && base) t += ' ≈ ' + Math.round(base * parseNum(z.provvValore) / 100).toLocaleString('it-IT') + ' €';
      rows.push(`<div class="info-row"><span class="label">Provvigione</span><span class="value">${t}</span></div>`);
      if(z.provvNote) rows.push(`<div class="info-row"><span class="label">Note provv.</span><span class="value">${esc(z.provvNote)}</span></div>`);
    }
    const body = (rows.length ? rows.join('') : '<div style="font-size:12.5px;color:var(--tx3);padding:4px 0;">Da compilare</div>') + `<button class="btn btn-primary" style="margin-top:8px;" onclick="apriPrezzi('${id}')">${ico('modifica',14)} Modifica prezzi</button>`;
    h += collapsible('im_prezzi', ico('moneta',13) + ' Prezzi', body);
  }
  if(!im.villa && co){
    let bodyC = '';
    if(dc.annoCostruzione) bodyC += `<div class="info-row"><span class="label">Anno</span><span class="value">${esc(dc.annoCostruzione)}</span></div>`;
    if(dc.statoCondominio) bodyC += `<div class="info-row"><span class="label">Stato</span><span class="value">${esc(dc.statoCondominio)}</span></div>`;
    if(dc.amministratore && dc.amministratore.nome){
      bodyC += `<div class="info-row"><span class="label">Amm.</span><span class="value">${esc(dc.amministratore.nome)}</span></div>`;
      if(dc.amministratore.telefono) bodyC += `<div class="info-row"><span class="label">Tel</span><span class="value">${esc(dc.amministratore.telefono)}</span></div>`;
    }
    bodyC += `<button class="btn btn-primary" style="margin-top:8px;" onclick="apriModificaCondominio('${esc(co).replace(/'/g,'')}')">${ico('modifica',14)} Condominio</button>`;
    h += collapsible('im_condo', ico('condominio',13) + ' Condominio', bodyC);
  }
  const d = im.dettagli || {};
  const righe = [];
  if(Array.isArray(d.tipologia) && d.tipologia.length) righe.push(['Tipologia', d.tipologia.join(', ')]);
  if(Array.isArray(d.sottotipologia) && d.sottotipologia.length) righe.push(['Sotto-tipologia', d.sottotipologia.join(', ')]);
  if(Array.isArray(d.statoConservativo) && d.statoConservativo.length) righe.push(['Stato', d.statoConservativo.join(', ')]);
  if(d.mqCalpestabili) righe.push(['Mq calpestabili', d.mqCalpestabili]);
  if(d.mqCommerciali) righe.push(['Mq commerciali', d.mqCommerciali]);
  if(Array.isArray(d.locali) && d.locali.length) righe.push(['Locali', d.locali.join(', ')]);
  if(Array.isArray(d.bagni) && d.bagni.length) righe.push(['Bagni', d.bagni.join(', ')]);
  if(Array.isArray(d.piano) && d.piano.length) righe.push(['Piano', d.piano.join(', ')]);
  if(Array.isArray(d.pianoNum) && d.pianoNum.length) righe.push(['N° piano', d.pianoNum.join(', ')]);
  if(d.arredamento) righe.push(['Arredamento', d.arredamento + (d.arredamentoNote ? ' — ' + d.arredamentoNote : '')]);
  if(Array.isArray(d.certEnergetica) && d.certEnergetica.length) righe.push(['Certificazione', d.certEnergetica.join(', ')]);
  if(Array.isArray(d.classeEnergetica) && d.classeEnergetica.length) righe.push(['Classe energetica', d.classeEnergetica.join(', ')]);
  if(d.riscaldamento) righe.push(['Riscaldamento', d.riscaldamento]);
  if(Array.isArray(d.riscaldamentoTipo) && d.riscaldamentoTipo.length) righe.push(['Tipo risc.', d.riscaldamentoTipo.join(', ')]);
  if(d.raffrescamento) righe.push(['Raffrescamento', d.raffrescamento]);
  if(Array.isArray(d.raffTipo) && d.raffTipo.length) righe.push(['Tipo raff.', d.raffTipo.join(', ')]);
  if(d.fvImpianto) righe.push(['Fotovoltaico', d.fvImpianto + (d.fvAccumulo && d.fvAccumulo !== 'Assente' ? ' · ' + d.fvAccumulo : '') + (d.fvTipo ? ' · ' + d.fvTipo : '')]);
  if(d.fvPotenza) righe.push(['Potenza FV', d.fvPotenza + ' kWp']);
  if(d.fvAnno) righe.push(['Anno FV', d.fvAnno]);
  if(Array.isArray(d.infissi) && d.infissi.length) righe.push(['Infissi', d.infissi.join(', ')]);
  if(Array.isArray(d.vista) && d.vista.length) righe.push(['Vista', d.vista.join(', ')]);
  if(Array.isArray(d.zonaCaratt) && d.zonaCaratt.length) righe.push(['Zona', d.zonaCaratt.join(', ')]);

const SV_AMBIENTI = [
  ['ingresso','Ingresso'],['soggiorno','Soggiorno'],['salaPranzo','Sala pranzo'],
  ['cucinaAbitabile','Cucina ab.'],['angoloCottura','Angolo cottura'],['tinello','Tinello'],
  ['cameraGrande','Camera grande'],['cameraMedia','Camera media'],['cameraPiccola','Camera piccola'],
  ['bagnoAmbiente','Bagno'],['studio','Studio'],
  ['terrazzo','Terrazzo'],['balcone','Balcone'],['postoAuto','Posto auto'],['box','Box']
];
const SV_AMBIENTI_DIM = SV_AMBIENTI.map(a => a[0]);
const SV_NOMI = Object.fromEntries(SV_AMBIENTI);
const SV_CATEGORIE = [
  ['Zona giorno',['ingresso','soggiorno','salaPranzo','cucinaAbitabile','angoloCottura','tinello']],
  ['Zona notte e servizi',['cameraGrande','cameraMedia','cameraPiccola','bagnoAmbiente','studio']],
  ['Esterni e pertinenze',['terrazzo','balcone','postoAuto','box']]
];
function svNumeroAmbienti(sv,k){
  if(!svAmbienteAttivo(sv,k)) return 0;
  const n = Number(sv.ambientiQuantita && sv.ambientiQuantita[k]);
  const esistenti = sv.ambientiDettaglio && sv.ambientiDettaglio[k];
  return Math.max(1,Math.min(30,Number.isFinite(n)&&n>0 ? Math.trunc(n) : Array.isArray(esistenti)&&esistenti.length ? esistenti.length : 1));
}
function svDettagliAmbiente(sv,k){
  const arr = sv.ambientiDettaglio && sv.ambientiDettaglio[k];
  if(Array.isArray(arr)) return arr.map(o => ({l:o && o.l || '',w:o && o.w || ''}));
  const old = sv[k];
  return old && typeof old === 'object' ? [{l:old.l || '',w:old.w || ''}] : [];
}
function svRaccogliDettagli(){
  const sv=window._svBozza; if(!sv)return;
  sv.ambientiPresenti = sv.ambientiPresenti || {};
  sv.ambientiQuantita = sv.ambientiQuantita || {};
  sv.ambientiDettaglio = sv.ambientiDettaglio || {};
  SV_AMBIENTI_DIM.forEach(k=>{
    if(!svAmbienteAttivo(sv,k)) return;
    const n=svNumeroAmbienti(sv,k);
    const backup=svDettagliAmbiente(sv,k);
    const arr=[];
    for(let i=0;i<n;i++){
      const lEl=document.getElementById(`sv-room-${k}-${i}-l`), wEl=document.getElementById(`sv-room-${k}-${i}-w`);
      arr.push({l:lEl?lEl.value:backup[i]&&backup[i].l||'',w:wEl?wEl.value:backup[i]&&backup[i].w||''});
    }
    sv.ambientiQuantita[k]=n;
    sv.ambientiDettaglio[k]=arr;
    sv[k]=arr[0]||{l:'',w:''}; // compatibilita con valutazioni precedenti
  });
}
const SV_LOCALI_APPARTAMENTO = new Set(['ingresso','soggiorno','salaPranzo','cucinaAbitabile','angoloCottura','tinello','cameraGrande','cameraMedia','cameraPiccola','bagnoAmbiente','studio']);
function svMisuraNumero(v){const n=Number(String(v??'').trim().replace(',','.'));return Number.isFinite(n)&&n>0?n:0;}
function svCalcolaMqAppartamento(){
  const sv=window._svBozza;if(!sv)return {mq:0,completi:0};
  let mq=0,completi=0;
  SV_LOCALI_APPARTAMENTO.forEach(k=>{
    if(!svAmbienteAttivo(sv,k))return;
    const q=svNumeroAmbienti(sv,k),arr=svDettagliAmbiente(sv,k);
    for(let i=0;i<q;i++){
      const l=document.getElementById(`sv-room-${k}-${i}-l`),w=document.getElementById(`sv-room-${k}-${i}-w`);
      const a=svMisuraNumero(l?l.value:arr[i]?.l),b=svMisuraNumero(w?w.value:arr[i]?.w);
      if(a&&b){mq+=a*b;completi++;}
    }
  });
  return {mq:Math.round(mq*100)/100,completi};
}
function svAggiornaMqAppartamento(){
  const t=svCalcolaMqAppartamento(),el=document.getElementById('sv-mq');
  if(el)el.value=t.completi?String(t.mq).replace('.',','):'';
  const info=document.getElementById('sv-mq-info');
  if(info)info.textContent=t.completi?`${t.completi} ${t.completi===1?'locale misurato':'locali misurati'} · solo superficie interna dell’appartamento`:'Inserisci lunghezza e profondita dei locali per calcolare il totale.';
}
function svRendiAmbienti(){
  const sv=window._svBozza; const target=document.getElementById('sv-ambienti-dettaglio');
  if(!sv||!target)return;
  let html='';
  SV_CATEGORIE.forEach(([categoria,keys])=>{
    const attivi=keys.filter(k=>svAmbienteAttivo(sv,k));
    if(!attivi.length)return;
    html+=`<div class="sv-room-group"><div class="sv-room-category">${categoria}</div>`;
    attivi.forEach(k=>{
      const q=svNumeroAmbienti(sv,k), arr=svDettagliAmbiente(sv,k);
      html+=`<div class="sv-room-card"><div class="sv-room-top"><strong>${SV_NOMI[k]}</strong><div class="sv-room-counter"><button type="button" title="Meno ${SV_NOMI[k]}" aria-label="Riduci ${SV_NOMI[k]}" onclick="svCambiaQuantita('${k}',-1)" ${q<=1?'disabled':''}>−</button><b>${q}</b><button type="button" title="Piu ${SV_NOMI[k]}" aria-label="Aggiungi ${SV_NOMI[k]}" onclick="svCambiaQuantita('${k}',1)" ${q>=30?'disabled':''}>+</button></div></div>`;
      for(let i=0;i<q;i++){
        const v=arr[i]||{};
        html+=`<div class="sv-room-line"><span>${q>1?i+1:''}</span><label><small>L (m)</small><input class="form-input" id="sv-room-${k}-${i}-l" inputmode="decimal" oninput="svAggiornaMqAppartamento()" value="${esc(v.l||'')}"></label><label><small>P (m)</small><input class="form-input" id="sv-room-${k}-${i}-w" inputmode="decimal" oninput="svAggiornaMqAppartamento()" value="${esc(v.w||'')}"></label></div>`;
      }
      html+='</div>';
    });
    html+='</div>';
  });
  target.innerHTML=html;
  const camere=['cameraGrande','cameraMedia','cameraPiccola'].reduce((v,k)=>v+svNumeroAmbienti(sv,k),0);
  const bagni=svNumeroAmbienti(sv,'bagnoAmbiente');
  const sum=document.getElementById('sv-room-summary');
  if(sum)sum.textContent=[camere?camere+' camere':'',bagni?bagni+' bagni':''].filter(Boolean).join(' · ');
  svAggiornaMqAppartamento();
}
function svCambiaQuantita(k, delta){
  const sv=window._svBozza;if(!sv||!svAmbienteAttivo(sv,k))return;
  svRaccogliDettagli();
  sv.ambientiQuantita=sv.ambientiQuantita||{};
  sv.ambientiQuantita[k]=Math.max(1,Math.min(30,svNumeroAmbienti(sv,k)+delta));
  svRendiAmbienti();
  const chip=document.querySelector(`[data-sv-room="${k}"] .sv-chip-quantity`);
  if(chip)chip.textContent=String(svNumeroAmbienti(sv,k));
}
function svAmbienteAttivo(sv, k){
  if(sv.ambientiPresenti && Object.prototype.hasOwnProperty.call(sv.ambientiPresenti,k)) return sv.ambientiPresenti[k] === true;
  if(sv.ambientiDettaglio && Array.isArray(sv.ambientiDettaglio[k]) && sv.ambientiDettaglio[k].length) return true;
  if(k === 'bagnoAmbiente' && !sv.ambientiPresenti && Number(sv.serviziBagno) > 0) return true;
  const v = sv[k];
  if(v && typeof v === 'object') return Boolean(v.presente || v.l || v.w);
  return v === 'Si';
}

  const im = DB.immobili.find(x => x.id === window._valId); if(!im || !window._svBozza) return;
  const cur = window._svBozza[campo];
  const nuovo = (cur === valore) ? '' : valore;

  if(btn && btn.parentNode){
    btn.parentNode.querySelectorAll('button').forEach(b => b.classList.remove('active'));

}
function svSelMulti(campo, valore, btn){

  if(typeof arr === 'string') arr = arr ? [arr] : [];

function salvaSchedaValutazione(id){
  const im = DB.immobili.find(x => x.id === id); if(!im) return;
  const sv = window._svBozza; if(!sv || window._valId !== id) return;
  const primaCompilazione = !im.svPrimaCompilazioneAt && !im.schedaValutazione;
  ['anno','annorist','napp','piani','risc','cort','giard','piano','mq','camere','bagni','spese','amm','mutimp','mutrata','rich','lavurg','note','visdal','visalle','visgiorni','viscont','libdal','affdal'].forEach(x => {
    const el = document.getElementById('sv-'+x);
    if(el) sv[{anno:'annoCostruzione',annorist:'annoRistrutturazione',napp:'nAppartamenti',piani:'pianiFuoriTerra',risc:'riscaldamento',cort:'cortileMq',giard:'giardinoMq',piano:'piano',mq:'mqComplessivi',camere:'nCamere',bagni:'serviziBagno',spese:'speseCond',amm:'amministratore',mutimp:'mutuoResiduoImporto',mutrata:'mutuoResiduoRata',rich:'richiestaValutazione',lavurg:'lavoriUrgenti',note:'note',visdal:'visiteDalle',visalle:'visiteAlle',visgiorni:'visiteGiorni',viscont:'visiteContattare',libdal:'liberoDal',affdal:'affittatoDal'}[x]] = el.value;
  });
  svRaccogliDettagli();
  const totaleAppartamento=svCalcolaMqAppartamento();
  sv.mqComplessivi=totaleAppartamento.completi?String(totaleAppartamento.mq):'';
  SV_AMBIENTI_DIM.forEach(k=>{
    if(!svAmbienteAttivo(sv,k)){
      sv[k]=null;
      if(sv.ambientiQuantita)delete sv.ambientiQuantita[k];
      if(sv.ambientiDettaglio)delete sv.ambientiDettaglio[k];
    }
  });
  const tipiCamere=['cameraGrande','cameraMedia','cameraPiccola'];
  if(tipiCamere.some(k=>sv.ambientiPresenti && Object.prototype.hasOwnProperty.call(sv.ambientiPresenti,k)))
    sv.nCamere=tipiCamere.reduce((v,k)=>v+svNumeroAmbienti(sv,k),0).toString();
  if(sv.ambientiPresenti && Object.prototype.hasOwnProperty.call(sv.ambientiPresenti,'bagnoAmbiente'))
    sv.serviziBagno=String(svNumeroAmbienti(sv,'bagnoAmbiente'));
  // Compatibilita con il precedente campo numerico 'serviziBagno'.
  sv.ambientiPresenti = sv.ambientiPresenti || {};
  const cb = document.getElementById('sv-valutata');
  im.valutata = cb ? cb.checked : false;
  if(im.valutata && !im.dataValutazione) im.dataValutazione = new Date().toISOString();
  if(!im.valutata) im.dataValutazione = null;
  const compilata = Object.entries(sv).some(([k,v]) => k !== 'ambientiPresenti' && (typeof v === 'string' ? v.trim() !== '' : Array.isArray(v) ? v.length > 0 : v && typeof v === 'object' ? Object.values(v).some(x => Boolean(x)) : v === true)) || Object.values(sv.ambientiPresenti).some(Boolean);
  if(!compilata && primaCompilazione){
    alert('La scheda e vuota: inserisci almeno un dato prima di salvarla.');
    return;
  }
  im.schedaValutazione = sv;
  if(primaCompilazione && compilata){
    im.svPrimaCompilazioneAt = new Date().toISOString();
    const a = {id:uid(),seq:seq(),data:im.svPrimaCompilazioneAt,tipo:'fatta',tipoAtt:'ALTRO',testo:'Prima compilazione scheda valutazione',completata:true,immobileId:im.id};
    im.attivita = im.attivita || []; im.attivita.push({id:a.id,seq:a.seq,data:a.data,tipo:a.tipo,testo:a.testo,completata:true});
    DB.attivita = DB.attivita || []; DB.attivita.push(a);
    syncAttToPersone(im.id,a.id,'add');
  }
  applicaSchedaAlDossier(im);
  window._svBozza = null;
  im.updatedAt = new Date().toISOString();
  Storage.save(DB);
  chiudiModal();
  setTimeout(() => apriScheda(id), 80);
  renderListaImmobili();
}

function tipologiaDaValutazione(tipo){
  const map = {
    'Appartamento':['Appartamento',null], 'Condominio':['Appartamento','Palazzo'],
    'Stabile':['Appartamento','Palazzo'], 'Villa singola':['Villa','Villa singola'],
    'Villa schiera':['Villa',"La schiera"], 'Villa bifamiliare':['Villa','Bifamiliare'],
    'Rustico':['Rustico/Cascina/Casa','Rustico'], 'Cantiere':['Appartamento',null],
    'Negozio':['Locale Commerciale','Negozio'],'Terreno':['Terreno',null],
    'Edilizia agevolata':['Appartamento',null]
  };
  return map[tipo] || null;
}
function riepilogoLocaliDaValutazione(sv){
  const rooms=[];
  SV_AMBIENTI.forEach(([k,nome])=>{
    if(!svAmbienteAttivo(sv,k))return;
    const quantity=svNumeroAmbienti(sv,k), arr=svDettagliAmbiente(sv,k);
    for(let i=0;i<quantity;i++){
      const v=arr[i]||{}, l=String(v.l||'').trim(),p=String(v.w||'').trim();
      const len=parseNum(l), wid=parseNum(p), mq=len>0&&wid>0 ? Math.round(len*wid*100)/100 : null;
      rooms.push({tipo:k,nome:nome,numero:i+1,quantita:quantity,l,p,mq});
    }
  });
  return rooms;
}
function htmlLocaliDossier(d){
  const rooms=d.ambientiRilevati;
  if(!Array.isArray(rooms)||!rooms.length)return '';
  const tot=rooms.reduce((v,r)=>v+(typeof r.mq==='number'?r.mq:0),0);
  let h='<div class="dossier-rooms"><div class="dossier-rooms-heading">Ambienti rilevati</div>';
  rooms.forEach(r=>{
    const nome=esc(String(r.nome||r.tipo||'Ambiente'))+(r.quantita>1?' '+Number(r.numero||1):'');
    const dimensioni=(r.l||r.p) ? esc([r.l,r.p].filter(Boolean).join(' × '))+' m' : '—';
    h+=`<div class="dossier-room-row"><span>${nome}</span><strong>${dimensioni}</strong>${r.mq!==null&&r.mq!==undefined?`<small>${esc(String(r.mq))} m²</small>`:''}</div>`;
  });
  if(tot>0)h+=`<div class="dossier-room-total">Somma superfici misurate <strong>${tot.toFixed(2)} m²</strong></div>`;
  return h+'</div>';
}
function applicaSchedaAlDossier(im){
  const sv = im.schedaValutazione || {};
  const d = im.dettagli = im.dettagli || {};
  // I valori della valutazione popolano i campi NATIVI del dossier, non un riepilogo isolato.
  const tipo = tipologiaDaValutazione(sv.tipoImmobile);
  if(tipo){
    d.tipologia=[tipo[0]];
    d.sottotipologia=tipo[1] ? [tipo[1]] : [];
  }
  d.ambientiRilevati=riepilogoLocaliDaValutazione(sv);
  // Ricalcola i valori in base alle quantita rilevate, se esistono ambienti selezionati.
  const qCamere=['cameraGrande','cameraMedia','cameraPiccola'].reduce((v,k)=>v+svNumeroAmbienti(sv,k),0);
  const qBagni=svNumeroAmbienti(sv,'bagnoAmbiente');
  const qCucine=svNumeroAmbienti(sv,'cucinaAbitabile')+svNumeroAmbienti(sv,'angoloCottura');
  const qBox=svNumeroAmbienti(sv,'box');
  const qPosti=svNumeroAmbienti(sv,'postoAuto');
  const explicitly = k => sv.ambientiPresenti && Object.prototype.hasOwnProperty.call(sv.ambientiPresenti,k);
  const camereScelte=['cameraGrande','cameraMedia','cameraPiccola'].some(explicitly);
  if(camereScelte) d.camere=qCamere ? [qCamere>=5?'5+':String(qCamere)] : [];
  else if(sv.nCamere && Number(sv.nCamere)>0) d.camere=[Number(sv.nCamere)>=5?'5+':String(sv.nCamere)];
  if(explicitly('bagnoAmbiente')) d.bagni=qBagni ? [qBagni>=4?'4+':String(qBagni)] : [];
  else if(sv.serviziBagno && Number(sv.serviziBagno)>0) d.bagni=[Number(sv.serviziBagno)>=4?'4+':String(sv.serviziBagno)];
  if(explicitly('cucinaAbitabile')||explicitly('angoloCottura')){
    d.nCucine=String(qCucine);
    d.cucina=qCucine ? [...(svNumeroAmbienti(sv,'cucinaAbitabile')?['Abitabile']:[]),...(svNumeroAmbienti(sv,'angoloCottura')?['Angolo cottura']:[])] : [];
  }
  if(explicitly('box')) d.nBox=String(qBox);
  if(explicitly('postoAuto')) d.nPostiAuto=String(qPosti);
  // Copia completa della scheda nel dossier, anche per i campi senza corrispondenza nel matching.
  d.schedaValutazione = JSON.parse(JSON.stringify(sv));
  d._svSyncSnapshot=JSON.stringify(sv);
  if(sv.annoRistrutturazione) d.annoRistrutturazione = sv.annoRistrutturazione;
  if(sv.statoImmobile) d.statoConservativo = [sv.statoImmobile];
  if(sv.annoCostruzione) d.annoCostruzione = sv.annoCostruzione;
  if(sv.ascensore === 'Si') d.ascensore = 'Si';
  else if(sv.ascensore === 'No') d.ascensore = 'No';
  if(sv.portineria === 'Si') d.portineria = 'Si';
  else if(sv.portineria === 'No') d.portineria = 'No';
  if(sv.pianiFuoriTerra) d.nPianiEdificio = sv.pianiFuoriTerra;
  if(sv.lavanderia === 'Si') d.lavanderia = 'Si';
  if(sv.postoMacchina === 'Si') d.postoAuto = 'Si';
  if(sv.cortileMq){ d.cortile = 'Si'; }
  if(sv.giardinoMq){ d.giardino = 'Si'; d.mqGiardino = sv.giardinoMq; }
  if(sv.piano) d.piano = [sv.piano];
  if(sv.mqComplessivi){
    const m = parseNum(sv.mqComplessivi);
    if(m !== null && m > 0){ d.mqCommerciali = sv.mqComplessivi; if(!d.mqCalpestabili) d.mqCalpestabili = sv.mqComplessivi; }
  }
  if(sv.riscaldamento){
    const r = sv.riscaldamento.toLowerCase();
    if(r.indexOf('autonom') >= 0) d.riscaldamento = ['Autonomo'];
    else if(r.indexOf('central') >= 0) d.riscaldamento = ['Centralizzato'];
  }
  if(svAmbienteAttivo(sv,'studio')) d.studio = 'Si';
  if(svAmbienteAttivo(sv,'cucinaAbitabile')) d.cucina = ['Abitabile'];
  else if(svAmbienteAttivo(sv,'angoloCottura')) d.cucina = ['Angolo cottura'];
  d.terrazzo = svAmbienteAttivo(sv,'terrazzo') ? 'Si' : 'No';
  d.balcone = svAmbienteAttivo(sv,'balcone') ? 'Si' : 'No';
  d.box = svAmbienteAttivo(sv,'box') ? 'Si' : 'No';
  d.postoAuto = svAmbienteAttivo(sv,'postoAuto') ? 'Si' : 'No';
  if(sv.speseCond) d.speseCond = sv.speseCond;
  if(sv.ipoteche) d.ipotecaPresente = sv.ipoteche === 'Si' ? 'Si' : 'No';

  /* Disponibilita (array) */
  if(Array.isArray(sv.disponibilita) && sv.disponibilita.length){
    if(sv.disponibilita.includes('Libero')) d.occupazione = 'Libero';
    else if(sv.disponibilita.includes('Affittato')) d.occupazione = 'Locato';
    else if(sv.disponibilita.includes('Occupato dal proprietario')) d.occupazione = 'Abitato dal proprietario';
    if(sv.disponibilita.includes('Chiavi')){
      const note = (im.note || '').trim();
      if(!note.toLowerCase().includes('chiavi')) im.note = (note ? note + ' · ' : '') + 'Chiavi disponibili';
    }
  } else if(sv.disponibilita && typeof sv.disponibilita === 'string'){
    if(sv.disponibilita === 'Libero') d.occupazione = 'Libero';
    else if(sv.disponibilita === 'Affittato') d.occupazione = 'Locato';
    else if(sv.disponibilita === 'Occupato dal proprietario') d.occupazione = 'Abitato dal proprietario';
  }
  if(sv.amministratore && !im.villa){
    const co = condoDi(im);
    if(co){
      const dc = dettagliCondo(co);
      if(!dc.amministratore) dc.amministratore = { nome:'', telefono:'' };
      if(!dc.amministratore.nome) dc.amministratore.nome = sv.amministratore;
    }
  }
}

function nextZ(im){
  // Il valore suggerito segue il numero Z piu' alto del condominio (+1).
  // Eventuali numeri liberati restano selezionabili manualmente.
  const c = condoDi(im);
  let massimo = 0;
  DB.immobili.forEach(x => {
    if(x.id === im.id || x.villa || condoDi(x) !== c) return;
    const n = Number(x.z);
    if(Number.isSafeInteger(n) && n > massimo) massimo = n;
  });
  return massimo + 1;
}
// Il numero Z identifica una scheda all'interno dello stesso condominio.
// L'assegnazione rimane automatica, ma puo' essere cambiata nei moduli.
function validaZImmobile(inputId, proposta){
  const campo = document.getElementById(inputId);
  const grezzo = campo ? String(campo.value || '').trim() : '';
  const n = grezzo === '' ? nextZ(proposta) : Number(grezzo);
  if(!Number.isSafeInteger(n) || n < 1 || n > 99999){
    alert('Inserisci un numero Z intero da 1 a 99999.');
    if(campo) campo.focus();
    return null;
  }
  const condominio = condoDi(proposta);
  if(DB.immobili.some(x => x.id !== proposta.id && !x.villa && condoDi(x) === condominio && Number(x.z || 1) === n)){
    alert('Z' + n + ' e gia assegnato a un altro immobile di questo condominio. Scegli un altro numero.');
    if(campo) campo.focus();
    return null;
  }
  return n;
}

function apriPickDoc(imId, t){
  const inp = document.createElement('input');

    const f = e.target.files[0]; try{ document.body.removeChild(inp); }catch(_){}

    f.arrayBuffer().then(ab => {
      const b = new Blob([ab], { type:f.type });
      const fid = 'doc_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
      return PhotoDB.saveDoc(fid, b, { nome:f.name, mime:f.type, size:b.size }).then(() => {

function scaricaDoc(fid){

function salvaCondominio(co){

  DB.condomini[co] = {
    createdAt:prev.createdAt || new Date().toISOString(), updatedAt:new Date().toISOString(),
    annoCostruzione:g('cd-anno').trim(), 
    amministratore:{ nome:g('cd-amm').trim().toUpperCase(), telefono:g('cd-tel') }, 
    zone:zonaEtichette(zonaEditorVal('cd-zone')), zonaCompetenza:zonaEditorVal('cd-zone'), foto:pf,
    datiStrutturali:{
      cappotto:g('cd-cappotto'),
      isolamentoAcustico:g('cd-isol'),

      nAscensori:g('cd-nasc'),
      portineria:g('cd-port'),
      montacarichi:g('cd-mont'),
      cortile:g('cd-cort'),
      giardinoCondo:g('cd-giard'),
      accessoCarrabile:g('cd-accesso'),
      androne:g('cd-andr'),
      piscina:g('cd-pisc')
    }
  };
  if(manuali) salvaCoordCondominio(co,manuali,'manuale');
  else if(eraManuale){delete DB.coordinateCondomini[co];geocodifica(co).then(r=>{if(r && (coordCondominio(co)||{}).fonte!=='manuale'){salvaCoordCondominio(co,r,'indirizzo');Storage.save(DB);if(map) aggiornaMappa();}});}
  Storage.save(DB); if(map) aggiornaMappa();

  if(immCollegato) apriScheda(immCollegato.id); else chiudiModal();
  renderListaImmobili();
}

function infoIcona(ims){
  if(!ims || !ims.length) return { tipo:'pin', colore:PIN_NEUTRAL, numero:0 };
  if(ims.length === 1){ const i = ims[0]; if(i.stato === 'IMM') return { tipo:'pin', colore:PIN_NEUTRAL, numero:1 }; return { tipo:'dot', colore:STATO_COL[i.stato]||'#b91c1c', label:i.stato }; }
  let sm = null, pm = 0;
  ims.forEach(i => { if(i.stato === 'VND' || i.stato === 'IMM') return; const p = STATO_PRIO[i.stato]||0; if(p > pm){ pm = p; sm = i.stato; } });
  const col = sm ? STATO_COL[sm] : PIN_NEUTRAL;
  return { tipo:'pin', colore:col, numero:ims.length };
}

// Round — modalita di lavoro sul territorio, geolocalizzazione e immobili vicini.
let _roundWatchId = null;
let _roundLastPosition = null;
let _roundError = '';
function roundMeToggle(){
  if(_roundWatchId !== null){
    navigator.geolocation.clearWatch(_roundWatchId);
    _roundWatchId = null;
    _roundError = '';
    roundMeRender();
    return;
  }
  if(!navigator.geolocation){
    _roundError = 'Geolocalizzazione non disponibile in questo browser.';
    roundMeRender();
    return;
  }
  _roundError = '';
  _roundWatchId = navigator.geolocation.watchPosition(
    pos => {
      _roundLastPosition = {lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,at:Date.now()};
      _roundError = '';
      roundMeRender();
    },
    err => {
      _roundError = err.code===1 ? 'Consenti la posizione nelle impostazioni di Safari e usa il sito tramite HTTPS.' :
        err.code===2 ? 'Posizione non disponibile. Controlla GPS e connessione.' : 'Tempo scaduto: riprova all’aperto.';
      if(_roundWatchId !== null){navigator.geolocation.clearWatch(_roundWatchId);_roundWatchId=null;}
      roundMeRender();
    },
    {enableHighAccuracy:true,maximumAge:5000,timeout:20000}
  );
  roundMeRender();
}
function roundMeDistance(a,b,c,d){
  const r=Math.PI/180, v=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;
  return Math.round(12742000*Math.asin(Math.min(1,Math.sqrt(v))));
}
function roundMeRender(){
  const host=document.getElementById('roundme-contenuto');
  const btn=document.getElementById('btn-roundme-start');
  if(!host) return;
  if(btn){btn.textContent=_roundWatchId===null?'Avvia GPS':'Ferma GPS';btn.setAttribute('aria-pressed',String(_roundWatchId!==null));}
  let h='';
  if(_roundError) h+=`<div class="card" role="alert" style="color:var(--vnd)">${esc(_roundError)}</div>`;
  if(!_roundLastPosition){
    h+='<div class="card"><strong>Round · lavoro in zona</strong><p style="font-size:13px;color:var(--tx2);margin-top:8px">Attiva il GPS per vedere gli immobili e i condomini vicini, senza dover cercare l’indirizzo.</p></div>';
    host.innerHTML=h;return;
  }
  const p=_roundLastPosition;
  h+=`<div class="card" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><strong>Posizione rilevata</strong><div style="font-size:12px;color:var(--tx2)">Precisione indicativa ±${Math.round(p.accuracy)} m</div></div><button type="button" class="btn btn-secondary btn-icon" style="width:40px;margin:0" title="Aggiorna elenco" aria-label="Aggiorna elenco" onclick="roundMeRender()">${ico('aggiorna',17)}</button></div>`;
  const groups=new Map();
  (DB.immobili||[]).forEach(im=>{
    const co=im.villa?'':condoDi(im);
    let pt=null;
    if(co) pt=coordCondominio(co);
    if(!pt && im.lat!=null && im.lng!=null) pt={lat:im.lat,lng:im.lng};
    if(!pt && im.coordinate) pt=im.coordinate;
    if(!pt) return;
    const lat=Number(pt.lat??pt[0]), lng=Number(pt.lng??pt.lon??pt[1]);
    if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return;
    const key=co||String(im.id), label=co||im.indirizzo||'Immobile';
    if(!groups.has(key))groups.set(key,{co,label,dist:roundMeDistance(p.lat,p.lng,lat,lng),items:[]});
    groups.get(key).items.push(im);
  });
  const near=[...groups.values()].sort((a,b)=>a.dist-b.dist).slice(0,30);
  h+=`<div style="font-size:12px;color:var(--tx2);margin:10px 2px">Immobili e condomini vicini · ${near.length} risultati</div>`;
  if(!near.length)h+='<div class="card">Non risultano immobili geolocalizzati. Aggiungi le coordinate alle schede per vederli qui.</div>';
  near.forEach(g=>{
    h+=`<button type="button" class="round-nearby" onclick="${g.co?`apriPopCondo(${argEvento(g.co)})`:`apriScheda(${argEvento(g.items[0].id)})`}"><span style="flex:1;min-width:0"><strong>${esc(g.label)}</strong><small>${g.items.length} ${g.items.length===1?'immobile':'immobili'}</small></span><span class="round-distance">${g.dist<1000?g.dist+' m':(g.dist/1000).toFixed(1)+' km'}</span></button>`;
  });
  host.innerHTML=h;
}

function initMappa(){
  if(map) return;
  const c = _coordsCitta || CREMONA_CENTER;
  map = L.map('map', { center:c, zoom:14 });
  const strade = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap contributors'});
  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, maxNativeZoom:19, attribution:'Imagery © Esri, Maxar, Earthstar Geographics, and the GIS User Community'});
  const isSatellite = localStorage.getItem('aranjo_map_layer') === 'satellite';
  document.getElementById('map').classList.toggle('map-satellite', isSatellite);
  (isSatellite ? satellite : strade).addTo(map);
  L.control.layers({'Strade':strade,'Satellite':satellite},null,{position:'topright',collapsed:true}).addTo(map);
  map.on('baselayerchange', e => {
    const satelliteAttivo = e.layer === satellite;
    document.getElementById('map').classList.toggle('map-satellite', satelliteAttivo);
    try { localStorage.setItem('aranjo_map_layer', satelliteAttivo?'satellite':'strade'); } catch(_) {}
  });
  markersLayer = L.layerGroup().addTo(map);
  map.on('contextmenu', e=>{ if(e && e.latlng) apriCreazioneDaMappa(e.latlng); });
  aggiornaMappa();
}

function apriPopCondo(co){

function aggiornaMappa(){
  if(!map || !markersLayer) return;
  markersLayer.clearLayers();
  window._popCondo = [];
  let l = DB.immobili.filter(i => coordValide(i) || (!i.villa && coordValide(coordCondominio(condoDi(i)))));
  if(mapFilStato) l = l.filter(i => i.stato === mapFilStato);
  const gc = {}, vs = [];
  l.forEach(im => { const c = condoDi(im); if(!c) vs.push(im); else { if(!gc[c]) gc[c] = []; gc[c].push(im); } });
  let pt = 0;
  for(const c in gc){
    const ims = gc[c], p = ims[0];
    const cc = (DB.coordinateCondomini && DB.coordinateCondomini[c]) || null;
    const lat = coordValide(cc) ? cc.lat : p.lat, lng = coordValide(cc) ? cc.lng : p.lng;
    const info = infoIcona(ims);
    const mk = L.marker([lat, lng], { icon:creaIcona(info) });
    if(ims.length === 1){
      const x = ims[0];
      mk.bindPopup(`<div class="aranjo-popup"><div class="pop-titolo">${esc(titoloImmobile(x))}</div><div class="pop-sub"><span class="pop-badge badge-${x.stato}">${x.stato}</span></div><button class="pop-btn" onclick="apriPopImm('${x.id}')">Apri</button><button class="pop-btn btn-nav" onclick="navMaps(${lat},${lng},'${esc(x.indirizzo).replace(/'/g,'')}')">Naviga</button></div>`);
    } else {
      window._popCondo.push(c);
      const idx = window._popCondo.length-1;
      mk.bindPopup(`<div class="aranjo-popup"><div class="pop-titolo">CONDOMINIO</div><div class="pop-sub">${esc(c)}</div><div class="pop-sub"><strong>${ims.length} immobili</strong></div><button class="pop-btn" onclick="apriPopCondoIdx(${idx})">Apri</button><button class="pop-btn btn-nav" onclick="navMaps(${lat},${lng},'${esc(c).replace(/'/g,'')}')">Naviga</button></div>`);
    }
    mk.addTo(markersLayer); pt++;
  }
  // Condomini registrati senza immobili: un pin autonomo evita che spariscano dalla mappa.
  if(!mapFilStato){
    for(const co of Object.keys(DB.condomini || {})){
      if(gc[co]) continue;
      const cc = (DB.coordinateCondomini || {})[co];
      if(!cc || !Number.isFinite(Number(cc.lat)) || !Number.isFinite(Number(cc.lng))) continue;
      const lat = Number(cc.lat), lng = Number(cc.lng);
      const mk = L.marker([lat,lng], { icon:creaIcona(infoIcona([])) });
      window._popCondo.push(co);
      const idx = window._popCondo.length - 1;
      mk.bindPopup(`<div class="aranjo-popup"><div class="pop-titolo">CONDOMINIO</div><div class="pop-sub">${esc(co)}</div><div class="pop-sub">0 immobili</div><button class="pop-btn" onclick="apriPopCondoIdx(${idx})">Apri</button></div>`);
      mk.addTo(markersLayer); pt++;
    }
  }
  vs.forEach(im => {
    const info = infoIcona([im]);
    const mk = L.marker([im.lat, im.lng], { icon:creaIcona(info) });
    mk.bindPopup(`<div class="aranjo-popup"><div class="pop-titolo">${esc(titoloImmobile(im))}</div><div class="pop-sub"><span class="pop-badge badge-${im.stato}">${im.stato}</span></div><button class="pop-btn" onclick="apriPopImm('${im.id}')">Apri</button><button class="pop-btn btn-nav" onclick="navMaps(${im.lat},${im.lng},'${esc(im.indirizzo).replace(/'/g,'')}')">Naviga</button></div>`);
    mk.addTo(markersLayer); pt++;
  });
  const e1 = document.getElementById('map-count'); if(e1) e1.textContent = pt;
  const e2 = document.getElementById('map-tot'); if(e2) e2.textContent = DB.immobili.length;
}
function centraMappaSuCittaPrincipale(){ if(!map) return; const centra = () => { map.setView(_coordsCitta || CREMONA_CENTER, 14); _mappaNeedsCenter = false; }; if(!_coordsCitta) geocodificaCitta().then(centra); else centra(); }
function fitBoundsImmobili(){
  if(!map) return;
  let l = DB.immobili.filter(i => coordValide(i) || (!i.villa && coordValide(coordCondominio(condoDi(i)))));
  if(mapFilStato) l = l.filter(i => i.stato === mapFilStato);
  const punti = l.map(i => !i.villa && coordValide(coordCondominio(condoDi(i))) ? coordCondominio(condoDi(i)) : i);
  if(!punti.length){ centraMappaSuCittaPrincipale(); return; }
  const b = L.latLngBounds(punti.map(i => [i.lat, i.lng]));
  map.fitBounds(b, { padding:[60,60], maxZoom:17 });
}
function geocodificaTutti(){
  const btn = document.getElementById('btn-geocode-all');
  if(btn){ btn.disabled = true; btn.textContent = '...'; }
  const daf = DB.immobili.filter(i => i.geoFonte!=='manuale' && ((!coordValide(i) && !coordValide(coordCondominio(condoDi(i)))) || (i.geoFonte==='indirizzo' && i.geoPreciso===false && !coordValide(coordCondominio(condoDi(i))))));
  let fatti = 0, fall = 0, idx = 0;
  function next(){
    if(idx >= daf.length){ Storage.save(DB); if(btn){ btn.disabled = false; btn.textContent = 'Geocodifica'; } aggiornaMappa(); alert(`Fatti: ${fatti}\nNon trovati: ${fall}`); return; }
    const im = daf[idx];
    geocodifica(im.indirizzo).then(r => { if(r && (r.preciso || !coordValide(im))){ if(im.geoFonte!=='manuale') impostaCoordImmobile(im,r,'indirizzo'); fatti++; } else fall++; idx++; if(btn) btn.textContent = `${fatti+fall}/${daf.length}`; setTimeout(next, 1100); });
  }
  next();
}

 return {ruolo:g('ruolo'), nome:g('nome').trim().toUpperCase(),telefono:g('tel').trim()};
}
function collegaOccupanteCitofono(im, inf){
 if(!im||!inf||inf.ruolo!=='Inquilino'||!(inf.nome||inf.telefono)) return;
 const tel=inf.telefono.replace(/\s+/g,'');
 let p=DB.persone.find(p=>(tel && String(p.telefono||'').replace(/\s+/g,'')===tel)||(inf.nome&&nomeCogn(p).toUpperCase()===inf.nome));
 if(!p && !inf.nome) return;
 if(!p){const n=inf.nome.trim().split(/\s+/);p={id:uid(),cognome:n.shift()||'',nome:n.join(' '),telefono:inf.telefono,ruoli:['CONDUTTORE'],attivita:[],foto:[],createdAt:new Date().toISOString()};DB.persone.push(p);}
 p.ruoli=Array.from(new Set([...(p.ruoli||[]),'CONDUTTORE']));
 if(!Array.isArray(im.occupanti))im.occupanti=[];
 if(!im.occupanti.some(o=>o.personaId===p.id))im.occupanti.push({personaId:p.id,tipo:'Inquilino'});
 inf.personaId=p.id;
}
/* ARANJO 2.12 — operazione, occupazione, conduttori e archivio contrattuale indipendenti */
const TIPI_DOC_LOCAZIONE=['Contratto firmato','Registrazione / ricevuta RLI','Proroga / rinnovo','Cessione / subentro','Disdetta / risoluzione','Deposito cauzionale','Verbale consegna / riconsegna','Inventario / arredi','Ricevute canoni','Comunicazioni','Altro'];
function etichettaOperazione(op){ return op==='entrambi'?'Vendita e affitto':op==='affitto'?'Affitto':op==='vendita'?'Vendita':'Da definire'; }
function locazioneInCorso(im){return !!(im && im.locazione && ['Locato','In scadenza'].includes(im.locazione.stato));}
function haDatiLocazione(im){
 const l=(im&&im.locazione)||{};
 return !!(l.operazione||l.stato||l.canoneRichiesto||l.canoneConcordato||l.contratto||l.scadenzaContratto||(im.occupanti||[]).length||(im.documentiLocazione||[]).length);
}
function datiContrattoPresenti(l){return !!(l.contratto||l.canoneConcordato||l.decorrenzaContratto||l.scadenzaContratto||l.codiceRegistrazione||l.registrazione||l.depositoMensilita);}
function aggiornaDettagliLocazione(){

function salvaLocazioneImmobile(id,next){
 const im=DB.immobili.find(x=>x.id===id);if(!im)return;
 const g=k=>(document.getElementById('loc-'+k)||{}).value||'';
 const op=g('op');
 if(!['vendita','affitto','entrambi'].includes(op)){alert('Seleziona una operazione');return;}
 const prev=im.locazione||{};
 const keys=['stato','decorrenzaContratto','scadenzaContratto','canoneRichiesto','canoneConcordato','speseCondominiali','depositoMensilita','contratto','durata','disponibileDal','arredamento','animali','cedolare','utenze','garanzie','note','registrazione','codiceRegistrazione','noteSubentro'];
 const o={...prev,operazione:op};
 keys.forEach(k=>o[k]=g(k).trim());
 for(const k of ['canoneRichiesto','canoneConcordato','speseCondominiali','depositoMensilita']){
  if(o[k] && (!/^[\d.,\s]+$/.test(o[k])||!Number.isFinite(Number(o[k].replace(',','.').replace(/\s/g,'')))||Number(o[k].replace(',','.').replace(/\s/g,''))<0)){alert('Controlla il valore di '+k);return;}
 }
 if(prev.operazione && prev.operazione!==op){
  o.storicoOperazioni=[...(prev.storicoOperazioni||[]),{data:new Date().toISOString(),da:prev.operazione,a:op}];
 }
 im.locazione=o;im.updatedAt=new Date().toISOString();Storage.save(DB);renderListaImmobili();
 if(next==='conduttori')apriGestioneConduttori(id);else if(next==='documenti')apriArchivioLocazione(id);else apriScheda(id);return true;
}

function scollegaConduttore(imId,pid){

 if(!o||!confirm('Scollegare questo inquilino dall’immobile? La scheda persona e i documenti non vengono eliminati.'))return;

 im.updatedAt=new Date().toISOString();Storage.save(DB);apriGestioneConduttori(imId);

function confermaConduttore(imId,pid){

 im.updatedAt=p.updatedAt=new Date().toISOString();Storage.save(DB);renderPersone();apriGestioneConduttori(imId);

 let h='<div class="form-group">';

 h+=`<div class="form-row"><label for="ld-note" class="form-label">Note</label><textarea class="form-textarea" id="ld-note">${esc(d.note||'')}</textarea></div>`;
 h+=`<div class="form-row"><label for="ld-file" class="form-label">${d.fileId?'Sostituisci allegato (facoltativo)':'Allegato (facoltativo)'}</label><input id="ld-file" type="file" accept="application/pdf,image/*" class="form-input"></div>`;
 if(d.fileId)h+=`<div class="geo-help">Allegato attuale: ${esc(d.nomeFile||'Documento')} · <button class="btn btn-secondary" onclick="scaricaDoc('${d.fileId}')">${ico('download',12)} Scarica</button></div>`;

 if(d.id) h+=`<button class="btn btn-danger" onclick="eliminaDocumentoLocazione('${imId}','${d.id}')">Elimina riferimento</button>`;

async function salvaDocumentoLocazione(imId,docId){
 const im=DB.immobili.find(i=>i.id===imId);if(!im)return;
 const g=k=>((document.getElementById('ld-'+k)||{}).value||'').trim();
 const input=document.getElementById('ld-file');const file=input&&input.files&&input.files[0];
 if(file && file.size>25*1024*1024){alert('Il file supera 25 MB.');return;}
 if(file && !(file.type==='application/pdf'||file.type.startsWith('image/'))){alert('Allega un PDF o una immagine.');return;}
 let d=(im.documentiLocazione||[]).find(x=>x.id===docId);const nuovo=!d;
 const obj={...(d||{}),id:docId||uid(),tipo:g('tipo'),data:g('data'),stato:g('stato'),note:g('note')};
 if(file){
   const fileId='doc_l_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
   try{await PhotoDB.saveDoc(fileId,file,{nome:file.name,mime:file.type,size:file.size});}
   catch(e){alert('Allegato non salvato: '+(e&&e.message||e));return;}
   obj.fileId=fileId;obj.nomeFile=file.name;obj.stato='Presente';
 }
 if(!Array.isArray(im.documentiLocazione))im.documentiLocazione=[];
 if(nuovo) im.documentiLocazione.push(obj);
 else Object.assign(d,obj);
 im.updatedAt=new Date().toISOString();Storage.save(DB);apriArchivioLocazione(imId);
}
function eliminaDocumentoLocazione(imId,docId){
 const im=DB.immobili.find(i=>i.id===imId);if(!im)return;
 if(!confirm('Eliminare questo riferimento documentale?'))return;
 im.documentiLocazione=(im.documentiLocazione||[]).filter(d=>d.id!==docId);
 im.updatedAt=new Date().toISOString();Storage.save(DB);apriArchivioLocazione(imId);
 // Non eliminare il blob qui: puo ancora essere presente in un backup o in un altro riferimento.
}

function avviaDettatura(cb){

  if(!SR){ alert('Dettatura non supportata'); return null; }
  if(_recog){ try{ _recog.stop(); }catch(e){} }
  const r = new SR(); r.lang = 'it-IT'; r.continuous = true; r.interimResults = true;
  let fin = '';
  r.onresult = e => { let int = ''; for(let i = e.resultIndex; i < e.results.length; i++){ const t = e.results[i][0].transcript; if(e.results[i].isFinal) fin += t + ' '; else int += t; } cb(fin+int, fin); };

  r.onend = () => { _recog = null; };

}

function renderMagazzino(){
  const c = document.getElementById('magazzino-lista'); if(!c) return;
  if(!DB.magazzino) DB.magazzino = [];
  let l = DB.magazzino.slice();
  if(magQ) l = l.filter(a => ((a.codice||'')+' '+(a.descrizione||'')+' '+(a.barcode||'')).toLowerCase().indexOf(magQ) >= 0);
  l.sort((a,b) => (a.descrizione||'').localeCompare(b.descrizione||''));
  if(!l.length){ c.innerHTML = `<div class="empty">${ico('pacco',28)}Nessun articolo</div>`; return; }
  let h = '<div class="form-group" style="padding:0;">';
  l.forEach(a => { const low = (a.giacenza||0) <= (a.scorta_minima||0); h += `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);cursor:pointer;" onclick="apriModificaArticolo('${a.id}')"><div style="flex:1;min-width:0;"><div style="font-size:13.5px;font-weight:600;">${esc(a.descrizione||'(no descr)')}</div><div style="font-size:11px;color:var(--tx3);">${esc(a.codice||'')}</div></div><div style="font-size:14px;font-weight:700;color:${low?'var(--vnd)':'var(--blu)'};">${a.giacenza||0} ${esc(a.unita||'pz')}</div></div>`; });
  h += '</div>'; c.innerHTML = h;
}

function salvaArticolo(id){
  const g = x => (document.getElementById(x)||{}).value || '';

  if(id){ const a = DB.magazzino.find(x => x.id === id); if(!a) return; a.codice = g('mg-c'); a.barcode = g('mg-b'); a.descrizione = g('mg-d'); a.unita = g('mg-u'); a.giacenza = parseFloat(g('mg-g'))||0; a.scorta_minima = parseFloat(g('mg-m'))||0; a.prezzo = parseFloat(g('mg-p'))||0; a.updatedAt = new Date().toISOString(); }

function scanBarcode(){
  if(!('BarcodeDetector' in window)){ alert('Scanner non supportato'); return; }
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } }).then(stream => {
    const h = `<div style="border-radius:8px;overflow:hidden;"><video id="scan-v" style="width:100%;display:block;" playsinline autoplay></video></div><div class="btn-row"><button class="btn btn-secondary" onclick="fermaScanner()">Chiudi</button></div>`;
    apriModal('Scanner', h);
    const v = document.getElementById('scan-v'); v.srcObject = stream; v.play();
    const det = new window.BarcodeDetector(); window._scanStream = stream;
    function loop(){
      if(!document.getElementById('scan-v')) return;
      det.detect(v).then(c => {
        if(c.length){ const code = c[0].rawValue; stream.getTracks().forEach(t => t.stop()); chiudiModal(); const art = DB.magazzino.find(a => a.barcode === code); if(art) alert('Trovato: ' + art.descrizione); else if(confirm('Non trovato. Creare?')){ apriNuovoArticolo(); setTimeout(() => { const b = document.getElementById('mg-b'); if(b) b.value = code; }, 100); } return; }
        requestAnimationFrame(loop);
      }).catch(() => requestAnimationFrame(loop));
    }
    loop();
  }).catch(e => alert('Camera: ' + e.message));
}
function fermaScanner(){ if(window._scanStream){ try{ window._scanStream.getTracks().forEach(t => t.stop()); }catch(e){} window._scanStream = null; } chiudiModal(); }

function generaRapportoAttivita(){
 const da=document.getElementById('rp-from').value,al=document.getElementById('rp-to').value;
 if(!da||!al||da>al){alert('Seleziona un intervallo di date valido.');return;}
 const giorno=v=>{const d=String(v||'').slice(0,10).split('-');return d.length===3?d[2]+'/'+d[1]:'';};
 const visibile=a=>{
   const d=String(dataAtt(a)||'').slice(0,10);
   if(d<da||d>al)return false;
   if(a.tipo==='da_fare'&&!a.completata)return false;
   const im=a.immobileId?DB.immobili.find(i=>i.id===a.immobileId):null;
   if((im&&im.stato==='IMM')||(a.entTipo==='immobile'&&a.entStato==='IMM'))return false;
   const t=String(a.testo||a.titolo||'').toLowerCase();
   if(/cambio stato|cambiamento stato|prima compilazione scheda valutazione|prima compilazione della scheda valutazione/.test(t))return false;
   if(a.tipoAtt==='APPUNTAMENTO'&&!(/:\s*[^:]+/.test(t)))return false;
   return true;
 };
 const elenco=raccogliAtt().filter(visibile).sort((a,b)=>String(dataAtt(a)).localeCompare(String(dataAtt(b))));
 const gruppi=new Map();
 elenco.forEach(a=>{
   const key=String(a.entTipo||'altro')+':'+String(a.entId||a.entTitolo||'');
   if(!gruppi.has(key)){
     let titolo=a.entTitolo||'(senza contesto)';
     if(a.entTipo==='immobile'){
       const im=DB.immobili.find(i=>i.id===a.entId);
       if(im)titolo=[['PA','NT','INK','VND'].includes(im.stato)?im.stato:'IMM',im.indirizzo||''].filter(Boolean).join(' — ');
     }else if(a.entTipo==='persona'){
       const p=trovaPersona(a.entId);
       if(p)titolo=((p.ruoli||[]).includes('ACQUIRENTE')?'RR - ':'')+nomeCogn(p);
     }
     gruppi.set(key,{titolo,items:[]});
   }
   gruppi.get(key).items.push(a);
 });
 const righe=['RAPPORTO ATTIVITA ARANJO',`Periodo: ${giorno(da)} – ${giorno(al)}`,''];
 if(!elenco.length)righe.push('Nessuna attivita registrata nel periodo.');
 for(const g of gruppi.values()){
   righe.push(g.titolo);
   g.items.forEach(a=>{
     let descrizione=String(a.testo||a.titolo||'Attivita').replace(/\r\n?/g,'\n').trim();
     if(a.tipoAtt==='APPUNTAMENTO'){
       // L'attivita generata alla chiusura contiene "[data] - TIPO: ESITO · note".
       const m=descrizione.match(/(?:^|\n)[^\n]*?\b[A-Z][A-Z0-9 ]*:\s*(.+)$/i);
       if(m)descrizione=m[1].trim();
       else if(a.descrizioneEsito)descrizione=a.descrizioneEsito;
       else return;
     }
     descrizione=descrizione.replace(/^\[\d{1,2}\/\d{1,2}(?:\/\d{2,4})?[^\]]*\]\s*[-–]?\s*/,'');
     righe.push(`${giorno(dataAtt(a))} — ${descrizione}`);
   });
   righe.push('');
 }
 const testo=righe.join('\n').trimEnd();
 const out=document.getElementById('rp-output');
 out.innerHTML=`<div class="card"><textarea class="form-textarea" id="rp-text" rows="15" readonly></textarea><button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="navigator.clipboard.writeText(document.getElementById('rp-text').value).then(()=>alert('Rapporto copiato')).catch(()=>{document.getElementById('rp-text').select();document.execCommand('copy')})">Copia testo</button></div>`;
 document.getElementById('rp-text').value=testo;
}

function zonaNormalizza(v){
 if(!v)return {competenza:'',macro:[],micro:[]};
 if(typeof v==='object'&&!Array.isArray(v))return {competenza:v.competenza||'',macro:Array.isArray(v.macro)?v.macro:[],micro:Array.isArray(v.micro)?v.micro:[]};
 const arr=Array.isArray(v)?v:[v], clean=arr.map(x=>String(x).toLocaleLowerCase('it').trim());
 for(const [t,macros] of Object.entries(AR_ZONE)){
  const m=Object.keys(macros).filter(k=>clean.includes(k.toLocaleLowerCase('it')));
  const micro=[...new Set(Object.values(macros).flat())].filter(k=>clean.includes(k.toLocaleLowerCase('it')));
  if(m.length||micro.length)return {competenza:t,macro:m,micro};
 }
 return {competenza:'',macro:[],micro:[]};
}
function zonaEtichette(v){
 const z=zonaNormalizza(v);return [z.competenza?('ZONA '+(z.competenza==='Altrui'?'altrui':z.competenza)):null,...z.macro,...z.micro].filter(Boolean);
}
function zonaMatch(z,filter){
 if(!filter||(!filter.competenza&&!filter.macro.length&&!filter.micro.length))return true;
 const a=zonaNormalizza(z);
 return (!filter.competenza||a.competenza===filter.competenza)
 && (!filter.macro.length||filter.macro.some(k=>a.macro.includes(k)))
 && (!filter.micro.length||filter.micro.some(k=>a.micro.includes(k)));
}
function zonaEditor(id,initial,filter=false){
 const z=zonaNormalizza(initial);
 const t=z.competenza||'ZdF';
 const idAttr=esc(id);
 let h=`<div class="zone-editor" id="${idAttr}" data-filter="${filter?'1':'0'}"><div class="form-label">Competenza · scelta esclusiva</div><div class="zone-chips">`;
 for(const k of Object.keys(AR_ZONE))h+=`<button type="button" class="zone-chip ${k===z.competenza?'active':''}" data-zt="${esc(k)}" onclick="zonaEditorTipo('${id}',${argEvento(k)})">${k==='ZdF'?'ZONA ZdF':k==='Altrui'?'ZONA altrui':'ZONA Libera'}</button>`;
 h+='</div><div class="zone-editor-detail">';
 h+=zonaEditorDettagli(id,t,z.macro,z.micro);
 h+='</div></div>';return h;
}
function zonaEditorDettagli(id,t,macro,micro){
 let h='<div class="form-label" style="margin-top:12px">Macro zone · selezione multipla</div><div class="zone-chips">';
 for(const m of Object.keys(AR_ZONE[t]||{}))h+=`<button type="button" class="zone-chip ${macro.includes(m)?'active':''}" data-zm="${esc(m)}" onclick="zonaEditorToggle('${id}','macro',${argEvento(m)})">${esc(m)}</button>`;
 h+='</div>';
 const all=[...new Set((macro.length?macro:Object.keys(AR_ZONE[t]||{})).flatMap(m=>AR_ZONE[t][m]||[]))];
 if(all.length){h+='<div class="form-label" style="margin-top:12px">Micro zone · selezione multipla</div><div class="zone-chips">';for(const m of all)h+=`<button type="button" class="zone-chip ${micro.includes(m)?'active':''}" data-zu="${esc(m)}" onclick="zonaEditorToggle('${id}','micro',${argEvento(m)})">${esc(m)}</button>`;h+='</div>';}
 return h;
}
function zonaEditorVal(id){
 const e=document.getElementById(id);if(!e)return {competenza:'',macro:[],micro:[]};
 return {competenza:e.querySelector('[data-zt].active')?.dataset.zt||'',macro:[...e.querySelectorAll('[data-zm].active')].map(x=>x.dataset.zm),micro:[...e.querySelectorAll('[data-zu].active')].map(x=>x.dataset.zu)};
}
function zonaEditorTipo(id,t){
 const e=document.getElementById(id);if(!e)return;
 const was=zonaEditorVal(id);
 e.querySelectorAll('[data-zt]').forEach(b=>b.classList.toggle('active',b.dataset.zt===t&&was.competenza!==t));
 const selected=was.competenza===t?'':t;
 e.querySelector('.zone-editor-detail').innerHTML=selected?zonaEditorDettagli(id,selected,[],[]):'';
}
function zonaEditorToggle(id,kind,value){
 const e=document.getElementById(id);if(!e)return;
 const z=zonaEditorVal(id),t=z.competenza;if(!t)return;
 const arr=kind==='macro'?z.macro:z.micro;
 const next=arr.includes(value)?arr.filter(x=>x!==value):[...arr,value];
 if(kind==='macro')z.macro=next;else z.micro=next;
 const allowed=new Set((z.macro.length?z.macro:Object.keys(AR_ZONE[t])).flatMap(m=>AR_ZONE[t][m]||[]));
 z.micro=z.micro.filter(x=>allowed.has(x));
 e.querySelector('.zone-editor-detail').innerHTML=zonaEditorDettagli(id,t,z.macro,z.micro);
}
function zonaCondominio(co){return zonaNormalizza(((DB.condomini||{})[co]||{}).zonaCompetenza||((DB.condomini||{})[co]||{}).zone);}
function zonaImmobile(im){
 if(!im.villa&&condoDi(im)){const co=condoDi(im);const d=(DB.condomini||{})[co];if(d&&(d.zonaCompetenza||((d.zone||[]).length)))return zonaCondominio(co);}
 return zonaNormalizza(im.zonaCompetenza||im.zone);
}
let arZonaTipo='ZdF',arZoneMacro=new Set(),arZoneMicro=new Set();
function arZonaTipoSet(tipo){arZonaTipo=tipo;arZoneMacro.clear();arZoneMicro.clear();renderZoneCompetenza();}
function arZonaMacroToggle(m){arZoneMacro.has(m)?arZoneMacro.delete(m):arZoneMacro.add(m);arZoneMicro=new Set([...arZoneMicro].filter(z=>[...arZoneMacro].some(k=>AR_ZONE[arZonaTipo][k].includes(z))));renderZoneCompetenza();}
function arZonaMicroToggle(z){arZoneMicro.has(z)?arZoneMicro.delete(z):arZoneMicro.add(z);renderZoneCompetenza();}
function renderZoneCompetenza(){
 const c=document.getElementById('zone-lista');if(!c)return;
 let h='<div class="card"><div class="form-label">Competenza · scelta esclusiva</div><div class="zone-chips">';
 Object.keys(AR_ZONE).forEach(t=>h+=`<button class="zone-chip ${t===arZonaTipo?'active':''}" onclick="arZonaTipoSet('${t}')">${t==='ZdF'?'ZONA ZdF':t==='Altrui'?'ZONA altrui':'ZONA Libera'}</button>`);
 h+='</div><div class="form-label" style="margin-top:15px">Macro zone · selezione multipla</div><div class="zone-chips">';
 Object.keys(AR_ZONE[arZonaTipo]).forEach(m=>h+=`<button class="zone-chip ${arZoneMacro.has(m)?'active':''}" onclick="arZonaMacroToggle(${argEvento(m)})">${esc(m)}</button>`);
 h+='</div>';
 const micros=[...new Set([...arZoneMacro].flatMap(m=>AR_ZONE[arZonaTipo][m]))];
 if(micros.length){h+='<div class="form-label" style="margin-top:15px">Micro zone · selezione multipla</div><div class="zone-chips">';micros.forEach(z=>h+=`<button class="zone-chip ${arZoneMicro.has(z)?'active':''}" onclick="arZonaMicroToggle(${JSON.stringify(z)})">${esc(z)}</button>`);h+='</div>';}
 h+='</div>';c.innerHTML=h;
}

function eseguiRicerca(q){

  if(qq.length < 2){ c.innerHTML = '<div class="empty" style="padding:20px 8px;font-size:12px;">Digita 2+ caratteri</div>'; return; }
  const res = { p:[], i:[], a:[], c:[] };
  DB.persone.forEach(p => { const f = [nomeCompleto(p), p.telefono, p.email, p.cf].map(x => String(x == null ? '' : x).toLowerCase()); if(f.some(x => x.indexOf(qq) >= 0)) res.p.push(p); });
  DB.immobili.forEach(im => { const props = propsImmobile(im).map(x => nomeCogn(x.persona)); const f = [im.indirizzo, im.cognomeNome, im.telefono, im.citofono, im.condominio].concat(props).map(x => String(x == null ? '' : x).toLowerCase()); if(f.some(x => x.indexOf(qq) >= 0)) res.i.push(im); });
  raccogliAtt().forEach(a => { const f = [a.testo, a.entTitolo].map(x => String(x == null ? '' : x).toLowerCase()); if(f.some(x => x.indexOf(qq) >= 0)) res.a.push(a); });
  for(const co in (DB.condomini||{})) if(co.toLowerCase().indexOf(qq) >= 0) res.c.push(co);
  let h = '';
  if(res.p.length){ h += '<div style="font-size:10.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;margin:6px 0 4px;">Persone</div>'; res.p.slice(0,8).forEach(p => h += `<div class="immobile-line" style="margin-bottom:5px;" onclick="setTimeout(() => apriSchedaPersona('${p.id}'),100)"><span class="txt">${esc(nomeCogn(p))}</span></div>`); }

const blobToB64 = b => new Promise((r,j) => { const rd = new FileReader(); rd.onload = () => { const s = rd.result; r(s.split(',')[1] || s); }; rd.onerror = () => j(rd.error); rd.readAsDataURL(b); });
function b64ToBlob(b, m){

function esportaBackup(){

    if(ok === false) throw new Error('Il salvataggio dei dati non e riuscito. Backup interrotto per evitare un file incoerente.');
    const bk = { formato:'ARANJO_BACKUP', versione:DB_VERSION, exportedAt:new Date().toISOString(), db:JSON.parse(JSON.stringify(DB)), foto:[], documenti:[] };
    return PhotoDB.keys().then(pk => {

function importaBackup(e){
  const f = e && e.target && e.target.files && e.target.files[0]; if(!f) return;
  const input = e.target;

    try{
      const p = JSON.parse(ev.target.result);
      if(!p || typeof p !== 'object' || Array.isArray(p)) throw new Error('Il file non contiene un oggetto JSON valido.');
      const isNew = !!(p.db && p.versione);
      const dd = isNew ? p.db : p;
      if(!dd || typeof dd !== 'object' || Array.isArray(dd)) throw new Error('Nel file manca il database.');
      const campi = ['immobili','persone','attivita','appuntamenti','pianificazioni','chiamate','magazzino','rapportini'];
      if(!campi.some(k => Array.isArray(dd[k]))) throw new Error('Il file non sembra un backup ARANJO valido. Nessun dato e stato modificato.');
      for(const k of ['immobili','persone','attivita','appuntamenti','pianificazioni','chiamate','magazzino','rapportini']){
        if(dd[k] != null && !Array.isArray(dd[k])) throw new Error(`Il campo "${k}" non e valido. Nessun dato e stato modificato.`);
      }
      for(const k of ['foto','documenti']){
        if(isNew && p[k] != null && !Array.isArray(p[k])) throw new Error(`La sezione "${k}" del backup non e valida.`);
        if(isNew && Array.isArray(p[k]) && p[k].some(x => !x || typeof x.id !== 'string' || typeof x.data !== 'string')) throw new Error(`Un elemento della sezione "${k}" e incompleto.`);
      }
      const nImm = Array.isArray(dd.immobili)?dd.immobili.length:0;
      const nPers = Array.isArray(dd.persone)?dd.persone.length:0;
      if(!confirm(`IMPORTARE IL BACKUP?\n\nIl database attuale verra sostituito.\nNel file: ${nImm} immobili e ${nPers} persone.\n\nPrima di continuare, assicurati di avere esportato il database attuale.`)) return;
      let nuovoDB = Storage.migra(dd);
      if(!nuovoDB.coordinateCondomini) nuovoDB.coordinateCondomini = {};
      if(!nuovoDB.condomini) nuovoDB.condomini = {};
      if(!nuovoDB.pianificazioni) nuovoDB.pianificazioni = [];
      if(!Array.isArray(nuovoDB.attivita)) nuovoDB.attivita = [];
      if(!Array.isArray(nuovoDB.chiamate)) nuovoDB.chiamate = [];
      if(!Array.isArray(nuovoDB.magazzino)) nuovoDB.magazzino = [];
      if(!Array.isArray(nuovoDB.rapportini)) nuovoDB.rapportini = [];

      let ch = Promise.resolve();
      if(isNew && Array.isArray(p.foto)) p.foto.forEach(f2 => { ch = ch.then(() => { const b = b64ToBlob(f2.data, (f2.meta && f2.meta.mime) || 'image/jpeg'); return PhotoDB.save(f2.id, b, f2.meta||{}); }); });
      if(isNew && Array.isArray(p.documenti)) p.documenti.forEach(f2 => { ch = ch.then(() => { const b = b64ToBlob(f2.data, (f2.meta && f2.meta.mime) || 'application/octet-stream'); return PhotoDB.saveDoc(f2.id, b, f2.meta||{}); }); });
      ch.then(() => {
        DB = nuovoDB;
        return Storage.save(DB).then(ok => { if(ok === false) throw new Error('Salvataggio del database importato non riuscito.'); });
      }).then(() => {
        try{
          renderListaImmobili(); aggiornaInfoSistema(); if(map) aggiornaMappa(); renderPersone(); renderAttivita(); aggiornaBadgeAttivita(); aggiornaAgendaSettimanale(); renderPlanning(); aggiornaHeaderApp(); renderChiamateOggi(); renderMagazzino(); renderRapportini();
          schedulaNotifiche();

        alert(`Importazione completata.\nImmobili: ${(DB.immobili||[]).length}\nPersone: ${(DB.persone||[]).length}\n\nNota: gli allegati presenti nel backup sono stati importati, ma quelli precedenti non inclusi nel file non vengono cancellati automaticamente.`);
      }).catch(err => {
        console.error('Importazione backup fallita',err);
        DB = oldDB;
        alert('Importazione non completata: ' + (err.message||err) + '\nIl database attivo e stato mantenuto, se l’errore e avvenuto prima del salvataggio. Verifica gli allegati e importa nuovamente da un backup valido.');

  };

}

function richiediPermessoNotifiche(sa){
  if(!('Notification' in window)){ if(sa) alert('Non supportate'); return Promise.resolve(false); }
  if(Notification.permission === 'granted'){ if(sa) alert('Gia attive'); return Promise.resolve(true); }
  if(Notification.permission === 'denied'){ if(sa) alert('Bloccate'); return Promise.resolve(false); }
  return Notification.requestPermission().then(p => { if(p === 'granted') schedulaNotifiche(); if(sa) alert(p === 'granted' ? 'Notifiche attivate. Su iPhone il sito deve poter restare attivo: i timer del browser non equivalgono a notifiche push affidabili.' : 'Permesso negato'); return p === 'granted'; });
}
const _aranjoTimerNotifiche = new Map();
function schedulaNotifiche(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const ad = Date.now(), fin = ad + 24*60*60*1000;
  const desiderate = new Map();
  (DB.appuntamenti||[]).forEach(a => {
    if(!a || !a.id || a.stato === 'annullato' || a.stato === 'eseguito') return;
    const t = new Date(a.dataInizio).getTime(); if(!Number.isFinite(t) || t < ad-15*60*1000 || t > fin) return;
    const quando = Math.max(ad+1000, t-15*60*1000);
    desiderate.set('app:'+a.id, {quando, titolo:'Appuntamento tra 15 minuti', testo:a.titolo||'Appuntamento'});
  });
  raccogliAtt().forEach(a => {
    if(!a || !a.id || a.tipo !== 'da_fare' || a.completata) return;
    const t = new Date(a.dataPrevista).getTime(); if(!Number.isFinite(t) || t < ad || t > fin) return;
    desiderate.set('att:'+a.id, {quando:Math.max(ad+1000,t), titolo:'Attivita in programma', testo:a.testo||'Attivita da fare'});
  });
  for(const [key, timer] of _aranjoTimerNotifiche.entries()){
    const nuova = desiderate.get(key);
    if(!nuova || nuova.quando !== timer.quando){ clearTimeout(timer.id); _aranjoTimerNotifiche.delete(key); }
  }
  for(const [key, info] of desiderate.entries()){
    if(_aranjoTimerNotifiche.has(key)) continue;
    const id = setTimeout(() => {
      _aranjoTimerNotifiche.delete(key);
      // Non mostrare notifiche obsolete dopo modifiche o completamenti.
      if(key.startsWith('app:')){
        const a = (DB.appuntamenti||[]).find(x=>('app:'+x.id)===key);
        if(!a || a.stato === 'annullato' || a.stato === 'eseguito') return;
      }else{
        const a = raccogliAtt().find(x=>('att:'+x.id)===key);
        if(!a || a.tipo !== 'da_fare' || a.completata) return;
      }
      notifica(info.titolo, info.testo);
    }, Math.max(1000, info.quando-ad));
    _aranjoTimerNotifiche.set(key,{id,quando:info.quando});
  }
}

function prezzoRef(im){
  const z = im.prezzi || {};
  const ric = parseNum(z.richiesto), mer = parseNum(z.mercato), ult = parseNum(z.ultimo), ven = parseNum(z.venduto);
  if(im.stato === 'VND' && ven !== null) return ven;
  if(ult !== null) return ult;
  if(ric !== null && mer !== null) return Math.min(ric, mer);
  return ric !== null ? ric : mer;
}

const COND_KEYS = ['cappotto','isolamentoAcustico','ascensore','nAscensori','portineria','montacarichi','cortile','giardinoCondo','accessoCarrabile','androne','piscina','annoCostruzione'];
const condoData = im => {
  if(im.villa) return null;
  const c = condoDi(im); if(!c) return null;
  return (DB.condomini && DB.condomini[c]) || null;
};
function mergeCond(im, key, immVal){
  const cd = condoData(im); if(!cd) return immVal;
  const ds = cd.datiStrutturali || {};
  if(COND_KEYS.includes(key)){
    const v = ds[key];
    if(v !== undefined && v !== null && v !== '') return v;
    if(key === 'annoCostruzione' && cd.annoCostruzione) return cd.annoCostruzione;
  }
  return immVal;
}
